add('c19-agriculture','mcq','Why can intensive livestock production be less energy-efficient than humans eating crops directly?',{options:['Livestock respire and lose energy as heat and waste before humans eat them','Livestock contain no chemical energy','Crop plants do not respire','Humans cannot digest crop plants'],answer:0},'Feeding crops through livestock adds a trophic level where energy is lost by respiration, heat and waste.');
add('c19-agriculture','order','Arrange this source-based sequence showing how monoculture can increase chemical dependence.',{items:['More fertiliser and pesticide input may be required','One crop species is grown repeatedly over a large area','Specific soil mineral ions are depleted and pest/disease vulnerability rises','Biodiversity within the agricultural area is reduced'],answer:['One crop species is grown repeatedly over a large area','Biodiversity within the agricultural area is reduced','Specific soil mineral ions are depleted and pest/disease vulnerability rises','More fertiliser and pesticide input may be required']},'The guide links monoculture with reduced biodiversity, nutrient depletion and greater reliance on fertilisers and pesticides.');
add('c19-agriculture','written','Evaluate two benefits and several biological or environmental costs of modern intensive agriculture described in the guide.',{rubric:['Machinery can cultivate large areas rapidly and reduce labour per unit output.','Fertilisers, pesticides, herbicides and selective breeding can increase food production or yield.','Monoculture can reduce biodiversity.','Monoculture can increase vulnerability to pests and diseases.','Repeated monoculture can deplete particular soil mineral ions and increase fertiliser dependence.','Crowded livestock conditions can increase disease spread and antibiotic use.','Animal waste can contribute to eutrophication.','Feeding crops to livestock adds trophic-level energy losses compared with eating crops directly.']},'Balance production benefits against ecological, disease and energy-transfer consequences listed in the guide.');

add('c19-deforestation','mcq','Which consequence follows most directly from losing tree roots that normally anchor soil?',{options:['Increased soil erosion','Reduced combustion','Greater nitrogen fixation','Less surface runoff'],answer:0},'Without roots binding the soil, topsoil is more easily removed by rain and wind.');
add('c19-deforestation','fill','Large-scale removal of trees from forests is called _____.',{answer:['deforestation']},'Deforestation is large-scale tree clearance.');
add('c19-deforestation','multi','Which are listed consequences of large-scale deforestation?',{options:['Loss of biodiversity','Soil erosion','Increased flooding','Higher atmospheric carbon dioxide','Reduced local humidity and rainfall','Guaranteed increase in soil fertility'],answer:[0,1,2,3,4]},'The guide links deforestation to habitat loss, erosion, flooding, carbon-cycle disruption and reduced transpiration/rainfall.');
add('c19-deforestation','match','Match each lost tree function to the consequence described in the guide.',{pairs:[['Roots anchoring soil','More soil erosion when trees are removed'],['Canopy intercepting rainfall','More direct rain impact and surface runoff after clearance'],['Photosynthesis removing carbon dioxide','More carbon dioxide remains in the atmosphere when tree cover falls'],['Transpiration releasing water vapour','Lower local atmospheric humidity after deforestation']]},'Tree roots, canopies, photosynthesis and transpiration each influence different consequences of forest clearance.');
add('c19-deforestation','matrix','Check these statements about habitat destruction and forest clearance.',{rows:[['Agriculture, housing, mining and roads can destroy habitats.',true],['Burning cleared trees can release stored carbon as carbon dioxide.',true],['Deforestation always lowers surface runoff.',false],['Silt from eroded soil can raise riverbeds and increase flood risk.',true]]},'Forest removal can raise runoff and erosion while decreasing carbon uptake.');
add('c19-deforestation','mcq','Why can deforestation increase atmospheric carbon dioxide by two mechanisms at once?',{options:['Less photosynthesis removes less CO2, while burning or decay releases stored carbon','Trees stop all respiration and nitrogen fixation','More transpiration produces carbon dioxide','Tree roots convert oxygen directly into carbon dioxide'],answer:0},'Fewer trees remove less carbon dioxide through photosynthesis, while combustion or decay of biomass releases carbon dioxide.');
add('c19-deforestation','order','Arrange the flooding pathway described after major forest clearance.',{items:['Flood risk increases','Tree interception and root uptake fall','Surface runoff increases','Eroded soil can silt up river channels'],answer:['Tree interception and root uptake fall','Surface runoff increases','Eroded soil can silt up river channels','Flood risk increases']},'Reduced interception and uptake increase runoff, while erosion and silt can further raise river levels.');
add('c19-deforestation','written','Explain four ecological or physical consequences of large-scale deforestation using linked mechanisms.',{rubric:['Habitat loss reduces biodiversity and can cause extinction or disrupt food webs.','Loss of roots and canopy protection increases soil erosion.','Reduced interception and root water uptake increase surface runoff and flood risk.','Eroded soil can silt up riverbeds and contribute to flooding.','Reduced photosynthesis leaves more carbon dioxide in the atmosphere.','Burning or decay of cleared trees releases stored carbon dioxide.','Reduced transpiration lowers local atmospheric humidity and can reduce rainfall.']},'Link each consequence to the biological or physical role that trees previously performed.');

add('c19-water-pollution','mcq','What event comes immediately after nutrient enrichment at the start of eutrophication?',{options:['Rapid growth of surface algae forming an algal bloom','Immediate increase in dissolved oxygen','Instant death of all decomposers','Removal of all nitrate ions by fish'],answer:0},'High nitrate or phosphate concentrations promote rapid algal growth at the water surface.');
add('c19-water-pollution','fill','The dense growth of algae at the water surface during eutrophication is called an algal _____.',{answer:['bloom']},'An algal bloom develops after nutrient enrichment.');
add('c19-water-pollution','multi','Which harmful effects of plastic pollution are described in the guide?',{options:['Entanglement of marine animals','Choking','Ingestion causing the stomach to fill','Microplastics entering food chains','Rapid complete biodegradation by decomposers'],answer:[0,1,2,3]},'The guide describes persistence, entanglement, ingestion and microplastic entry into food chains.');
add('c19-water-pollution','match','Match each eutrophication step to what happens next.',{pairs:[['Fertiliser ions or sewage enter water','Nutrient concentration increases'],['Algal bloom develops','Light reaching submerged plants decreases'],['Submerged plants die','More dead organic material is available to decomposers'],['Aerobic decomposers multiply','Dissolved oxygen is used up faster']]},'Eutrophication is a linked sequence from nutrient enrichment to oxygen depletion.');
add('c19-water-pollution','matrix','Evaluate these pollution statements.',{rows:[['The guide describes synthetic plastics as non-biodegradable.',true],['Eutrophication can begin with nitrate/phosphate leaching or untreated sewage.',true],['Decomposer respiration raises dissolved oxygen during eutrophication.',false],['Submerged plants may die because algal blooms block light.',true]]},'Aerobic decomposers consume dissolved oxygen during respiration, so oxygen concentration falls rather than rises.');
add('c19-water-pollution','mcq','Why do fish often die late in the eutrophication sequence?',{options:['Aerobic decomposers consume dissolved oxygen while breaking down dead material','Algae convert all oxygen directly into nitrate','Fish become unable to absorb sunlight','Fertilisers instantly block fish gills before any biological changes occur'],answer:0},'Decomposer populations increase and their aerobic respiration lowers dissolved oxygen to levels that cannot support many aquatic animals.');
add('c19-water-pollution','order','Put the main eutrophication events in the sequence given in the guide.',{items:['Dissolved oxygen falls and aquatic animals die','Algal bloom blocks light','Nutrients enter the water','Submerged plants die','Aerobic decomposers multiply and respire'],answer:['Nutrients enter the water','Algal bloom blocks light','Submerged plants die','Aerobic decomposers multiply and respire','Dissolved oxygen falls and aquatic animals die']},'The critical chain is nutrient enrichment → algal bloom → reduced light → plant death → decomposition → oxygen depletion.');
add('c19-water-pollution','written','Describe and explain eutrophication from fertiliser leaching to the death of aquatic animals.',{rubric:['Nitrate/phosphate ions leach or wash into the water.','High nutrient concentration causes rapid algal growth / an algal bloom.','The algal bloom blocks light reaching submerged plants.','Submerged plants photosynthesise less and die.','Dead plants and algae are decomposed by aerobic bacteria.','The decomposer population increases.','Bacteria use dissolved oxygen during aerobic respiration.','Dissolved oxygen falls and fish or other aquatic animals die from lack of oxygen.']},'Keep the steps in sequence and state explicitly that bacteria use oxygen during aerobic respiration.');

add('c19-air-climate','mcq','Which pair of gases is identified as causing acid rain when released by fossil-fuel combustion?',{options:['Sulfur dioxide and nitrogen oxides','Oxygen and nitrogen','Carbon dioxide and oxygen','Methane and hydrogen'],answer:0},'Sulfur dioxide and nitrogen oxides dissolve in rainwater and form dilute acids.');
add('c19-air-climate','fill','Earth re-emits absorbed solar energy mainly as long-wavelength _____ radiation.',{answer:['infrared','infra-red','thermal infrared','thermal']},'The guide describes long-wavelength infrared thermal radiation leaving Earth\'s surface.');
add('c19-air-climate','multi','Which consequences of global warming are listed in the guide?',{options:['Sea-level rise and coastal flooding','Droughts, severe storms and heatwaves','Shifts in biomes and species distributions','Ocean acidification and coral bleaching','Permanent removal of all greenhouse gases'],answer:[0,1,2,3]},'The guide lists ice melt/sea-level rise, extreme weather, distribution shifts, ocean acidification and coral bleaching.');
add('c19-air-climate','match','Match each atmospheric change to the consequence described in the guide.',{pairs:[['Sulfur dioxide / nitrogen oxides in rainwater','Acid rain'],['More atmospheric carbon dioxide and methane','Enhanced greenhouse effect'],['Acidified freshwater','Harm to fish eggs and aquatic organisms'],['More trapped infrared radiation','Increase in global mean temperature']]},'Acid rain and global warming have different atmospheric mechanisms and consequences.');
add('c19-air-climate','matrix','Evaluate these statements about air pollution and climate.',{rows:[['Greenhouse gases absorb and re-emit long-wave thermal radiation.',true],['The enhanced greenhouse effect is caused because greenhouse gases block all incoming sunlight.',false],['Acid rain can damage tree leaves and bark.',true],['Methane is listed as a greenhouse gas in the guide.',true]]},'Greenhouse gases allow much incoming short-wave radiation through but absorb and re-emit outgoing infrared radiation.');
add('c19-air-climate','mcq','Which statement best describes the enhanced greenhouse effect in the guide?',{options:['Higher greenhouse-gas concentrations cause more outgoing infrared radiation to be absorbed and re-emitted, trapping extra heat','Ozone converts all visible light into carbon dioxide','Acid rain reflects all solar radiation back to space','Methane removes heat from the atmosphere'],answer:0},'The mechanism depends on absorption and re-emission of Earth\'s long-wave thermal radiation by greenhouse gases.');
add('c19-air-climate','order','Arrange the enhanced greenhouse-effect sequence.',{items:['Global mean temperature rises','Earth emits long-wave infrared radiation','Solar radiation passes through the atmosphere and warms Earth','Greenhouse gases absorb and re-emit some infrared radiation'],answer:['Solar radiation passes through the atmosphere and warms Earth','Earth emits long-wave infrared radiation','Greenhouse gases absorb and re-emit some infrared radiation','Global mean temperature rises']},'The guide moves from incoming solar energy to outgoing infrared absorption and increased warming.');
add('c19-air-climate','written','Explain the enhanced greenhouse effect and distinguish it from acid-rain formation.',{rubric:['Short-wave solar radiation passes through the atmosphere and warms Earth\'s surface.','Earth emits long-wave infrared thermal radiation.','Greenhouse gases such as carbon dioxide and methane absorb and re-emit some infrared radiation.','Higher greenhouse-gas concentrations retain more thermal energy and raise global mean temperature.','Acid rain is linked to sulfur dioxide and nitrogen oxides from fossil-fuel combustion.','These gases dissolve in rainwater to form dilute acids.','Acid rain can acidify freshwater and damage vegetation or structures.']},'Keep the greenhouse mechanism separate from the sulfur/nitrogen oxide chemistry of acid rain.');

add('c19-toxins','mcq','Which statement correctly distinguishes bioaccumulation from biomagnification?',{options:['Bioaccumulation is build-up within one organism; biomagnification is increasing concentration at successive trophic levels','Both terms mean an algal bloom','Bioaccumulation occurs only in plants while biomagnification occurs only in water','Biomagnification means toxins are rapidly excreted'],answer:0},'Bioaccumulation concerns one organism over time; biomagnification concerns rising concentration along a food chain.');
add('c19-toxins','fill','An increase in concentration of a persistent toxin at successive trophic levels is called _____.',{answer:['biomagnification','biological magnification']},'Biomagnification describes increasing toxin concentration from lower to higher trophic levels.');
add('c19-toxins','multi','Which statements help explain why top predators can have the highest toxin concentration?',{options:['Persistent toxins are not readily broken down','Primary consumers eat many contaminated producers','Higher consumers eat many contaminated prey','Toxins can remain in body tissues','Each trophic level instantly destroys the toxin'],answer:[0,1,2,3]},'Persistence plus repeated feeding causes toxin concentration to rise through food chains.');
add('c19-toxins','match','Match each term or stage to its meaning.',{pairs:[['Persistent toxin','Chemical not readily broken down by biological processes'],['Bioaccumulation','Toxin builds up within one organism over time'],['Biomagnification','Toxin concentration increases at higher trophic levels'],['Top predator','Can receive high toxin doses from many contaminated prey']]},'The guide distinguishes persistence, accumulation within organisms and magnification between trophic levels.');
add('c19-toxins','matrix','Check these statements about persistent pollutants.',{rows:[['Low toxin concentrations can enter producers from water or soil.',true],['Top predators may accumulate high concentrations after eating many contaminated prey.',true],['Biomagnification means toxin concentration decreases at higher trophic levels.',false],['The guide links high toxin levels with reproductive failure or organ damage.',true]]},'Persistent toxins can become increasingly concentrated toward the top of food chains.');
add('c19-toxins','mcq','Why can a predator accumulate more persistent toxin than a single prey organism contains?',{options:['It consumes many contaminated prey and retains toxin that is not readily broken down or excreted','It creates the toxin by photosynthesis','It eats only uncontaminated prey','Its trophic level prevents chemicals entering its tissues'],answer:0},'Repeated feeding plus persistence allows a high body burden to develop in top consumers.');
add('c19-toxins','order','Arrange the food-chain biomagnification sequence from the lowest initial exposure to the top predator.',{items:['Top carnivores consume many contaminated organisms and reach high toxin concentrations','Primary producers absorb low concentrations from water or soil','Primary consumers eat many contaminated producers','Secondary consumers eat contaminated primary consumers'],answer:['Primary producers absorb low concentrations from water or soil','Primary consumers eat many contaminated producers','Secondary consumers eat contaminated primary consumers','Top carnivores consume many contaminated organisms and reach high toxin concentrations']},'The same persistent chemical can become more concentrated as it moves through successive feeding levels.');
add('c19-toxins','written','Explain how a persistent pesticide or heavy metal can become concentrated in a top predator and state possible biological effects.',{rubric:['A persistent toxin is not readily broken down by biological processes.','Producers absorb low concentrations from water or soil.','Primary consumers eat many producers and accumulate the toxin in their tissues.','Higher consumers eat many contaminated organisms.','Toxin concentration therefore increases at successive trophic levels (biomagnification).','Top predators may reach very high concentrations.','The guide lists reproductive failure / eggshell thinning, organ failure or death as possible effects.']},'Use bioaccumulation for build-up within organisms and biomagnification for the increase between trophic levels.');

add('c19-conservation','mcq','Which fishery rule most directly allows juvenile fish to escape and reach breeding age?',{options:['Increasing minimum net mesh size','Reducing mesh size','Fishing more heavily during breeding season','Removing all catch limits'],answer:0},'Larger mesh sizes allow smaller juvenile fish to pass through the net and mature.');
add('c19-conservation','fill','Cutting only selected mature trees instead of clearing an entire forest is called selective _____.',{answer:['felling','logging']},'Selective felling removes chosen mature trees rather than clear-felling whole areas.');
add('c19-conservation','multi','Which methods are listed for conserving endangered species?',{options:['Habitat protection','Captive breeding and reintroduction','Seed banks','Botanic gardens','Trade restrictions such as CITES','Unrestricted harvesting'],answer:[0,1,2,3,4]},'The guide lists habitat protection, breeding programmes, seed banks, botanic gardens and trade restrictions.');
add('c19-conservation','match','Match each management method to its conservation purpose.',{pairs:[['Fishing quota','Limits total catch'],['Large net mesh size','Allows juveniles to escape'],['Closed season','Protects fish during breeding'],['Replanting after felling','Replaces harvested trees']]},'Sustainable management aims to let populations or resources replace what is removed.');
add('c19-conservation','matrix','Evaluate these statements about sustainability and conservation.',{rows:[['A sustainable resource is produced as rapidly as it is consumed.',true],['Coppicing allows new shoots to grow from a cut stump.',true],['Marine protected areas can allow fish stocks to recover.',true],['Conservation is justified only by economic value.',false]]},'The guide gives ecological, medical, genetic, economic and ethical reasons for conservation.');
add('c19-conservation','mcq','Why can closed fishing seasons improve sustainability?',{options:['They reduce fishing pressure during breeding so more fish can reproduce','They permanently prevent all fish reproduction','They make juvenile fish smaller','They increase catch without limit'],answer:0},'Protecting stocks during breeding increases the chance that enough offspring are produced to replace harvested fish.');
add('c19-conservation','order','Arrange the selective-breeding conservation pathway described for a captive population.',{items:['Offspring are eventually reintroduced into the wild when appropriate','Endangered animals are bred in captivity','Population size is increased under protected conditions','Suitable individuals are managed through a conservation breeding programme'],answer:['Suitable individuals are managed through a conservation breeding programme','Endangered animals are bred in captivity','Population size is increased under protected conditions','Offspring are eventually reintroduced into the wild when appropriate']},'The guide describes captive breeding as increasing numbers under protection followed by wild reintroduction.');
add('c19-conservation','written','Explain how forests, fish stocks and endangered species can be managed sustainably or conserved using methods in the guide.',{rubric:['Sustainable timber can use selective felling rather than clear-felling.','Felled trees can be replaced by replanting / reforestation; coppicing can allow regrowth.','Fish catches can be limited using quotas.','Larger mesh sizes allow juvenile fish to escape and breed.','Closed seasons can protect breeding fish, and marine protected areas can provide no-take refuges.','Habitat protection can conserve endangered species in the wild.','Captive breeding and reintroduction can increase endangered animal populations.','Seed banks, botanic gardens and trade restrictions can protect endangered plants or species.']},'Choose named methods and explain how they reduce depletion or increase the chance of populations recovering.');


// Chapter 20 · Biotechnology and genetic modification
const C20TOPICS = [{"id":"c20-biotech","chapter":20,"name":"Harness microorganisms","short":"Biotechnology & microorganisms","icon":"01","desc":"Explain why microbes are useful in biotechnology and connect yeast fermentation to bread and biofuel production.","notes":[["Biotechnology","Biotechnology is the application of biological organisms, systems or processes to manufacturing and service industries to produce useful products."],["Why microorganisms?","Bacteria and fungi/yeast grow and reproduce rapidly, need relatively simple inexpensive nutrients, occupy little space and can make useful organic molecules."],["Plasmids and genetic code","Bacterial plasmids are small DNA loops that can be manipulated as vectors. The shared genetic code allows transferred genes to be expressed in microorganisms."],["Yeast fermentation","In anaerobic respiration, yeast converts glucose to ethanol and carbon dioxide: glucose → ethanol + carbon dioxide."],["Bioethanol","Sugar- or starch-rich plant material is converted to glucose, fermented by yeast, then ethanol is distilled and can be blended with petrol as a renewable biofuel."],["Bread making","Yeast releases carbon dioxide in dough. The gas is trapped by gluten and makes the dough rise; during baking ethanol evaporates, yeast is killed and the structure sets."]]},{"id":"c20-enzymes","chapter":20,"name":"Use enzymes at industrial scale","short":"Industrial enzymes & food technology","icon":"02","desc":"Apply pectinase, protease, lipase and lactase to fruit juice, washing powders and lactose-free milk.","notes":[["Pectinase","Pectinase breaks down pectin in fruit pulp. This increases juice yield and can make juice clearer by releasing material trapped by pectin."],["Biological washing powders","Proteases digest protein stains such as blood or egg; lipases digest greasy lipid stains such as butter or oil. Smaller soluble products can then wash away."],["Lower-temperature washing","Biological detergents can work effectively around 30–40°C, reducing energy use compared with hotter washes."],["Enzyme encapsulation","The guide describes enzymes in washing powder as encapsulated so concentrated enzyme does not directly contact and irritate skin before use."],["Lactase","Lactase hydrolyses lactose with water to form glucose and galactose."],["Lactose-free milk","Lactase treatment helps people with lactose intolerance. Glucose and galactose are sweeter than lactose, so less extra sugar may be needed in some dairy products."]]},{"id":"c20-fermenters","chapter":20,"name":"Control a fermenter","short":"Industrial fermenters","icon":"03","desc":"Relate fermenter structures to sterile growth, aeration, mixing, temperature control, pH control and product harvesting.","notes":[["Industrial fermenter","A fermenter is a large vessel used to grow microorganisms under controlled optimum conditions on a commercial scale."],["Temperature control","Microbial respiration releases heat. A cooling water jacket removes excess heat; a temperature probe monitors conditions so enzymes remain near their optimum."],["pH control","A pH probe monitors acidity or alkalinity and automated systems can add acid or alkali to maintain an optimum pH."],["Aeration and stirring","A sparger supplies sterile air for aerobic respiration. Stirring distributes oxygen, nutrients and heat evenly and helps prevent cells settling."],["Sterility","The vessel and medium are sterilised to prevent contamination and competition from unwanted microorganisms."],["Operating sequence","Sterilise the vessel, add sterile nutrients, inoculate with a pure culture, maintain optimum conditions, then harvest and purify the desired product."]]},{"id":"c20-tools","chapter":20,"name":"Cut and join DNA","short":"Genetic modification tools","icon":"04","desc":"Distinguish restriction enzymes, sticky ends, DNA ligase, vectors and recombinant DNA in genetic engineering.","notes":[["Genetic modification","Genetic modification changes genetic material by removing, changing or inserting individual genes. A transgenic organism contains a gene transferred from another species."],["Restriction enzymes","Restriction enzymes cut DNA at specific base sequences. Staggered cuts can leave single-stranded overhangs called sticky ends."],["Sticky ends","Complementary sticky ends can pair by complementary base pairing, helping a gene fit into a vector cut with the same restriction enzyme."],["DNA ligase","DNA ligase joins DNA fragments by forming bonds in the sugar-phosphate backbone."],["Vectors","A vector carries foreign genetic material into a host cell. Bacterial plasmids and some viruses can act as vectors."],["Recombinant DNA","A recombinant plasmid contains DNA from more than one source, for example a bacterial plasmid carrying a human gene."]]},{"id":"c20-insulin","chapter":20,"name":"Engineer insulin production","short":"Recombinant insulin","icon":"05","desc":"Sequence gene isolation, restriction digestion, ligation, transformation, microbial growth and insulin purification.","notes":[["Identify the gene","The human gene coding for insulin is identified and isolated."],["Matching cuts","The insulin gene and a bacterial plasmid are cut using the same restriction enzyme so complementary sticky ends are produced."],["Ligation","The insulin gene is mixed with the opened plasmid and DNA ligase joins the DNA to form a recombinant plasmid."],["Transformation","The recombinant plasmid is inserted into a bacterial host cell."],["Expression and production","Genetically modified bacteria are grown under controlled conditions so they reproduce and express the human insulin gene."],["Why recombinant insulin?","The guide states that recombinant human insulin matches human insulin, can be produced rapidly at scale, avoids animal-source religious or ethical concerns and reduces risks associated with animal tissues."]]},{"id":"c20-gm-crops","chapter":20,"name":"Evaluate GM crops","short":"GM crops: uses & concerns","icon":"06","desc":"Compare herbicide-resistant, pest-resistant and nutrient-enriched crops and evaluate benefits and potential concerns.","notes":[["Herbicide-resistant crops","A resistance gene allows a crop such as GM soya to survive a specific herbicide while competing weeds are killed."],["Bt crops","Bt crops contain a gene from Bacillus thuringiensis that makes a protein toxic to certain insect pests, reducing dependence on sprayed insecticides."],["Golden Rice","Golden Rice is modified to produce beta-carotene in the grain. Beta-carotene can be converted to vitamin A, helping prevent vitamin A deficiency and blindness."],["Potential benefits","The guide lists higher yields, reduced pesticide use, tolerance of harsh conditions, improved nutritional value and reduced farming costs."],["Potential concerns","The guide discusses gene flow to wild relatives, reduced biodiversity, evolution of pest resistance, high seed costs and public concern about long-term effects."],["Balance evidence","When evaluating GM crops, identify the specific trait and mechanism, then connect each claimed benefit or concern to that trait rather than making a general statement about all GM crops."]]}];
TOPICS.push(...C20TOPICS);

// Chapter 20 · 48 activities (42 objective + 6 written reflection tasks)
add("c20-biotech","mcq","Which statement best defines biotechnology in the supplied Chapter 20 guide?",{"options":["Applying biological organisms, systems or processes to produce useful products","Studying only wild ecosystems without using organisms","Replacing all enzymes with inorganic catalysts","Growing organisms only for classification"],"answer":0},"The guide defines biotechnology as applying biological organisms, systems or processes to manufacturing and service industries to produce useful products.");
add("c20-biotech","fill","Bacteria can reproduce rapidly by binary _____.",{"answer":["fission"]},"Rapid binary fission gives bacteria short generation times, one reason they are useful in biotechnology.");
add("c20-biotech","multi","Which features make microorganisms useful in biotechnology according to the guide?",{"options":["Rapid reproduction","Simple inexpensive nutrient requirements","Small size","Plasmids that can be manipulated","Ability to synthesise useful organic molecules","Requirement for huge land areas"],"answer":[0,1,2,3,4]},"The guide emphasises rapid growth, cheap nutrients, compact culture, manipulable plasmids and synthesis of useful molecules.");
add("c20-biotech","match","Match each microorganism feature or product to its significance.",{"pairs":[["Plasmids","DNA vectors that can be manipulated"],["Shared genetic code","Allows transferred genes to be expressed"],["Carbon dioxide from yeast","Makes bread dough rise"],["Ethanol from yeast","Can be distilled for biofuel"]]},"Plasmids support genetic engineering, while yeast fermentation products are used in bread and bioethanol production.");
add("c20-biotech","matrix","Evaluate these biotechnology statements.",{"rows":[["Yeast can produce ethanol and carbon dioxide during anaerobic respiration.",true],["Carbon dioxide bubbles can be trapped by gluten in bread dough.",true],["Microorganisms are unsuitable for biotechnology because they always grow slowly.",false],["The guide lists simple growth requirements as an advantage of microorganisms.",true]]},"Yeast fermentation produces ethanol and carbon dioxide, and microorganisms are useful partly because they reproduce quickly and can be grown economically.");
add("c20-biotech","mcq","Which fermentation product directly causes bread dough to rise?",{"options":["Carbon dioxide","Ethanol only","Oxygen","Lactic acid"],"answer":0},"Carbon dioxide bubbles become trapped in the dough and expand, making it rise.");
add("c20-biotech","order","Arrange the bioethanol pathway described in the guide.",{"items":["Ethanol is distilled and can be blended with petrol","Plant sugar or starch is converted to glucose","Yeast ferments glucose anaerobically","Ethanol is produced"],"answer":["Plant sugar or starch is converted to glucose","Yeast ferments glucose anaerobically","Ethanol is produced","Ethanol is distilled and can be blended with petrol"]},"The sequence moves from plant carbohydrate to glucose, yeast fermentation, ethanol production and downstream distillation/use.");
add("c20-biotech","written","Explain why microorganisms are useful in biotechnology and describe one use of yeast fermentation.",{"rubric":["Microorganisms can grow / reproduce rapidly.","They can be grown on relatively simple inexpensive nutrients.","Large populations occupy little space.","Bacterial plasmids can be manipulated in genetic engineering.","The shared genetic code can allow transferred genes to be expressed.","Yeast anaerobically converts glucose to ethanol and carbon dioxide.","For bread, carbon dioxide makes dough rise; or for biofuel, ethanol is distilled and used as fuel."]},"Link microorganism properties to industrial usefulness, then give a clear fermentation example from the guide.");
add("c20-enzymes","mcq","Which enzyme is used in the guide to increase fruit-juice yield and improve clarification?",{"options":["Pectinase","Lipase","Pepsin","Catalase"],"answer":0},"Pectinase breaks down pectin in fruit pulp, increasing juice extraction and helping clarification.");
add("c20-enzymes","fill","Lactase converts lactose into glucose and _____.",{"answer":["galactose"]},"Lactase hydrolyses lactose to glucose and galactose.");
add("c20-enzymes","multi","Which statements about biological washing powders are supported by the guide?",{"options":["Proteases help remove protein stains","Lipases help remove greasy stains","They can work effectively at lower temperatures","Enzymes may be encapsulated","They require boiling water to work"],"answer":[0,1,2,3]},"Proteases and lipases digest stain molecules, lower-temperature washing can save energy, and the guide describes enzyme encapsulation.");
add("c20-enzymes","match","Match each enzyme to the substrate or application described in the guide.",{"pairs":[["Pectinase","Breaks down pectin in fruit pulp"],["Protease","Breaks down protein stains"],["Lipase","Breaks down lipid / greasy stains"],["Lactase","Breaks lactose into glucose and galactose"]]},"Each enzyme is matched to a specific substrate or industrial use in the guide.");
add("c20-enzymes","matrix","Check these statements about industrial enzymes.",{"rows":[["Pectinase can increase the yield of fruit juice.",true],["Protease is used to digest greasy lipid stains.",false],["Lactase treatment can make milk suitable for people with lactose intolerance.",true],["Biological detergents can be effective at lower washing temperatures.",true]]},"Lipase targets lipid stains, while protease targets protein stains.");
add("c20-enzymes","mcq","Why can an effective biological washing powder reduce energy use?",{"options":["Its enzymes can work at relatively low wash temperatures","It stops water molecules moving","It replaces all detergents with sunlight","It requires extra heating above boiling point"],"answer":0},"The guide states that enzyme-containing detergents can work effectively around 30–40°C, reducing energy used for heating water.");
add("c20-enzymes","order","Arrange the pectinase fruit-juice sequence.",{"items":["More juice can be extracted and the product becomes clearer","Pectinase is mixed with fruit pulp","Pectin in the pulp is broken down","Juice trapped by pectin is released"],"answer":["Pectinase is mixed with fruit pulp","Pectin in the pulp is broken down","Juice trapped by pectin is released","More juice can be extracted and the product becomes clearer"]},"Pectin breakdown releases material trapped in the pulp, increasing extraction and helping clarification.");
add("c20-enzymes","written","Explain the uses of pectinase, protease, lipase and lactase in biotechnology.",{"rubric":["Pectinase breaks down pectin in fruit pulp.","This can increase fruit-juice yield and improve clarification.","Protease breaks down protein stains in biological washing powders.","Lipase breaks down lipid / greasy stains in biological washing powders.","These enzymes convert large stain molecules into smaller soluble products that wash away.","Lactase hydrolyses lactose into glucose and galactose.","Lactase treatment produces lactose-free milk for people with lactose intolerance."]},"State the substrate, the products or effect, and the practical benefit for each enzyme.");
add("c20-fermenters","mcq","What is the main function of the cooling water jacket on an industrial fermenter?",{"options":["Remove excess heat released by microbial respiration","Add carbon dioxide for photosynthesis","Sterilise the product after harvesting","Increase temperature without limit"],"answer":0},"Microbial respiration releases heat, so the water jacket removes excess heat to keep temperature near the optimum.");
add("c20-fermenters","fill","A probe used to monitor acidity or alkalinity in a fermenter is the _____ probe.",{"answer":["pH","ph"]},"The pH probe monitors acidity/alkalinity so acid or alkali can be added if required.");
add("c20-fermenters","multi","Which functions are provided by the stirrer or impeller?",{"options":["Distributes nutrients","Distributes oxygen","Distributes heat","Helps prevent cells settling","Sterilises the fermenter by itself"],"answer":[0,1,2,3]},"Continuous mixing helps distribute nutrients, oxygen and heat and prevents microorganisms settling.");
add("c20-fermenters","match","Match each fermenter component to its function.",{"pairs":[["Water jacket","Removes excess heat"],["Air sparger","Supplies sterile air / oxygen"],["pH probe","Monitors acidity or alkalinity"],["Stirrer","Mixes nutrients, oxygen and heat evenly"]]},"Each component supports controlled growth conditions in the fermenter.");

function addChapterDragQuestions(){
 const groups=[['question','Question stem'],['correct','Correct answer'],['distractor','Distractor']];
 for(let chapter=1;chapter<=20;chapter++){
   const chapterTopic=chapter===1?topic=>!/^c\d+-/.test(topic):topic=>topic.startsWith(`c${chapter}-`);
   const pool=QUESTIONS.filter(q=>q.type==='mcq'&&chapterTopic(q.topic));
  for(let set=0;set<5;set++){
    const sources=Array.from({length:3},(_,i)=>pool[(set*2+i)%pool.length]);
   const statements=sources.flatMap((q,i)=>{
    const distractors=q.options.map((_,index)=>index).filter(index=>index!==q.answer);
    const distractor=distractors[(set+i)%distractors.length];
      return [
       [`Question: ${q.prompt}`,'question'],
       [`Answer to “${q.prompt}”: ${q.options[q.answer]}`,'correct'],
       [`Answer to “${q.prompt}”: ${q.options[distractor]}`,'distractor']
      ];
   });
    addDrag(sources[0].topic,'Sort the question stems, correct answers and distractors into their boxes.',groups,statements,'Each set includes three multiple-choice question stems, their correct answers and one distractor for each.');
    QUESTIONS[QUESTIONS.length-1].id+='-three-box';
  }
 }
}
addChapterDragQuestions();

function badges(){const total=currentObjective().length;return[{name:'First discovery',symbol:'✧',desc:'Answer your first objective question correctly in this chapter.',earned:covered()>0},{name:'On a roll',symbol:'↗',desc:'Answer five objective questions correctly in a row in one session.',earned:state.bestCombo>=5},{name:'Curious mind',symbol:'✳',desc:'Complete at least one written reflection.',earned:currentWritten().some(q=>state.reflections[q.id])},{name:'Chapter explorer',symbol:'◎',desc:`Answer all ${total} objective questions correctly at least once.`,earned:covered()===total},{name:'Built to last',symbol:'↺',desc:'Confirm five questions through successful spaced recall.',earned:retained()>=5},{name:'Chapter challenger',symbol:'◇',desc:'Score at least 10 out of 12 in a chapter challenge.',earned:!!state.boss[state.activeChapter]}];}
function rewards(){return `<div class="page-heading"><div><p class="eyebrow">EVIDENCE OF YOUR EFFORT</p><h1>Small wins. Real progress.</h1><p>Earn recognition for curiosity, consistency and understanding.</p></div></div><div class="hero" style="min-height:auto"><div><p class="eyebrow">LEVEL ${level()} · ${rank().toUpperCase()}</p><h2>${state.xp} XP and counting.</h2><p>${200-state.xp%200} XP to the next level. Every question is another opportunity to learn.</p><div class="bar" style="margin-top:24px"><span style="width:${state.xp%200/2}%"></span></div></div><div class="hero-orbit"><span class="motion-icon" style="font-size:5rem;color:var(--lime)" aria-hidden="true">✦</span></div></div><div class="achievement-grid">${badges().map(b=>`<article class="achievement ${b.earned?'earned':''}"><div class="medal motion-icon" aria-hidden="true">${b.symbol}</div><h3>${b.name}</h3><p>${b.desc}</p><span class="status">${b.earned?'✓ EARNED':'YET TO DISCOVER'}</span></article>`).join('')}</div><div class="callout"><h3>How XP works</h3><p>First correct answer: 25 XP. With a hint or after a mistake: 15 XP. Successful due review: 10 XP, at most once per question in 24 hours. First written reflection: 10 XP. Incorrect answers never remove XP.</p></div>`;}
function dialog(kind){const d=document.createElement('dialog');d.id='modal';if(kind==='about')d.innerHTML=`<h2>Made for understanding.</h2><p>BioQuest Premium is an independent practice tool for Cambridge IGCSE Biology (0610). It is not affiliated with Cambridge and does not issue official exam grades.</p><h3>Content & sources</h3><p>${CHAPTERS.length} chapters are currently included. Chapter content and original exam-style activities are authored from the uploaded chapter-specific guides and cross-checked against the supplied Chapters 1–20 guide. Source labels in those guides are not presented here as authenticated official Cambridge mark schemes.</p><p>Exam Lab is a practice environment. Paper 2, Paper 4 and Paper 6 pools use question-level tags in this build; Paper 6 questions are additionally tagged by practical skill. Diagrams are simplified teaching schematics and are not to scale.</p><h3>Your progress</h3><p>XP, settings, answers and review dates are saved in this browser only. Clearing browser data removes them. Coverage, mastery and spaced recall are learning indicators, not predicted exam grades.</p><button class="btn primary" data-action="close">Back to learning</button>`;document.body.append(d);d.addEventListener('close',()=>d.remove());d.addEventListener('click',e=>{if(e.target===d)d.close();});d.showModal();}
function go(v){view=v;settingsOpen=false;chaptersOpen=false;render(true);}
function requestStart(fn){if((S&&!S.finished)||resume){const d=document.createElement('dialog');d.innerHTML='<h2>Start a new session?</h2><p>Your completed answers and XP are saved. Starting a new session replaces the remaining questions in your current session.</p><div class="hero-actions"><button class="btn primary" id="new-session">Start new session</button><button class="btn" data-action="close">Keep current session</button></div>';document.body.append(d);d.addEventListener('close',()=>d.remove());d.showModal();$('#new-session').onclick=()=>{d.close();fn();};}else fn();}
function switchChapter(ch){ch=Number(ch);if(!CHAPTERS.some(c=>c.n===ch)||ch===state.activeChapter){chaptersOpen=false;render();return;}state.activeChapter=ch;noteTopic=currentTopics()[0].id;view='home';settingsOpen=false;chaptersOpen=false;save();render(true);toast(`Chapter ${String(ch).padStart(2,'0')} ready.`);}
function placeDrag(index,target){if(!S||S.checked)return;const q=qById(S.queue[S.index]);if(q?.type!=='drag'||!q.groups.some(([key])=>key===target)||!Number.isInteger(index)||!q.statements[index])return;S.answer[index]=target;S.dragSelected=null;save();render();}
document.addEventListener('dragstart',e=>{const card=e.target.closest('.drag-card');if(!card||!S||S.checked)return;S.dragSelected=Number(card.dataset.index);e.dataTransfer?.setData('text/plain',card.dataset.index);if(e.dataTransfer)e.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',e=>{const bin=e.target.closest('.drag-bin');if(!bin||!S||S.checked)return;e.preventDefault();bin.classList.add('over');if(e.dataTransfer)e.dataTransfer.dropEffect='move';});
document.addEventListener('dragleave',e=>{if(!e.target.closest('.drag-bin'))return;const bin=e.target.closest('.drag-bin');if(!bin.contains(e.relatedTarget))bin.classList.remove('over');});
document.addEventListener('drop',e=>{const bin=e.target.closest('.drag-bin');if(!bin)return;e.preventDefault();bin.classList.remove('over');const index=Number(e.dataTransfer?.getData('text/plain'));placeDrag(index,bin.dataset.target);});
document.addEventListener('pointerover',e=>{const el=e.target.closest('button,[role="menuitem"],.option,.mission,.mastery-card,.review-item,.achievement,.chapter-option,.glass-switch');if(!el||el.disabled)return;if(e.relatedTarget&&el.contains(e.relatedTarget))return;hoverSound();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled){let changed=false;if(settingsOpen&&!e.target.closest('.settings-wrap')){settingsOpen=false;changed=true;}if(chaptersOpen&&!e.target.closest('.chapter-picker')){chaptersOpen=false;changed=true;}if(changed)render();return;}const a=b.dataset.action;
 if(a==='close'){b.closest('dialog')?.close();return;}
 if(a==='settings'){settingsOpen=!settingsOpen;if(settingsOpen)chaptersOpen=false;render();return;}
 if(a==='chapters'){const wasOpen=chaptersOpen;chaptersOpen=!chaptersOpen;if(chaptersOpen)settingsOpen=false;render();if(wasOpen)requestAnimationFrame(()=>$('.chapter-picker-btn')?.focus({preventScroll:true}));return;}
 if(a==='theme'){state.theme=state.theme==='light'?'dark':'light';save();applyPrefs();sound('tap');render();return;}
 if(a==='focusMode'){state.focusMode=!state.focusMode;save();applyPrefs();if(!state.focusMode)sound('tap');render();return;}
 if(a==='examAutoSubmit'){state.examAutoSubmit=!state.examAutoSubmit;save();sound('tap');render();return;}
 if(a==='sidePanel'){state.sidePanel=state.sidePanel===false;save();render();return;}
 if(a==='sound'){state.sound=!state.sound;save();if(state.sound)sound('tap');render();return;}
 if(a==='chapter'){switchChapter(b.dataset.chapter);return;}
 if(a==='home'){go('home');return;}
 if(a==='nav'){go(b.dataset.view);return;}
 if(a==='review'){go('review');return;}
 if(a==='about'){dialog('about');return;}
 if(a==='notes'||a==='noteTab'||a==='nextNote'){noteTopic=b.dataset.topic;go('notes');return;}
 if(a==='nextSection'){const t=topicById(b.dataset.topic);if(t)requestStart(()=>start(questionsForTopic(t.id).map(q=>q.id),t.short,'mission',t.id));return;}
 if(a==='refresh'){render();toast('Review schedule refreshed.');return;}
 if(a==='resume'){const candidate=S&&!S.finished?S:resume;if(candidate){const first=qById(candidate.queue?.[0]);const chapter=topicById(first?.topic)?.chapter;if(chapter&&chapter!==state.activeChapter){state.activeChapter=chapter;}S=candidate;resume=null;view='quiz';render(true);}return;}
 if(a==='topic'){const t=topicById(b.dataset.topic);if(!t)return;requestStart(()=>start(questionsForTopic(t.id).map(q=>q.id),t.short,'mission',t.id));return;}
 if(a==='boss'){requestStart(()=>{const ids=currentTopics().flatMap(t=>shuffle(currentObjective().filter(q=>q.topic===t.id)).slice(0,2).map(q=>q.id));start(shuffle(ids),'Chapter challenge','boss');});return;}
 if(a==='due'||a==='dueTopic'){const qs=due().filter(q=>a==='due'||q.topic===b.dataset.topic);if(!qs.length){go('review');return;}requestStart(()=>start(qs.map(q=>q.id),'Smart review','review'));return;}

 if(a==='weak'){const qs=weakestQuestions();if(qs.length)requestStart(()=>start(qs.map(q=>q.id),'Adaptive mastery review','adaptive'));return;}
 if(a==='mistakeMix'){const qs=shuffle(mistakeQuestions()).slice(0,12);if(qs.length)requestStart(()=>start(qs.map(q=>q.id),'Mistake repair','mistakes'));return;}
 if(a==='retryMistake'){const q=qById(b.dataset.id);if(q)requestStart(()=>start([q.id],'Mistake repair','mistakes',q.topic));return;}
 if(a==='resolveMistake'){if(state.mistakes[b.dataset.id])state.mistakes[b.dataset.id].archived=true;save();render();return;}
 if(a==='examStart'){requestStart(()=>startExam(b.dataset.paper));return;}
 if(a==='flag'&&S?.exam){const q=qById(S.queue[S.index]);const set=new Set(S.exam.flags||[]);set.has(q.id)?set.delete(q.id):set.add(q.id);S.exam.flags=[...set];save();render();return;}
 if(a==='finishExam'&&S?.exam){S.exam.reviewComplete=true;finishSession();return;}
 if(a==='examReturn'&&S?.exam&&!S.exam.locked){view='quiz';render(true);return;}
 if(a==='examJump'&&S?.exam&&!S.exam.locked){const idx=S.queue.indexOf(b.dataset.id);if(idx>=0){S.index=idx;resetQuestion();S.exam.returnToReview=true;view='quiz';save();render(true);}return;}
 if(a==='retry'){const qs=S.results.filter(r=>!r.correct&&!r.reflection).map(r=>r.id);start(qs,'Recall & reconnect','retry');return;}
 if(!S||view!=='quiz')return;
 if(a==='check'){submit();return;}
 if(a==='next'){next();return;}
 if(S.checked)return;
 const q=qById(S.queue[S.index]);
 if(a==='dragPick'&&q.type==='drag'){S.dragSelected=Number(b.dataset.index);save();render();document.querySelector(`[data-action="dragPick"][data-index="${S.dragSelected}"]`)?.focus({preventScroll:true});return;}
 if(a==='dropTarget'&&q.type==='drag'&&Number.isInteger(S.dragSelected)){placeDrag(S.dragSelected,b.dataset.target);return;}
 if(a==='choice'){const i=Number(b.dataset.index);if(q.type==='mcq'){S.answer=i;save();submit();return;}S.answer=S.answer.includes(i)?S.answer.filter(v=>v!==i):[...S.answer,i];save();render();document.querySelector(`[data-action="choice"][data-index="${i}"]`)?.focus({preventScroll:true});}
 if(a==='hint'){S.hint=true;save();render();}
 if(a==='move'){const i=Number(b.dataset.index),j=i+Number(b.dataset.direction);if(j>=0&&j<S.answer.length){[S.answer[i],S.answer[j]]=[S.answer[j],S.answer[i]];S.orderTouched=true;save();render();document.querySelector(`[data-action="move"][data-index="${j}"][data-direction="${b.dataset.direction}"]`)?.focus({preventScroll:true});}}
 if(a==='key'){S.node=b.dataset.node;S.path.push(b.dataset.label);if(!KEY[S.node])S.answer=S.node;save();render();}
 if(a==='keyreset'){S.node='start';S.path=[];S.answer=null;save();render();}
});
document.addEventListener('input',e=>{const el=e.target,kind=el.dataset.input;if(kind==='fontRange'){state.fontScale=Math.max(80,Math.min(200,Number(el.value)||100));applyPrefs();const out=$('#font-value');if(out)out.textContent=state.fontScale+'%';save();return;}if(!kind||!S||S.checked)return;const i=Number(el.dataset.index);if(kind==='fill'||kind==='written')S.answer=el.value;else if(kind==='matrix')S.answer[i]=el.value==='true';else if(kind==='match')S.answer[i]=el.value;else if(kind==='rubric')S.self=el.checked?[...new Set([...S.self,i])]:S.self.filter(n=>n!==i);save();const b=$('#check');if(b)b.disabled=!readyForSubmit(qById(S.queue[S.index]));});
document.addEventListener('keydown',e=>{
 if(view==='quiz'&&!S?.checked&&qById(S?.queue[S?.index])?.type==='drag'&&Number.isInteger(S.dragSelected)&&(e.key==='Backspace'||e.key==='Delete')){e.preventDefault();delete S.answer[S.dragSelected];const index=S.dragSelected;S.dragSelected=null;save();render();document.querySelector(`[data-action="dragPick"][data-index="${index}"]`)?.focus({preventScroll:true});return;}
 if(chaptersOpen&&e.target.matches('.chapter-option')){const items=$$('.chapter-option'),i=items.indexOf(e.target);if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const nextI=e.key==='Home'?0:e.key==='End'?items.length-1:e.key==='ArrowDown'?(i+1)%items.length:(i-1+items.length)%items.length;items[nextI]?.focus({preventScroll:false});return;}if(e.key==='Escape'){e.preventDefault();chaptersOpen=false;render();requestAnimationFrame(()=>$('.chapter-picker-btn')?.focus({preventScroll:true}));return;}}
 if(view==='quiz'&&e.target.matches('[role="radio"][data-action="choice"]')&&['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();const radios=$$('[role="radio"][data-action="choice"]'),i=radios.indexOf(e.target),d=(e.key==='ArrowDown'||e.key==='ArrowRight')?1:-1,target=radios[(i+d+radios.length)%radios.length];target?.click();return;}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('.clickable-section[data-action]')){e.preventDefault();e.target.click();return;}
 if(e.key==='Enter'&&view==='quiz'&&S?.checked&&!e.target.closest('button,a,input,select,textarea,[role="button"],[role="radio"],[role="menuitem"],[role="menuitemradio"]')){e.preventDefault();next();return;}
 if(e.key==='Enter'&&view==='quiz'&&e.target.dataset.input==='fill'){e.preventDefault();submit();return;}
 if(e.key==='Escape'&&chaptersOpen){chaptersOpen=false;render();requestAnimationFrame(()=>$('.chapter-picker-btn')?.focus({preventScroll:true}));return;}
 if(e.key==='Escape'&&settingsOpen){settingsOpen=false;render();requestAnimationFrame(()=>$('.settings-btn')?.focus({preventScroll:true}));}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)persistNow();else if(view==='review')render();});
window.addEventListener('pagehide',persistNow,{capture:true});
window.addEventListener('beforeunload',persistNow,{capture:true});
window.addEventListener('resize',()=>{if(chaptersOpen)positionChapterFlyout();},{passive:true});

function virusDiagram(){return `<figure class="virus-diagram"><svg viewBox="0 0 520 220" role="img" aria-labelledby="virus-title virus-desc"><title id="virus-title">Simplified virus with two labelled structures</title><desc id="virus-desc">A points to the outer hexagonal boundary. B points to a wavy strand inside the boundary.</desc><path d="M190 30 L275 30 L320 110 L275 190 L190 190 L145 110 Z" fill="#233637" stroke="currentColor" opacity=".85" stroke-width="10"/><path d="M202 65 C275 65 180 95 251 100 C300 103 188 125 242 138 C277 147 217 170 202 147" fill="none" stroke="var(--cyan)" stroke-width="6" stroke-linecap="round"/><path d="M100 55 H152 L168 74" fill="none" stroke="var(--text)" stroke-width="2"/><circle cx="168" cy="74" r="4" fill="var(--text)"/><text x="78" y="61" fill="var(--text)" font-size="22" font-family="sans-serif">A</text><path d="M380 125 H277 L249 139" fill="none" stroke="var(--text)" stroke-width="2"/><circle cx="249" cy="139" r="4" fill="var(--text)"/><text x="393" y="132" fill="var(--text)" font-size="22" font-family="sans-serif">B</text></svg><figcaption>Simplified non-enveloped virus · not to scale</figcaption></figure>`;}
function diagramFor(q){if(q.topic==='keys')return virusDiagram();if(q.diagram==='plant')return plantCellDiagram();if(q.diagram==='animal')return animalCellDiagram();if(q.diagram==='bacteria')return bacteriaDiagram();return '';}

function animalCellDiagram(){return `<figure class="cell-diagram"><svg viewBox="0 0 620 300" role="img" aria-label="Simplified animal cell with labels A to D"><path d="M155 62 C245 15 410 35 474 118 C535 198 426 270 300 262 C172 255 85 197 115 116 C124 91 136 75 155 62Z" fill="rgba(139,232,234,.08)" stroke="var(--cyan)" stroke-width="6"/><ellipse cx="300" cy="145" rx="60" ry="52" fill="rgba(179,142,255,.25)" stroke="var(--text)" stroke-width="3"/><g fill="var(--lime)"><circle cx="205" cy="113" r="4"/><circle cx="217" cy="187" r="4"/><circle cx="385" cy="102" r="4"/><circle cx="411" cy="179" r="4"/><circle cx="346" cy="211" r="4"/></g><g stroke="var(--text)" fill="none" stroke-width="2"><path d="M65 78 H137 L159 66"/><path d="M80 142 H235"/><path d="M83 220 H155 L200 190"/><path d="M546 98 H422 L389 103"/></g><g fill="var(--text)" font-size="22" font-family="sans-serif"><text x="39" y="84">A</text><text x="52" y="148">B</text><text x="54" y="226">C</text><text x="557" y="105">D</text></g></svg><figcaption>Simplified animal cell · not to scale</figcaption></figure>`;}
function bacteriaDiagram(){return `<figure class="cell-diagram"><svg viewBox="0 0 650 300" role="img" aria-label="Simplified bacterium with labels A to D"><rect x="115" y="72" width="410" height="160" rx="80" fill="rgba(139,232,234,.06)" stroke="var(--lime)" stroke-width="10"/><rect x="130" y="87" width="380" height="130" rx="65" fill="rgba(139,232,234,.05)" stroke="var(--cyan)" stroke-width="3"/><path d="M225 135 C285 86 385 96 405 145 C420 182 340 200 285 174 C248 156 271 129 330 130 C390 132 428 170 387 192" fill="none" stroke="var(--text)" stroke-width="5" stroke-linecap="round"/><circle cx="439" cy="155" r="21" fill="none" stroke="var(--orange)" stroke-width="5"/><g fill="var(--cyan)"><circle cx="190" cy="120" r="5"/><circle cx="205" cy="180" r="5"/><circle cx="255" cy="205" r="5"/><circle cx="465" cy="115" r="5"/><circle cx="475" cy="188" r="5"/></g><g stroke="var(--text)" fill="none" stroke-width="2"><path d="M50 92 H113"/><path d="M50 145 H210 L238 137"/><path d="M585 158 H464"/><path d="M585 208 H495 L477 188"/></g><g fill="var(--text)" font-size="22" font-family="sans-serif"><text x="22" y="98">A</text><text x="22" y="151">B</text><text x="596" y="165">C</text><text x="596" y="215">D</text></g></svg><figcaption>Simplified bacterial cell · not to scale</figcaption></figure>`;}

render();
