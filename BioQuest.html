 {id:'c10-pathogens',chapter:10,name:'Track a transmissible disease',short:'Pathogens & transmission',icon:'01',desc:'Define pathogens, hosts and transmissible disease, then classify direct and indirect routes of spread.',notes:[['Pathogen','A pathogen is a disease-causing organism. The guide groups examples as bacteria, viruses, fungi and protoctists.'],['Transmissible disease','A transmissible disease is one in which the pathogen can pass from one host to another.'],['Host','A host is an organism in which a pathogen lives and reproduces.'],['Direct contact','Direct transmission can occur through blood, sexual contact or other body fluids.'],['Indirect contact','Indirect transmission can occur through contaminated surfaces, unhygienic food, contaminated water, airborne droplets or animals and vectors such as mosquitoes.'],['Examples','The guide lists cholera and tuberculosis as bacterial diseases, influenza and HIV/AIDS as viral diseases, malaria as a protoctist disease, and athlete’s foot as a fungal disease.']]},
 {id:'c10-defences',chapter:10,name:'Defend the body',short:'Mechanical, chemical & cellular defences',icon:'02',desc:'Connect barriers and white blood cells to the first lines of defence against pathogens.',notes:[['Mechanical defences','Skin forms a tough physical barrier. Blood clotting and scabs help seal wounds, while nose hairs filter particles from inhaled air.'],['Mucus and cilia','Goblet cells produce mucus that traps pathogens in the respiratory airways. Ciliated cells move the mucus towards the throat, where it can be swallowed.'],['Stomach acid','Hydrochloric acid in the stomach has a very low pH and kills many pathogens swallowed in food or water.'],['Cellular defences','White blood cells provide cellular defence. The guide focuses on phagocytes and lymphocytes.'],['Layered protection','Mechanical and chemical barriers reduce entry and survival of pathogens; cellular defences act when pathogens enter body tissues or blood.']]},
 {id:'c10-response',chapter:10,name:'Build a specific response',short:'Phagocytes, lymphocytes & antibodies',icon:'03',desc:'Follow phagocytosis and the antigen–antibody sequence that produces a specific immune response.',notes:[['Phagocytes','Phagocytes have a lobed nucleus and perform phagocytosis: they engulf pathogens and digest them using enzymes inside vesicles.'],['Lymphocytes','Lymphocytes have a large round nucleus and produce specific antibodies in response to specific antigens.'],['Antigen','An antigen is a specific chemical or protein on the surface of a pathogen that is recognised as foreign and stimulates an immune response.'],['Antibody','An antibody is a Y-shaped protein made by lymphocytes. Its binding site has a complementary shape to a specific antigen.'],['Clonal response','A specific lymphocyte recognises an antigen, divides rapidly by mitosis and secretes large quantities of the matching antibody.'],['Antibody actions','Antibodies can bind to pathogens, help mark them for phagocytosis, clump them together and neutralise toxins.']]},
 {id:'c10-immunity',chapter:10,name:'Compare immunity pathways',short:'Active & passive immunity',icon:'04',desc:'Distinguish how antibodies are gained, whether memory cells form and how long protection lasts.',notes:[['Active immunity','Active immunity is defence by antibody production in the body. The individual’s own lymphocytes make antibodies and memory cells form.'],['Natural active immunity','Natural active immunity follows infection and recovery.'],['Artificial active immunity','Artificial active immunity follows vaccination with weakened or dead pathogens or their antigens.'],['Passive immunity','Passive immunity is short-term defence from antibodies acquired from another individual or source. The recipient does not make those antibodies and does not produce memory cells.'],['Natural passive immunity','Maternal antibodies can pass across the placenta or through breast milk.'],['Artificial passive immunity','Ready-made antibodies or antitoxins can be injected for immediate short-term protection.'],['Breastfeeding','Breast milk provides maternal antibodies that give an infant immediate passive protection while its immune system is still developing.']]},
 {id:'c10-vaccines',chapter:10,name:'Train immune memory',short:'Vaccination & herd immunity',icon:'05',desc:'Sequence the primary and secondary immune responses and explain how high vaccine coverage reduces spread.',notes:[['What a vaccine contains','A vaccine contains dead, weakened or harmless pathogens, or isolated antigens. It may be injected or administered orally.'],['Primary response','Vaccine antigens stimulate specific lymphocytes. These divide by mitosis and produce specific antibodies.'],['Memory cells','Vaccination produces memory cells that remain for a long time after the first response.'],['Secondary response','If the real pathogen is encountered later, memory cells recognise its antigen and trigger a much faster, larger antibody response.'],['Why symptoms may be prevented','The faster secondary response can destroy the pathogen before it multiplies enough to cause disease symptoms.'],['Herd immunity','When a large proportion of a population is vaccinated, transmission chains are interrupted because the pathogen has fewer susceptible hosts. This can help protect people who are not vaccinated.']]},
 {id:'c10-cholera',chapter:10,name:'Break the chain of disease',short:'Cholera, ORT & disease control',icon:'06',desc:'Explain cholera diarrhoea through water potential and connect prevention to clean water, hygiene and sewage treatment.',notes:[['Cholera transmission','Cholera is caused by the bacterium Vibrio cholerae and is transmitted indirectly in food or water contaminated with human faeces.'],['Toxin action','The bacteria multiply in the small intestine and release a toxin. The toxin causes epithelial cells to secrete chloride ions into the gut lumen.'],['Water potential and osmosis','The extra chloride ions lower the water potential in the gut lumen. Water then moves from blood or tissue fluid into the lumen by osmosis.'],['Consequences','The result is severe watery diarrhoea, loss of ions and dangerous dehydration.'],['Oral rehydration therapy','ORT contains clean water, glucose and salts. The guide states that glucose supports co-transport of ions and reabsorption of water into the blood.'],['Clean water and sewage','Treated or chlorinated water and safe sewage disposal interrupt faecal–oral transmission.'],['Food and personal hygiene','Thorough cooking kills many bacterial pathogens. Covering food limits contamination by flies, refrigeration slows bacterial reproduction, and hand washing with soap removes pathogens from skin.']]}

add('c10-defences','match','Match each defence to its main action.',{pairs:[['Skin','Physical barrier to entry'],['Nose hairs','Filter airborne particles'],['Mucus','Trap pathogens in airways'],['Stomach acid','Kill many swallowed pathogens']]},'Different barriers act at different entry points.');

add('c10-defences','order','Put this airway defence sequence in order.',{items:['Mucus is swallowed','Pathogens become trapped in mucus','Cilia move the mucus towards the throat'],answer:['Pathogens become trapped in mucus','Cilia move the mucus towards the throat','Mucus is swallowed']},'Mucus first traps particles, then cilia move it upward to the throat.');
add('c10-defences','mcq','Which pair represents cellular defences?',{options:['Phagocytes and lymphocytes','Skin and nose hairs','Mucus and stomach acid','Water and glucose'],answer:0},'Phagocytes and lymphocytes are white blood cells involved in cellular defence.');
add('c10-defences','written','Explain how skin, mucus with cilia, stomach acid and white blood cells help defend the body from pathogens.',{rubric:['Skin forms a tough physical barrier and wounds can be sealed by clotting / scabs.','Mucus traps pathogens in airways.','Cilia move trapped pathogens towards the throat to be swallowed.','Stomach hydrochloric acid kills many swallowed pathogens.','White blood cells include phagocytes and lymphocytes that act against pathogens.']},'Show how each defence contributes rather than simply listing structures.');

add('c10-response','mcq','What process is carried out by phagocytes?',{options:['Phagocytosis','Photosynthesis','Translocation','Osmosis only'],answer:0},'Phagocytes engulf and digest pathogens by phagocytosis.');
add('c10-response','fill','A specific chemical on a pathogen surface that stimulates an immune response is an _____.',{answer:['antigen']},'An antigen is recognised as foreign and stimulates a specific immune response.');
add('c10-response','multi','Which statements about antibodies are supported by the guide?',{options:['They are Y-shaped proteins','They are produced by lymphocytes','Their binding sites are complementary to specific antigens','They can help mark pathogens for phagocytosis','They are made by red blood cells'],answer:[0,1,2,3]},'Antibodies are produced by lymphocytes, not red blood cells.');
add('c10-response','match','Match each immune term to its description.',{pairs:[['Phagocyte','Engulfs and digests pathogens'],['Lymphocyte','Produces specific antibodies'],['Antigen','Foreign surface chemical on a pathogen'],['Antibody','Protein with a complementary binding site']]},'The antigen belongs to the pathogen; the antibody is made by the host immune system.');
add('c10-response','matrix','Evaluate the specific immune-response statements.',{rows:[['A specific lymphocyte can divide by mitosis after recognising its antigen.',true],['Antibodies bind to complementary antigens.',true],['All antibodies have identical binding sites for every antigen.',false],['Antibodies can help clump pathogens together.',true]]},'Antibody binding sites are specific to particular antigens.');
add('c10-response','order','Put the antibody response in a logical order.',{items:['Specific antibodies bind to the antigen','A lymphocyte recognises a foreign antigen','The lymphocyte divides by mitosis','Cloned lymphocytes secrete specific antibodies'],answer:['A lymphocyte recognises a foreign antigen','The lymphocyte divides by mitosis','Cloned lymphocytes secrete specific antibodies','Specific antibodies bind to the antigen']},'Recognition is followed by clonal division, antibody secretion and antigen binding.');
add('c10-response','mcq','How can an antibody help phagocytes destroy pathogens?',{options:['By marking or attaching to pathogens so phagocytes can recognise and engulf them','By changing into a red blood cell','By producing hydrochloric acid','By lowering the water potential of the gut'],answer:0},'Bound antibodies can help mark pathogens for phagocytosis.');
add('c10-response','written','Describe the specific antibody response from antigen recognition to destruction of a pathogen.',{rubric:['A lymphocyte recognises a specific foreign antigen.','The specific lymphocyte divides rapidly by mitosis to form clones.','The lymphocytes secrete large quantities of the specific antibody.','The antibody binding site is complementary to the antigen.','Antibodies bind to pathogens and can mark them for phagocytosis, clump them or neutralise toxins.']},'Present the sequence in order and emphasise specificity.');

add('c10-immunity','mcq','Which feature is characteristic of active immunity?',{options:['The body makes its own antibodies and memory cells form','Only ready-made antibodies are received','No lymphocytes are involved','Protection is always immediate and short-lived'],answer:0},'Active immunity involves the person’s own immune response and memory-cell formation.');
add('c10-immunity','fill','Passive immunity does not produce _____ cells.',{answer:['memory','memory cells']},'Passive immunity gives ready-made antibodies but does not form memory cells.');
add('c10-immunity','multi','Which are examples of passive immunity in the guide?',{options:['Maternal antibodies across the placenta','Antibodies in breast milk','Injection of ready-made antitoxin','Recovery after natural infection','Vaccination'],answer:[0,1,2]},'Infection and vaccination produce active immunity; transferred ready-made antibodies produce passive immunity.');
add('c10-immunity','match','Match each example to the type of immunity.',{pairs:[['Recovery after infection','Natural active immunity'],['Vaccination','Artificial active immunity'],['Antibodies in breast milk','Natural passive immunity'],['Injected ready-made antibodies','Artificial passive immunity']]},'Active immunity involves the recipient making antibodies; passive immunity transfers antibodies from elsewhere.');
add('c10-immunity','matrix','Check the immunity statements.',{rows:[['Active immunity usually gives longer-term protection because memory cells form.',true],['Passive immunity can provide immediate protection.',true],['Passive immunity produces memory cells in the recipient.',false],['Vaccination is an example of artificial active immunity.',true]]},'Passive antibodies are eventually broken down and do not create memory cells.');
add('c10-immunity','order','Order these events in natural active immunity.',{items:['Memory cells remain after recovery','A pathogen infects the body','The immune system produces specific antibodies','The person recovers'],answer:['A pathogen infects the body','The immune system produces specific antibodies','The person recovers','Memory cells remain after recovery']},'Natural active immunity develops after the person’s own immune system responds to infection.');
add('c10-immunity','mcq','Why can breastfeeding provide useful early protection to an infant?',{options:['Maternal antibodies in breast milk provide passive immunity','Breast milk causes the infant to make every possible memory cell immediately','It removes all pathogens from the environment','It permanently replaces the infant immune system'],answer:0},'Breast milk transfers maternal antibodies that provide immediate passive protection.');
add('c10-immunity','written','Compare active and passive immunity in terms of antibody source, memory cells, speed of protection and duration.',{rubric:['In active immunity the body makes its own antibodies; in passive immunity antibodies come from another source.','Active immunity produces memory cells; passive immunity does not.','Active immunity is slower to develop initially.','Passive immunity can give immediate protection.','Active immunity is generally long-term; passive immunity is short-term.']},'Use paired comparisons rather than separate lists.');

add('c10-vaccines','mcq','What may a vaccine contain according to the guide?',{options:['Dead or weakened pathogens, harmless pathogens, or isolated antigens','Only living red blood cells','Only digestive enzymes','Only chloride ions'],answer:0},'Vaccines expose the immune system to safe forms of pathogen antigens.');
add('c10-vaccines','fill','Vaccination leads to the production of long-lived _____ cells.',{answer:['memory','memory cells']},'Memory cells are central to long-term active immunity after vaccination.');
add('c10-vaccines','multi','Which events are part of the vaccination response?',{options:['Specific lymphocytes recognise vaccine antigens','Lymphocytes divide by mitosis','Specific antibodies are produced','Memory cells form','The pathogen must cause severe disease first'],answer:[0,1,2,3]},'The goal is to generate immunity without the full disease caused by the real pathogen.');
add('c10-vaccines','match','Match each vaccination term to its meaning.',{pairs:[['Primary response','First immune response to vaccine antigen'],['Memory cell','Long-lived cell remaining after the first response'],['Secondary response','Faster response after later exposure'],['Herd immunity','Reduced spread when a large proportion is immune']]},'Primary exposure creates memory; later exposure triggers the secondary response.');
add('c10-vaccines','matrix','Evaluate the vaccination statements.',{rows:[['The secondary response is faster than the primary response.',true],['The secondary response can produce a higher antibody concentration.',true],['Vaccination can reduce the number of susceptible hosts in a population.',true],['Herd immunity requires every single person to be vaccinated.',false]]},'High coverage can interrupt transmission without every individual being vaccinated.');
add('c10-vaccines','order','Sequence the vaccination mechanism.',{items:['Memory cells remain','Vaccine antigens stimulate specific lymphocytes','Specific antibodies are produced','Later exposure triggers a rapid secondary response'],answer:['Vaccine antigens stimulate specific lymphocytes','Specific antibodies are produced','Memory cells remain','Later exposure triggers a rapid secondary response']},'Vaccination creates memory before future exposure to the real pathogen.');
add('c10-vaccines','mcq','How does herd immunity help protect some unvaccinated people?',{options:['Transmission is interrupted because the pathogen has fewer susceptible hosts','It makes all pathogens non-living','It transfers antibodies through the air','It replaces personal hygiene'],answer:0},'When many people are immune, transmission chains are more likely to be interrupted.');
add('c10-vaccines','written','Explain how vaccination can give long-term protection and how high vaccine coverage can create herd immunity.',{rubric:['The vaccine contains dead, weakened or harmless pathogens or their antigens.','Specific lymphocytes recognise the antigen and divide by mitosis.','Specific antibodies are produced.','Memory cells remain after the primary response.','Later exposure triggers a faster, larger secondary antibody response.','High vaccine coverage leaves fewer susceptible hosts and interrupts transmission, helping protect some unvaccinated people.']},'Link individual immune memory to population-level reduction in transmission.');

add('c10-cholera','mcq','What organism causes cholera?',{options:['Vibrio cholerae bacterium','Influenza virus','Malaria protoctist','Ringworm fungus'],answer:0},'The guide identifies Vibrio cholerae as the bacterial cause of cholera.');
add('c10-cholera','fill','Cholera toxin causes intestinal epithelial cells to secrete _____ ions into the gut lumen.',{answer:['chloride','chloride ions','cl-','Cl-']},'Chloride ion secretion lowers the water potential in the gut lumen.');
add('c10-cholera','multi','Which measures can reduce disease transmission according to the guide?',{options:['Treated clean water','Safe sewage disposal','Thorough cooking of food','Regular hand washing with soap','Leaving food uncovered around flies'],answer:[0,1,2,3]},'Clean water, sewage treatment, food hygiene and hand washing interrupt transmission.');
add('c10-cholera','match','Match each control measure to its effect.',{pairs:[['Chlorinated water','Reduces water-borne pathogens'],['Thorough cooking','Kills many bacterial pathogens in food'],['Refrigeration below 5°C','Slows bacterial reproduction'],['Hand washing with soap','Removes pathogens from skin']]},'Each measure targets a stage in pathogen transmission.');
add('c10-cholera','matrix','Evaluate the cholera statements.',{rows:[['Cholera can spread through food or water contaminated with human faeces.',true],['Cholera toxin lowers the water potential of the gut lumen by promoting chloride ion secretion.',true],['Water then moves into the gut lumen by osmosis.',true],['Severe cholera diarrhoea increases body hydration.',false]]},'Severe watery diarrhoea causes rapid water and ion loss and can lead to dehydration.');
add('c10-cholera','order','Put the cholera diarrhoea mechanism in order.',{items:['Water moves into the gut lumen by osmosis','Cholera bacteria release toxin','Chloride ions are secreted into the lumen','The lumen water potential falls','Severe watery diarrhoea develops'],answer:['Cholera bacteria release toxin','Chloride ions are secreted into the lumen','The lumen water potential falls','Water moves into the gut lumen by osmosis','Severe watery diarrhoea develops']},'The toxin changes ion movement first; the water-potential gradient then drives osmosis.');
add('c10-cholera','mcq','What is the purpose of oral rehydration therapy in cholera?',{options:['To replace lost water and salts using a solution containing clean water, glucose and salts','To increase chloride secretion into the intestine','To stop all antibody production','To make the gut lumen more concentrated'],answer:0},'ORT replaces lost fluid and ions; the guide also notes that glucose supports ion co-transport and water reabsorption.');
add('c10-cholera','written','Explain how cholera causes severe diarrhoea and dehydration, then describe three measures that reduce transmission.',{rubric:['Vibrio cholerae multiplies in the small intestine and releases a toxin.','The toxin causes chloride ions to be secreted into the gut lumen.','The increased solute concentration lowers the lumen water potential.','Water moves from blood / tissue fluid into the lumen by osmosis.','This causes severe watery diarrhoea, ion loss and dehydration.','Control measures include treated water, safe sewage disposal, hygienic food preparation, refrigeration, covering food and hand washing.']},'Link toxin action to water potential and osmosis before describing transmission control.');

// Chapter 11 · 48 activities (42 objective + 6 written reflection tasks)
add('c11-respiration','mcq','Which statement correctly defines cellular respiration?',{options:['The physical movement of air into the lungs','Chemical reactions in cells that break down nutrient molecules and release energy','The diffusion of oxygen across the alveoli','The transport of oxygen by haemoglobin'],answer:1},'Respiration is a set of chemical reactions in cells that releases energy from nutrient molecules. Breathing is the physical movement of air.');
add('c11-respiration','fill','The main organelle where aerobic respiration occurs is the _____.',{answer:['mitochondrion','mitochondria']},'Mitochondria are the main site of aerobic respiration.');
add('c11-respiration','multi','Which processes use energy released by respiration?',{options:['Muscle contraction','Protein synthesis','Active transport','Cell division','Maintaining body temperature','Diffusion down a concentration gradient'],answer:[0,1,2,3,4]},'The guide lists movement, biosynthesis, cell division, active transport, growth, nerve impulses and temperature maintenance as uses of energy. Simple diffusion is passive.');
add('c11-respiration','match','Match each respiration feature to the correct description.',{pairs:[['Aerobic respiration','Uses oxygen and releases a large amount of energy'],['Anaerobic respiration','Releases energy without using oxygen'],['Mitochondria','Main site of aerobic respiration'],['Cytoplasm','Site of anaerobic respiration']]},'Aerobic and anaerobic respiration differ in oxygen requirement, products and energy yield.');
add('c11-respiration','matrix','Evaluate the respiration statements.',{rows:[['Respiration is controlled by enzymes in living cells.',true],['Aerobic respiration releases more energy per glucose molecule than anaerobic respiration.',true],['Breathing and respiration mean the same process.',false],['Aerobic respiration produces carbon dioxide and water.',true]]},'Breathing is ventilation; respiration is chemical energy release in cells.');
add('c11-respiration','order','Arrange the aerobic respiration word equation from reactants to products.',{items:['Carbon dioxide + water','Glucose + oxygen'],answer:['Glucose + oxygen','Carbon dioxide + water']},'Aerobic respiration uses glucose and oxygen and produces carbon dioxide and water.');
add('c11-respiration','mcq','Which balanced equation represents aerobic respiration?',{options:['C6H12O6 + 6O2 → 6CO2 + 6H2O','C6H12O6 → 2C2H5OH + 2CO2','Glucose → lactic acid','6CO2 + 6H2O → C6H12O6 + 6O2'],answer:0},'The balanced aerobic equation is C6H12O6 + 6O2 → 6CO2 + 6H2O.');
add('c11-respiration','written','Define respiration and explain why cells with high energy demands often contain many mitochondria.',{rubric:['Respiration is the chemical reactions in cells that break down nutrient molecules and release energy for metabolism.','Aerobic respiration releases a large amount of energy.','Mitochondria are the main site of aerobic respiration.','Cells with high energy demands need a high rate of respiration, so many mitochondria increase capacity for energy release.']},'Do not define respiration as breathing. Link mitochondria directly to aerobic energy release.');

add('c11-anaerobic','mcq','What is the product of anaerobic respiration in human muscle cells?',{options:['Lactic acid','Ethanol and carbon dioxide','Carbon dioxide and water','Oxygen'],answer:0},'Human muscle anaerobic respiration converts glucose to lactic acid.');
add('c11-anaerobic','fill','In yeast, anaerobic respiration produces ethanol and _____.',{answer:['carbon dioxide','co2']},'Yeast fermentation produces ethanol and carbon dioxide.');
add('c11-anaerobic','multi','Which statements about anaerobic respiration are correct?',{options:['It can occur without oxygen','It releases less energy per glucose than aerobic respiration','In human muscles it produces lactic acid','In yeast it produces ethanol and carbon dioxide','It completely breaks down glucose'],answer:[0,1,2,3]},'Anaerobic respiration incompletely breaks down glucose, so less energy is released.');
add('c11-anaerobic','match','Match each context to the correct anaerobic product or outcome.',{pairs:[['Human muscle','Lactic acid'],['Yeast','Ethanol + carbon dioxide'],['Bread-making','Carbon dioxide makes dough rise'],['Vigorous exercise','Oxygen delivery may not meet energy demand']]},'Human and yeast anaerobic pathways have different products.');
add('c11-anaerobic','matrix','Check these oxygen-debt statements.',{rows:[['Lactic acid can diffuse from muscles into the blood.',true],['Lactic acid is transported to the liver after exercise.',true],['Breathing rate may remain high after exercise.',true],['Oxygen debt means extra carbon dioxide is needed after exercise.',false]]},'Oxygen debt is the extra oxygen needed after exercise to deal with accumulated lactic acid.');
add('c11-anaerobic','order','Arrange the events leading to repayment of oxygen debt.',{items:['Extra oxygen is used in the liver','Lactic acid enters the blood','Muscles produce lactic acid during vigorous exercise','Lactic acid is transported to the liver'],answer:['Muscles produce lactic acid during vigorous exercise','Lactic acid enters the blood','Lactic acid is transported to the liver','Extra oxygen is used in the liver']},'Lactic acid leaves muscle, travels in blood to the liver, and extra oxygen is then used during recovery.');
add('c11-anaerobic','mcq','Why does anaerobic respiration release less energy than aerobic respiration?',{options:['Glucose is only partially broken down','It always occurs in mitochondria','It produces more oxygen','It uses no enzymes'],answer:0},'Incomplete breakdown leaves chemical energy in the products, so less energy is released.');
add('c11-anaerobic','written','Explain what happens to lactic acid after vigorous exercise and why breathing remains faster for a time.',{rubric:['Lactic acid diffuses out of muscle cells into the blood.','It is transported to the liver.','Extra oxygen is required after exercise / oxygen debt is repaid.','Lactic acid is aerobically broken down / oxidised in the liver.','Breathing remains faster to take in the extra oxygen needed.']},'Follow the lactic acid from muscle to blood to liver and connect recovery breathing to oxygen debt.');

add('c11-alveoli','mcq','Where does gas exchange occur in the human lungs?',{options:['Alveoli','Trachea','Larynx','Diaphragm'],answer:0},'Gas exchange occurs across the alveolar surfaces.');
add('c11-alveoli','fill','Alveolar and capillary walls are each only _____ cell thick.',{answer:['one','1']},'One-cell-thick walls give a short diffusion distance.');
add('c11-alveoli','multi','Which features make alveoli efficient gas exchange surfaces?',{options:['Large surface area','One-cell-thick walls','Dense capillary network','Moist lining','Continuous ventilation','Thick cartilage in each alveolus'],answer:[0,1,2,3,4]},'Alveoli are thin, moist, well supplied with blood, numerous and ventilated. Cartilage supports larger airways, not alveolar walls.');
add('c11-alveoli','order','Put the structures in the order air passes through them after entering the trachea.',{items:['Alveoli','Bronchioles','Bronchi','Trachea'],answer:['Trachea','Bronchi','Bronchioles','Alveoli']},'After the trachea, air passes through bronchi, bronchioles and then alveoli.');
add('c11-alveoli','match','Match each airway structure to its function.',{pairs:[['Cartilage','Keeps trachea and bronchi open'],['Goblet cells','Secrete mucus'],['Mucus','Traps dust and pathogens'],['Cilia','Sweep contaminated mucus toward the throat']]},'Cartilage supports airways; mucus traps particles; cilia move the mucus.');
add('c11-alveoli','matrix','Evaluate these gas-exchange statements.',{rows:[['A dense capillary network helps maintain steep concentration gradients.',true],['A moist lining allows gases to dissolve before diffusion.',true],['Alveolar walls should be thick to prevent oxygen diffusion.',false],['Ventilation helps refresh alveolar air.',true]]},'Efficient gas exchange depends on a short diffusion distance, large area and maintained concentration gradients.');
add('c11-alveoli','mcq','Why are C-shaped rings of cartilage present in the trachea and bronchi?',{options:['To keep airways open and resist collapse','To produce antibodies','To absorb oxygen into blood','To contract and flatten during inspiration'],answer:0},'Cartilage supports the trachea and bronchi so they remain open.');
add('c11-alveoli','written','Explain how alveoli are adapted for efficient gas exchange.',{rubric:['Alveolar and capillary walls are one cell thick, giving a short diffusion distance.','Millions of alveoli provide a large surface area.','A dense capillary network provides a good blood supply and maintains steep concentration gradients.','The lining is moist so gases can dissolve before diffusing.','Ventilation refreshes alveolar air and helps maintain concentration gradients.']},'Link each structural or functional feature to faster diffusion.');

add('c11-ventilation','mcq','What happens to the diaphragm during inspiration?',{options:['It contracts and flattens','It relaxes and domes upward','It closes the trachea','It moves the ribs down and in'],answer:0},'During inspiration, the diaphragm contracts and flattens.');
add('c11-ventilation','fill','During inspiration, pressure inside the lungs becomes _____ than atmospheric pressure.',{answer:['lower','less']},'Increasing thorax volume lowers pressure below atmospheric pressure, so air enters.');
add('c11-ventilation','multi','Which changes occur during inspiration?',{options:['External intercostal muscles contract','Ribs move upwards and outwards','Diaphragm contracts and flattens','Thorax volume increases','Lung pressure decreases'],answer:[0,1,2,3,4]},'These coordinated changes reduce lung pressure and draw air in.');
add('c11-ventilation','match','Match each ventilation event to its consequence.',{pairs:[['Thorax volume increases','Lung pressure decreases'],['Lung pressure below atmospheric','Air moves into lungs'],['Thorax volume decreases','Lung pressure increases'],['Lung pressure above atmospheric','Air moves out of lungs']]},'Air moves down a pressure gradient created by changes in thorax volume.');
add('c11-ventilation','matrix','Decide whether each ventilation statement is true or false.',{rows:[['External intercostal muscles relax during normal expiration.',true],['The diaphragm relaxes and becomes dome-shaped during expiration.',true],['Ribs move upwards and outwards during expiration.',false],['Internal intercostal muscles can contract during forced expiration.',true]]},'Expiration reverses the inspiration movements; internal intercostals are especially involved in forced expiration.');
add('c11-ventilation','order','Arrange the events of inspiration in the correct sequence.',{items:['Air enters the lungs','Thorax volume increases','External intercostals and diaphragm contract','Pressure in the lungs falls'],answer:['External intercostals and diaphragm contract','Thorax volume increases','Pressure in the lungs falls','Air enters the lungs']},'Muscle contraction changes volume, which changes pressure, causing airflow.');
add('c11-ventilation','mcq','Why does air leave the lungs during expiration?',{options:['Lung pressure rises above atmospheric pressure','Lung pressure falls below atmospheric pressure','Oxygen actively pumps air out','The diaphragm contracts and flattens'],answer:0},'Decreased thorax volume raises lung pressure, so air moves out down the pressure gradient.');
add('c11-ventilation','written','Compare inspiration and expiration using the intercostal muscles, ribs, diaphragm, thorax volume and pressure.',{rubric:['In inspiration, external intercostals contract and ribs move up and out.','The diaphragm contracts and flattens.','Thorax volume increases and lung pressure decreases below atmospheric pressure, so air enters.','In expiration, external intercostals relax and ribs move down and in.','The diaphragm relaxes and domes upward.','Thorax volume decreases and lung pressure increases above atmospheric pressure, so air leaves.']},'Use the full sequence from muscles to volume to pressure to airflow.');

add('c11-air','mcq','Which gas has a much higher percentage in expired air than inspired air?',{options:['Carbon dioxide','Nitrogen','Oxygen','Argon'],answer:0},'Expired air contains about 4% carbon dioxide compared with about 0.04% in inspired air.');
add('c11-air','fill','A positive limewater test for carbon dioxide changes from clear to _____.',{answer:['cloudy','milky']},'Carbon dioxide makes limewater turn cloudy or milky.');
add('c11-air','multi','Which statements correctly compare inspired and expired air?',{options:['Expired air contains less oxygen','Expired air contains more carbon dioxide','Nitrogen percentage is approximately unchanged','Expired air contains more water vapour','Expired air is usually warmer'],answer:[0,1,2,3,4]},'Gas exchange lowers oxygen, raises carbon dioxide, while nitrogen stays nearly unchanged; respiratory surfaces add water vapour and heat.');
add('c11-air','match','Match each gas to its approximate percentage in inspired or expired air.',{pairs:[['Inspired oxygen','21%'],['Expired oxygen','16%'],['Inspired carbon dioxide','0.04%'],['Expired carbon dioxide','4%']]},'These approximate values show oxygen uptake and carbon dioxide release.');
add('c11-air','matrix','Evaluate these limewater investigation statements.',{rows:[['Limewater tests for carbon dioxide.',true],['Expired air should make limewater cloudy faster than inspired air.',true],['Nitrogen is used rapidly in human respiration.',false],['A cloudy limewater result indicates carbon dioxide is present.',true]]},'The test demonstrates that expired air contains a higher carbon dioxide concentration.');
add('c11-air','order','Arrange the limewater investigation into a logical sequence.',{items:['Compare how quickly each flask becomes cloudy','Breathe through the two-way apparatus','Place limewater in the flasks'],answer:['Place limewater in the flasks','Breathe through the two-way apparatus','Compare how quickly each flask becomes cloudy']},'The apparatus directs inspired and expired air through different limewater flasks for comparison.');
add('c11-air','mcq','Why does expired air contain more water vapour than inspired air?',{options:['Water evaporates from moist respiratory surfaces','The lungs produce nitrogen gas','Oxygen is converted directly into water vapour in the trachea','Cartilage releases water'],answer:0},'Air gains water vapour as it passes over moist respiratory surfaces.');
add('c11-air','written','Describe how a two-flask limewater experiment can show that expired air contains more carbon dioxide than inspired air.',{rubric:['Use limewater as the carbon dioxide indicator.','Arrange a two-way breathing apparatus so inspired and expired air pass through different flasks.','Inspired air causes little or slower cloudiness.','Expired air makes limewater turn cloudy / milky more rapidly.','Conclude that expired air contains a higher concentration of carbon dioxide.']},'State the indicator, compare the two flasks and make the conclusion from the observed rate of cloudiness.');

add('c11-control','multi','Which responses occur during exercise according to the guide?',{options:['Breathing rate increases','Breathing depth increases','More carbon dioxide is produced','Blood pH can fall','Faster nerve impulses are sent to breathing muscles'],answer:[0,1,2,3,4]},'The breathing response matches the increased metabolic demand of working muscles.');
add('c11-control','match','Match each exercise event to the next consequence.',{pairs:[['Muscle activity rises','Respiration rate rises'],['More respiration','More carbon dioxide is produced'],['More carbon dioxide in blood','Blood pH falls'],['Brain detects the change','Faster impulses go to breathing muscles']]},'The control pathway links metabolic change to chemical detection and then to breathing muscle activity.');
add('c11-control','matrix','Check the control-of-breathing statements.',{rows:[['The brain can detect a rise in carbon dioxide / fall in blood pH.',true],['Exercise normally causes breathing depth to decrease.',false],['Faster breathing helps remove carbon dioxide.',true],['Faster and stronger impulses can be sent to the diaphragm and intercostal muscles.',true]]},'Exercise raises both breathing rate and depth so gas exchange can meet increased demand.');
add('c11-control','order','Arrange the breathing response to exercise.',{items:['Breathing rate and depth increase','Muscles respire faster','Blood carbon dioxide rises and pH falls','Brain detects the chemical change'],answer:['Muscles respire faster','Blood carbon dioxide rises and pH falls','Brain detects the chemical change','Breathing rate and depth increase']},'The response begins with increased muscle respiration and ends with increased ventilation.');

 {id:'c12-coordination',chapter:12,name:'Coordinate a response',short:'Coordination, stimuli & effectors',icon:'01',desc:'Connect stimuli, receptors and effectors, then compare nervous and hormonal communication.',notes:[['Coordination','Coordination is the process by which an organism detects changes in its environment, called stimuli, and produces appropriate responses using effectors.'],['Stimulus','A stimulus is a change in the internal or external environment.'],['Receptor','A receptor is a specialised cell or group of cells that detects a specific stimulus.'],['Effectors','Effectors are muscles or glands. Muscles respond by contracting; glands respond by secreting chemicals or hormones.'],['Nervous communication','The nervous system uses fast electrical impulses along neurones. Its effects are usually short-lived and directed at localised targets.'],['Hormonal communication','The endocrine system uses chemical messengers called hormones carried in blood plasma. Responses are slower, longer-lasting and can affect widespread target organs.']]},
 {id:'c12-neurones',chapter:12,name:'Route an impulse',short:'Nervous system & neurones',icon:'02',desc:'Distinguish the CNS and PNS, then connect neurone structure to sensory, relay and motor functions.',notes:[['Central nervous system','The CNS consists of the brain and spinal cord. It integrates and processes information and coordinates responses.'],['Peripheral nervous system','The PNS includes nerves outside the CNS and connects receptors and effectors to the CNS.'],['Neurone adaptations','A long axon conducts impulses over long distances. A myelin sheath insulates the neurone, speeds transmission and helps prevent signal leakage. Dendrites receive impulses.'],['Sensory neurone','Carries impulses from receptors to the CNS. The guide describes a long dendron and a cell body off to the side in the dorsal root ganglion.'],['Relay neurone','Located entirely within the CNS and connects sensory neurones to motor neurones. It has short, highly branched dendrites and axon.'],['Motor neurone','Carries impulses from the CNS to effectors such as muscles or glands. Its cell body is located at one end inside the CNS.']]},
 {id:'c12-reflex',chapter:12,name:'Build a reflex arc',short:'Reflexes & synapses',icon:'03',desc:'Sequence a withdrawal reflex and explain how neurotransmitters carry signals across synapses in one direction.',notes:[['Voluntary and involuntary actions','A voluntary action involves conscious thought and can be learned or modified. A reflex is a rapid, automatic response that does not require conscious thought and can protect the body from damage.'],['Reflex arc sequence','Stimulus → receptor → sensory neurone → relay neurone in the spinal cord → motor neurone → effector → response.'],['Hot-object withdrawal','Heat or pain receptors in skin generate an impulse. The sensory neurone carries it to the spinal cord, relay and motor neurones pass the signal onwards, and the biceps contracts to pull the hand away.'],['Synapse','A synapse is a junction between two neurones, or between a neurone and an effector.'],['Synaptic transmission','An arriving impulse causes vesicles to release neurotransmitter. The neurotransmitter diffuses across the gap, binds to complementary receptors on the postsynaptic membrane and triggers a new electrical impulse.'],['One-way transmission','Synapses ensure one-way transmission because neurotransmitter vesicles are on the presynaptic side and receptor proteins are on the postsynaptic side. Synapses can also filter weak stimuli and route signals.']]},
 {id:'c12-eye',chapter:12,name:'Focus the human eye',short:'Eye, pupil reflex & accommodation',icon:'04',desc:'Use eye anatomy to explain light detection, pupil control and focusing at near and distant distances.',notes:[['Sense organs','Sense organs contain groups of receptor cells responding to specific stimuli. The guide lists eye, ear, nose, tongue and skin for sight, hearing/balance, smell, taste and touch/temperature/pain.'],['Cornea, iris and pupil','The cornea is transparent and refracts light entering the eye. The iris is a coloured ring of muscle controlling pupil diameter. The pupil is the opening through which light enters.'],['Lens and focusing structures','The flexible biconvex lens fine-focuses light onto the retina. Ciliary muscles alter lens shape through tension in the suspensory ligaments.'],['Retina, rods and cones','The retina contains photoreceptors. Rods are sensitive in dim light and detect black and white. Cones need brighter light and detect colour; they are concentrated at the fovea.'],['Optic nerve and blind spot','The optic nerve carries impulses from the retina to the brain. The blind spot is where the optic nerve leaves the retina and has no photoreceptors.'],['Pupil reflex','Bright light: circular iris muscles contract, radial muscles relax and the pupil constricts. Dim light: circular muscles relax, radial muscles contract and the pupil dilates.'],['Accommodation','Near object: ciliary muscles contract, suspensory ligaments slacken, the lens becomes thicker and refracts more. Distant object: ciliary muscles relax, suspensory ligaments tighten, the lens becomes thinner and refracts less.']]},
 {id:'c12-hormones',chapter:12,name:'Send a hormonal message',short:'Hormones & endocrine glands',icon:'05',desc:'Link endocrine glands to their hormones and explain the adrenaline fight-or-flight response.',notes:[['Hormone definition','A hormone is a chemical substance produced by an endocrine gland, carried in blood plasma, and alters the activity of one or more specific target organs.'],['Major glands','Adrenal glands produce adrenaline. The pancreas produces insulin and glucagon. Testes produce testosterone. Ovaries produce oestrogen and progesterone. The pituitary gland secretes FSH and LH.'],['Adrenaline','Adrenaline is released in danger, stress or excitement as part of the fight-or-flight response.'],['Effects on circulation and breathing','Adrenaline increases heart rate and stroke volume and increases breathing rate and depth, delivering oxygen and glucose faster to active muscles.'],['Effects on glucose and blood flow','Adrenaline stimulates glycogen breakdown to glucose in the liver. It dilates blood vessels to muscles and constricts vessels to the digestive system and skin.'],['Effect on pupils','Adrenaline dilates the pupils, increasing light entry / visual field.'],['Nervous versus hormonal control','Nervous control uses electrical impulses along neurones, acts very rapidly, is short-lived and localised. Hormonal control uses chemicals in blood plasma, is slower, longer-lasting and can affect widespread target organs.']]},
 {id:'c12-tropisms',chapter:12,name:'Steer plant growth',short:'Tropisms & auxin',icon:'06',desc:'Explain phototropism and gravitropism through auxin redistribution and unequal cell elongation.',notes:[['Tropism','A tropism is a plant growth response to a directional environmental stimulus.'],['Phototropism','Shoots show positive phototropism by growing towards light. Roots show negative phototropism by growing away from light.'],['Gravitropism','Roots show positive gravitropism by growing towards gravity. Shoots show negative gravitropism by growing away from gravity.'],['Auxin in shoots','Auxin is produced in shoot and root tips. In a shoot lit from one side, auxin accumulates on the shady side and stimulates cell elongation there, so that side grows faster and the shoot bends towards the light.'],['Auxin and gravity in shoots','In a horizontal shoot, auxin accumulates on the lower side and stimulates more elongation, causing the shoot to bend upwards.'],['Auxin and gravity in roots','In a horizontal root, auxin accumulates on the lower side, but high auxin inhibits cell elongation in roots. The upper side elongates faster, causing the root to bend downwards.'],['Synthetic auxins','Synthetic auxins such as 2,4-D can act as selective weedkillers. Broad-leaved weeds absorb the chemical and undergo uncontrollable rapid growth, while narrow-leaved grasses or crop plants are left unharmed in the guide.']]}

add('c12-coordination','mcq','Which statement best defines coordination?',{options:['Detecting stimuli and producing appropriate responses using effectors','Only producing hormones in endocrine glands','Breaking down glucose to release energy','Moving food through the alimentary canal'],answer:0},'Coordination links detection of a stimulus to an appropriate response using effectors.');

add('c12-coordination','multi','Which statements correctly describe mammalian communication systems?',{options:['Nervous signals are electrical impulses','Hormones are carried in blood plasma','Nervous responses are usually very rapid','Hormonal effects are usually longer-lasting','Hormones travel only inside axons'],answer:[0,1,2,3]},'Nervous and hormonal systems differ in signal type, transport route, speed and duration.');
add('c12-coordination','match','Match each coordination term to its meaning.',{pairs:[['Stimulus','Change in the internal or external environment'],['Receptor','Detects a specific stimulus'],['Muscle effector','Responds by contracting'],['Gland effector','Responds by secreting a chemical or hormone']]},'Receptors detect changes; effectors carry out the response.');
add('c12-coordination','matrix','Evaluate these coordination statements.',{rows:[['The nervous system can target a specific muscle.',true],['Hormones are chemical messengers carried in blood plasma.',true],['Hormonal responses are always faster than nervous responses.',false],['A gland can act as an effector.',true]]},'Nervous responses are generally faster; glands can respond by secretion.');
add('c12-coordination','mcq','Which feature belongs to hormonal rather than nervous control?',{options:['Chemical messenger transported in blood plasma','Electrical impulse along a neurone','Very rapid millisecond response','Usually short-lived local effect'],answer:0},'Hormonal signals are chemicals transported in blood plasma.');
add('c12-coordination','order','Arrange these coordination events into a simple sequence.',{items:['Effector carries out a response','A stimulus occurs','A receptor detects the stimulus'],answer:['A stimulus occurs','A receptor detects the stimulus','Effector carries out a response']},'Coordination starts with a stimulus, followed by detection and then an effector response.');
add('c12-coordination','written','Compare nervous and hormonal communication in terms of signal type, transport, speed, duration and target area.',{rubric:['Nervous control uses electrical impulses; hormonal control uses chemical hormones.','Nervous signals travel along neurones / axons; hormones travel in blood plasma.','Nervous responses are very rapid; hormonal responses are slower.','Nervous effects are short-lived; hormonal effects are longer-lasting.','Nervous responses are localised / specific; hormones can act on widespread target organs.']},'Use paired comparisons for each feature.');

add('c12-neurones','match','Match each nervous-system component to its role.',{pairs:[['Sensory neurone','Carries impulses from receptors to the CNS'],['Relay neurone','Connects sensory and motor neurones inside the CNS'],['Motor neurone','Carries impulses from the CNS to an effector'],['Peripheral nervous system','Connects receptors and effectors to the CNS']]},'Direction of impulse travel distinguishes sensory and motor neurones; relay neurones are inside the CNS.');
add('c12-neurones','matrix','Check these statements about neurones and nervous-system divisions.',{rows:[['Relay neurones are located entirely within the CNS.',true],['The PNS consists only of the brain and spinal cord.',false],['A motor neurone carries impulses to muscles or glands.',true],['Myelin can help prevent signal leakage.',true]]},'The brain and spinal cord form the CNS; the PNS includes nerves outside it.');
add('c12-neurones','mcq','Where does the guide place the cell body of a sensory neurone?',{options:['Off to the side in the dorsal root ganglion','Inside the lens of the eye','In an endocrine gland','At the centre of a muscle fibre'],answer:0},'The sensory neurone cell body is described as lying off to the side in the dorsal root ganglion.');

add('c12-reflex','multi','Which statements about synaptic transmission are correct?',{options:['Neurotransmitter is released from vesicles on the presynaptic side','Neurotransmitter diffuses across the gap','It binds to specific receptors on the postsynaptic membrane','Binding can trigger a new electrical impulse','The electrical impulse jumps directly through the gap without chemicals'],answer:[0,1,2,3]},'Across the gap, the signal is carried chemically by neurotransmitter diffusion.');
add('c12-reflex','match','Match each part of a withdrawal reflex to its role.',{pairs:[['Receptor','Detects the heat or pain stimulus'],['Sensory neurone','Carries the impulse to the spinal cord'],['Relay neurone','Passes the signal within the CNS'],['Motor neurone','Carries the impulse to the effector']]},'The reflex arc links receptor to CNS and then to the responding effector.');
add('c12-reflex','matrix','Evaluate these reflex and synapse statements.',{rows:[['A reflex can occur without conscious thought.',true],['Neurotransmitters cross the synaptic gap by diffusion.',true],['Synapses normally allow impulses to travel equally in both directions.',false],['The biceps can act as an effector in a withdrawal reflex.',true]]},'Synapse structure promotes one-way transmission.');
add('c12-reflex','mcq','Why does a synapse normally transmit information in one direction?',{options:['Vesicles are on the presynaptic side and receptors are on the postsynaptic side','Both membranes contain identical transmitter vesicles','The synaptic gap contains myelin','The relay neurone blocks all chemical diffusion'],answer:0},'The unequal distribution of transmitter vesicles and receptors creates directional transmission.');

add('c12-eye','mcq','Which combination is correct when focusing on a near object?',{options:['Ciliary muscles contract, suspensory ligaments slacken, lens becomes thicker','Ciliary muscles relax, suspensory ligaments tighten, lens becomes thicker','Ciliary muscles contract, suspensory ligaments tighten, lens becomes thinner','Ciliary muscles relax, suspensory ligaments slacken, lens becomes thinner'],answer:0},'Near accommodation reduces tension on the lens, allowing it to become rounder and refract more strongly.');

add('c12-hormones','mcq','Which pair of hormones is linked to regulation of blood glucose in the guide?',{options:['Insulin and glucagon','FSH and LH','Oestrogen and progesterone','Adrenaline and testosterone'],answer:0},'The pancreas secretes insulin, which lowers blood glucose, and glucagon, which raises it.');
add('c12-hormones','order','Arrange a simplified fight-or-flight sequence.',{items:['More oxygen and glucose are delivered to active muscles','Adrenal glands release adrenaline','Danger or stress is detected','Heart rate and breathing increase'],answer:['Danger or stress is detected','Adrenal glands release adrenaline','Heart rate and breathing increase','More oxygen and glucose are delivered to active muscles']},'Adrenaline coordinates changes that support increased respiration in active muscles.');
add('c12-hormones','written','Explain how adrenaline prepares the body for fight or flight, and state two ways hormonal control differs from nervous control.',{rubric:['Adrenaline increases heart rate and stroke volume.','It increases breathing rate and depth.','It stimulates glycogen breakdown to glucose in the liver, raising blood glucose.','It diverts blood towards active muscles and away from lower-priority tissues.','It dilates pupils.','Hormonal control uses chemicals in blood and is slower / longer-lasting; nervous control uses electrical impulses in neurones and is faster / shorter-lived.']},'Link each adrenaline effect to rapid supply of oxygen or glucose where appropriate.');

add('c12-tropisms','fill','The plant hormone produced in shoot and root tips that controls these growth responses is _____.',{answer:['auxin','auxins']},'Auxin controls differential cell elongation in tropic responses.');
add('c12-tropisms','multi','Which statements about tropisms are correct?',{options:['Phototropism is a growth response to directional light','Gravitropism is a growth response to gravity','Shoots are positively phototropic','Roots are positively gravitropic','A tropism is a random movement with no directional stimulus'],answer:[0,1,2,3]},'Tropisms are directional growth responses.');
add('c12-tropisms','match','Match each plant response to the correct description.',{pairs:[['Positive phototropism','Shoot grows towards light'],['Negative phototropism','Root grows away from light'],['Positive gravitropism','Root grows towards gravity'],['Negative gravitropism','Shoot grows away from gravity']]},'Positive means growth towards the named stimulus; negative means growth away.');

 {id:'c13-urinary',chapter:13,name:'Trace the urinary system',short:'Kidneys, vessels & urinary tract',icon:'02',desc:'Follow blood and urine through the kidneys, ureters, bladder and urethra.',notes:[['Kidneys','The kidneys are a pair of bean-shaped organs that filter blood, remove urea and help regulate water and ion balance.'],['Renal artery','The renal artery carries oxygenated blood with a relatively high concentration of urea and unregulated water and salts to the kidney.'],['Renal vein','The renal vein carries blood away from the kidney with a lower concentration of urea after filtration and reabsorption.'],['Ureter','Each ureter carries urine from a kidney to the bladder by peristalsis.'],['Bladder','The bladder is a muscular bag that stores urine until excretion.'],['Urethra','The urethra carries urine from the bladder out of the body and is controlled by sphincter muscles.']]},
 {id:'c13-nephron',chapter:13,name:'Filter and reclaim',short:'Nephron filtration & reabsorption',icon:'03',desc:'Explain ultrafiltration in the glomerulus and selective reabsorption along the renal tubule.',notes:[['Nephron','Each kidney contains many microscopic filtering units called nephrons.'],['Ultrafiltration','High blood pressure in the glomerulus forces small molecules from blood plasma through tiny pores into Bowman’s capsule to form filtrate.'],['What enters filtrate','Water, glucose, amino acids, urea and mineral ions are small enough to enter the filtrate.'],['What stays in blood','Blood cells and large plasma proteins are too large to pass through the filtration barrier and remain in the blood.'],['Selective reabsorption','Useful substances are reabsorbed from the tubule into surrounding capillaries. All glucose is reabsorbed by active transport; water is reabsorbed by osmosis according to the body’s hydration state; mineral ions are reabsorbed as required.'],['Urine composition','Urea remains in the tubule. Final urine contains water, urea and excess mineral ions. Healthy urine contains no glucose according to the guide.']]},
 {id:'c13-water',chapter:13,name:'Balance body water',short:'Water balance & urine',icon:'04',desc:'Predict how water intake, sweating and hydration state change urine volume and concentration.',notes:[['High water intake','After high water intake, especially when little water is lost in sweat, the kidneys reabsorb less water.'],['Dilute urine','Less water reabsorption produces a large volume of dilute, pale-yellow urine.'],['Low water intake','When water intake is low, or much water is lost in sweat during hot conditions or exercise, the kidneys reabsorb more water.'],['Concentrated urine','More water reabsorption produces a small volume of concentrated, darker-yellow urine.'],['Osmosis','Water is reabsorbed from the nephron by osmosis, with the amount depending on hydration state. The guide notes that this is controlled by ADH.'],['Homeostatic value','Changing water reabsorption helps maintain the body’s internal water balance.']]},
 {id:'c13-temperature',chapter:13,name:'Hold temperature steady',short:'Homeostasis & thermoregulation',icon:'05',desc:'Use negative feedback to explain how the hypothalamus, skin and muscles regulate body temperature.',notes:[['Homeostasis','Homeostasis is the maintenance of a constant internal environment. Stable conditions help cells and enzymes function effectively.'],['Negative feedback','A change away from a set point is detected by receptors, a control centre coordinates a response, effectors act and the condition returns towards the set point.'],['Too hot','Arterioles supplying skin capillaries dilate, increasing skin blood flow and heat loss. Sweat evaporates and removes heat. Hair erector muscles relax so hairs lie flat.'],['Too cold','Arterioles supplying skin capillaries constrict, reducing surface blood flow. Skeletal muscles shiver, increasing respiration and heat release. Hair erector muscles contract so hairs stand up and trap an insulating layer of air.'],['Hypothalamus','The hypothalamus monitors core body temperature from the blood, assisted by temperature receptors in the skin.'],['Exam precision','The guide warns not to say that capillaries constrict or move. Arterioles constrict or dilate to change blood flow through skin capillaries.']]},
 {id:'c13-glucose',chapter:13,name:'Regulate blood glucose',short:'Insulin, glucagon & Type 1 diabetes',icon:'06',desc:'Explain antagonistic hormone control of blood glucose and connect insulin deficiency to Type 1 diabetes.',notes:[['High blood glucose','When blood glucose is high, the pancreas secretes insulin. Insulin promotes glucose uptake by liver and muscle cells and conversion of glucose to glycogen, lowering blood glucose.'],['Low blood glucose','When blood glucose is low, the pancreas secretes glucagon. Glucagon stimulates the liver to break down glycogen to glucose and release glucose into the blood.'],['Antagonistic hormones','Insulin and glucagon have opposite effects and together help return blood glucose concentration towards the set point.'],['Type 1 diabetes','Type 1 diabetes is an autoimmune condition in which insulin-secreting cells in the pancreas are destroyed, so little or no insulin is produced.'],['Symptoms','The guide lists high blood glucose, glucose in urine, severe thirst, frequent urination, weight loss and fatigue.'],['Management','Management includes regular blood glucose monitoring, insulin injections, careful regulation of carbohydrate intake and physical exercise. Insulin is not taken orally because it is a protein and would be digested by proteases in the alimentary canal.']]}
];

// Chapter 13 · 48 activities (42 objective + 6 written reflection tasks)
add('c13-excretion','mcq','Which statement correctly distinguishes excretion from egestion?',{options:['Excretion removes metabolic waste; egestion removes undigested food','Excretion removes faeces; egestion removes urea','Both terms mean removal of carbon dioxide','Egestion removes substances made by cell metabolism'],answer:0},'Excretion removes metabolic wastes, toxic materials and excess substances. Egestion removes undigested food that has not entered cells.');
add('c13-excretion','fill','The removal of the nitrogen-containing part of an excess amino acid is called _____.',{answer:['deamination']},'Deamination occurs in the liver and leads to the formation of urea.');
add('c13-excretion','multi','Which are identified in the guide as excretory products?',{options:['Carbon dioxide','Urea','Excess water','Excess mineral ions','Undigested fibre'],answer:[0,1,2,3]},'Carbon dioxide, urea, excess water and excess mineral ions are excreted. Undigested fibre is egested.');
add('c13-excretion','match','Match each waste or process to the correct organ or outcome.',{pairs:[['Carbon dioxide','Removed by lungs'],['Urea','Removed by kidneys'],['Deamination','Occurs in liver'],['Excess amino acids','Cannot be stored by the body']]},'Liver metabolism forms urea from excess amino acids; the kidneys then excrete the urea.');
add('c13-excretion','matrix','Evaluate the statements about excretion and the liver.',{rows:[['Urea is formed from excess amino acids in the liver.',true],['Faeces are a metabolic waste produced inside cells.',false],['Urea is transported dissolved in blood plasma.',true],['Excess amino acids can be stored unchanged for later use.',false]]},'The guide states that excess amino acids cannot be stored and are deaminated in the liver.');
add('c13-excretion','mcq','What happens to the nitrogen-containing part of an excess amino acid during deamination?',{options:['It forms ammonia, which is converted to urea','It becomes cellulose','It is stored unchanged in muscle','It is exhaled as oxygen'],answer:0},'The nitrogen-containing part forms toxic ammonia, which is rapidly converted to less toxic urea.');
add('c13-excretion','order','Put these events in the correct sequence for disposal of excess amino-acid nitrogen.',{items:['Urea is carried in blood plasma to the kidneys','Excess amino acids reach the liver','The nitrogen-containing part forms ammonia','Ammonia is converted to urea'],answer:['Excess amino acids reach the liver','The nitrogen-containing part forms ammonia','Ammonia is converted to urea','Urea is carried in blood plasma to the kidneys']},'The liver performs deamination and converts ammonia to urea before the kidneys excrete it.');
add('c13-excretion','written','Explain why excess amino acids must be processed by the liver and describe how urea is formed and removed.',{rubric:['The body cannot store excess amino acids.','The liver deaminates excess amino acids.','The nitrogen-containing part forms ammonia.','Ammonia is converted into less toxic urea.','Urea dissolves in blood plasma and is transported to the kidneys.','The kidneys excrete urea in urine.']},'Keep the sequence clear: excess amino acids → liver → ammonia → urea → blood → kidneys.');

add('c13-urinary','mcq','Which vessel carries blood to the kidney with a relatively high concentration of urea?',{options:['Renal artery','Renal vein','Ureter','Urethra'],answer:0},'The renal artery supplies the kidney with blood that still contains urea to be removed.');
add('c13-urinary','fill','The tube carrying urine from a kidney to the bladder is the _____.',{answer:['ureter']},'Each ureter transports urine to the bladder.');
add('c13-urinary','multi','Which structures belong to the urinary system described in the guide?',{options:['Kidney','Ureter','Bladder','Urethra','Trachea'],answer:[0,1,2,3]},'The trachea is part of the respiratory system.');
add('c13-urinary','match','Match each urinary structure to its function.',{pairs:[['Kidney','Filters blood and removes urea'],['Ureter','Carries urine to the bladder'],['Bladder','Stores urine'],['Urethra','Carries urine out of the body']]},'Follow urine from kidney to ureter to bladder to urethra.');
add('c13-urinary','matrix','Check the urinary-system statements.',{rows:[['The renal vein has a lower urea concentration than the renal artery.',true],['The bladder produces urine.',false],['The ureter moves urine towards the bladder.',true],['The urethra carries urine from the kidney directly to the bladder.',false]]},'Urine is produced in the kidneys, carried by ureters, stored in the bladder and leaves through the urethra.');
add('c13-urinary','mcq','Which structure is a muscular storage organ for urine?',{options:['Bladder','Renal artery','Kidney','Ureter'],answer:0},'The bladder stores urine until it is excreted.');
add('c13-urinary','order','Arrange the route taken by urine after it is produced in a kidney.',{items:['Urethra','Bladder','Kidney','Ureter'],answer:['Kidney','Ureter','Bladder','Urethra']},'Urine flows kidney → ureter → bladder → urethra.');
add('c13-urinary','written','Describe the roles of the kidneys, renal artery, renal vein, ureters, bladder and urethra.',{rubric:['Kidneys filter blood, remove urea and regulate water / ion balance.','The renal artery carries blood containing more urea to the kidney.','The renal vein carries blood with less urea away from the kidney.','Ureters carry urine to the bladder.','The bladder stores urine.','The urethra carries urine out of the body.']},'A complete answer distinguishes blood vessels from the tubes carrying urine.');

add('c13-nephron','mcq','Where does ultrafiltration occur?',{options:['Glomerulus and Bowman’s capsule','Bladder and urethra','Renal vein only','Liver sinusoids'],answer:0},'High-pressure filtration occurs at the glomerulus into Bowman’s capsule.');
add('c13-nephron','fill','Large blood cells and plasma proteins remain in the blood because they are too _____ to pass through the filtration pores.',{answer:['large','big']},'Large proteins and blood cells cannot pass through the filtration barrier.');
add('c13-nephron','multi','Which substances enter the filtrate during ultrafiltration?',{options:['Water','Glucose','Urea','Mineral ions','Red blood cells'],answer:[0,1,2,3]},'Small molecules enter the filtrate; red blood cells are retained in the blood.');
add('c13-nephron','match','Match each substance to its nephron fate in a healthy person.',{pairs:[['Glucose','Completely reabsorbed'],['Water','Reabsorbed by osmosis according to hydration state'],['Mineral ions','Reabsorbed as required'],['Urea','Remains in tubule to form urine']]},'Selective reabsorption returns useful substances to the blood while urea remains in the filtrate.');
add('c13-nephron','matrix','Evaluate the nephron statements.',{rows:[['Ultrafiltration is driven by high pressure in the glomerulus.',true],['All glucose should remain in final urine in a healthy person.',false],['Glucose reabsorption uses active transport.',true],['Final urine contains urea, water and excess mineral ions.',true]]},'Healthy urine contains no glucose according to the guide because glucose is reabsorbed.');
add('c13-nephron','mcq','Why are blood cells absent from normal filtrate?',{options:['They are too large to pass through the filtration barrier','They are destroyed in Bowman’s capsule','They are actively transported back immediately','They are converted into urea'],answer:0},'Blood cells are too large to pass through the pores used for ultrafiltration.');
add('c13-nephron','order','Put nephron events in the correct order.',{items:['Useful substances are selectively reabsorbed','Final urine remains in the tubule','High-pressure ultrafiltration forms filtrate','Filtrate enters the renal tubule'],answer:['High-pressure ultrafiltration forms filtrate','Filtrate enters the renal tubule','Useful substances are selectively reabsorbed','Final urine remains in the tubule']},'Filtration occurs first, then selective reabsorption modifies the filtrate to form urine.');
add('c13-nephron','written','Explain how urine is formed by ultrafiltration and selective reabsorption.',{rubric:['High blood pressure in the glomerulus forces small molecules into Bowman’s capsule.','Water, glucose, urea and mineral ions enter the filtrate.','Blood cells and large proteins remain in the blood.','All glucose is reabsorbed by active transport.','Water is reabsorbed by osmosis and mineral ions are reabsorbed as required.','Urea remains, so urine contains urea, water and excess mineral ions.']},'Separate the two stages clearly: filtration first, selective reabsorption second.');

add('c13-water','mcq','What kind of urine is expected after a high water intake when little water is lost in sweat?',{options:['Large volume and dilute','Small volume and concentrated','No urine is produced','Large volume with high glucose'],answer:0},'High water intake leads to less water reabsorption and a large volume of dilute urine.');
add('c13-water','fill','Water is reabsorbed from the nephron tubule by _____.',{answer:['osmosis']},'The guide states that water is reabsorbed by osmosis.');
add('c13-water','multi','Which conditions favour production of a small volume of concentrated urine?',{options:['Low water intake','Hot conditions with heavy sweating','Exercise with increased sweating','High water intake at rest'],answer:[0,1,2]},'When the body has less available water, kidneys reabsorb more water and produce concentrated urine.');
add('c13-water','match','Match each condition to the expected urine.',{pairs:[['High water intake','Large volume of dilute urine'],['Low water intake','Small volume of concentrated urine'],['High sweating','More water reabsorbed by kidneys'],['Low sweating','Less water reabsorbed by kidneys']]},'Urine concentration changes with the body’s hydration state.');
add('c13-water','matrix','Check these water-balance statements.',{rows:[['More water reabsorption produces more concentrated urine.',true],['Less water reabsorption produces a smaller urine volume.',false],['Exercise can increase water loss in sweat.',true],['The guide states that hydration-dependent water reabsorption is controlled by ADH.',true]]},'More reabsorption means less water is left in the urine, so urine volume falls and concentration rises.');
add('c13-water','mcq','Why is urine often more concentrated after heavy sweating?',{options:['More water is reabsorbed from the nephron back into the blood','More glucose is secreted into urine','The kidneys stop filtering blood','Urea is converted back into amino acids'],answer:0},'Sweating lowers body water, so the kidneys reabsorb more water.');
add('c13-water','order','Arrange the response to heavy sweating.',{items:['A small volume of concentrated urine is produced','More water is reabsorbed by the kidneys','Water is lost from the body in sweat','Body water availability falls'],answer:['Water is lost from the body in sweat','Body water availability falls','More water is reabsorbed by the kidneys','A small volume of concentrated urine is produced']},'The sequence links water loss to compensatory reabsorption and urine concentration.');
add('c13-water','written','Explain why a person produces different volumes and concentrations of urine on a cool resting day and after exercise in hot conditions.',{rubric:['On a cool resting day less water is lost in sweat.','With adequate water, the kidneys reabsorb less water.','A larger volume of dilute urine is produced.','During exercise in hot conditions more water is lost in sweat.','The kidneys reabsorb more water by osmosis.','A smaller volume of more concentrated urine is produced.']},'Compare both situations and link sweat loss to water reabsorption.');

add('c13-temperature','mcq','Which statement best defines homeostasis?',{options:['Maintenance of a constant internal environment','Removal of undigested food','Growth towards a stimulus','Breakdown of glucose without oxygen'],answer:0},'Homeostasis maintains internal conditions near suitable values for cell and enzyme function.');
add('c13-temperature','fill','The part of the brain that acts as a thermostat for core body temperature is the _____.',{answer:['hypothalamus']},'The hypothalamus monitors the temperature of the blood.');
add('c13-temperature','multi','Which responses help cool the body when temperature is too high?',{options:['Vasodilation of skin arterioles','Sweating','Hair erector muscles relax','Shivering'],answer:[0,1,2]},'Shivering generates heat and is a response to being too cold.');
add('c13-temperature','match','Match each thermoregulatory response to its effect.',{pairs:[['Vasodilation','More blood flows through skin surface capillaries'],['Vasoconstriction','Less blood flows through skin surface capillaries'],['Sweating','Evaporation removes heat'],['Shivering','Muscle respiration releases heat']]},'These responses act through negative feedback to return temperature towards the set point.');
add('c13-temperature','matrix','Evaluate the thermoregulation statements.',{rows:[['Arterioles supplying skin capillaries dilate when the body is too hot.',true],['Capillaries themselves constrict when the body is cold.',false],['Shivering increases heat release from respiration in muscles.',true],['Hair erector muscles contract in the cold.',true]]},'The guide specifically warns that arterioles constrict or dilate; capillaries do not.');
add('c13-temperature','mcq','Why does sweating cool the body?',{options:['Evaporation of water removes heat energy from the skin','Sweat blocks all radiation','Sweat converts glucose into glycogen','Sweat causes capillaries to constrict'],answer:0},'Evaporation requires energy and removes heat from the skin.');
add('c13-temperature','order','Arrange the negative-feedback sequence.',{items:['Effectors respond','A change occurs away from the set point','The condition returns towards the set point','Receptors detect the change','A control centre coordinates the response'],answer:['A change occurs away from the set point','Receptors detect the change','A control centre coordinates the response','Effectors respond','The condition returns towards the set point']},'Negative feedback detects a deviation and activates responses that oppose it.');
add('c13-temperature','written','Explain how the body reduces heat loss when core temperature falls below normal.',{rubric:['Skin arterioles constrict.','Less blood flows through surface capillaries, reducing heat loss.','Skeletal muscles shiver.','Shivering increases respiration and releases heat.','Hair erector muscles contract so hairs stand up.','Upright hairs trap a layer of still air that acts as insulation.']},'Use the precise term arterioles rather than saying capillaries constrict.');

add('c13-glucose','mcq','Which hormone is secreted when blood glucose concentration becomes too high?',{options:['Insulin','Glucagon','Adrenaline only','Urea'],answer:0},'The pancreas secretes insulin when blood glucose concentration rises.');
add('c13-glucose','fill','When blood glucose is too low, the pancreas secretes _____.',{answer:['glucagon']},'Glucagon stimulates the liver to break down glycogen to glucose.');
add('c13-glucose','multi','Which actions occur in response to insulin according to the guide?',{options:['Liver and muscle cells absorb more glucose','The liver converts glucose to glycogen','Blood glucose concentration falls towards normal','The liver converts glycogen to glucose'],answer:[0,1,2]},'Glycogen breakdown to glucose is stimulated by glucagon, not insulin.');
add('c13-glucose','match','Match each hormone or condition to its effect.',{pairs:[['Insulin','Promotes glucose uptake and glycogen formation'],['Glucagon','Promotes glycogen breakdown to glucose'],['High blood glucose','Stimulates insulin secretion'],['Low blood glucose','Stimulates glucagon secretion']]},'Insulin and glucagon act antagonistically.');
add('c13-glucose','matrix','Evaluate the statements about Type 1 diabetes.',{rows:[['Type 1 diabetes involves destruction of insulin-secreting pancreatic cells.',true],['A person with Type 1 diabetes produces too much insulin.',false],['Glucose may appear in urine.',true],['Insulin is normally taken orally as a protein tablet.',false]]},'The guide states that insulin must be injected because oral insulin would be digested by proteases.');
add('c13-glucose','mcq','Why is insulin not normally taken orally according to the guide?',{options:['It is a protein and would be digested by proteases','It cannot dissolve in blood','It is converted directly to urea in the mouth','It would immediately become glycogen in the stomach'],answer:0},'Insulin is a protein and would be broken down by digestive proteases in the alimentary canal.');
add('c13-glucose','order','Arrange the response to high blood glucose concentration.',{items:['Blood glucose falls towards the set point','The pancreas secretes insulin','The liver converts glucose to glycogen','Blood glucose rises above normal'],answer:['Blood glucose rises above normal','The pancreas secretes insulin','The liver converts glucose to glycogen','Blood glucose falls towards the set point']},'Insulin lowers blood glucose partly by promoting glycogen formation.');
add('c13-glucose','written','Explain how insulin and glucagon regulate blood glucose concentration, and state how Type 1 diabetes affects this control.',{rubric:['High blood glucose stimulates insulin secretion from the pancreas.','Insulin promotes glucose uptake and conversion of glucose to glycogen, lowering blood glucose.','Low blood glucose stimulates glucagon secretion.','Glucagon promotes breakdown of glycogen to glucose in the liver, raising blood glucose.','The two hormones have opposite / antagonistic effects.','In Type 1 diabetes insulin-secreting cells are destroyed, so little or no insulin is produced.']},'Describe both sides of the negative-feedback control and then connect Type 1 diabetes to loss of insulin production.');
