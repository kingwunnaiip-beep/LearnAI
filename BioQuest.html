const C14TOPICS=[
 {id:'c14-modes',chapter:14,name:'Compare reproductive routes',short:'Asexual, sexual & chromosome sets',icon:'01',desc:'Distinguish asexual and sexual reproduction and connect haploid gametes with the diploid zygote.',notes:[['Asexual reproduction','Asexual reproduction produces genetically identical offspring from one parent. It involves mitosis, with no fusion of gametes, so offspring are clones.'],['Plant examples','Natural examples include potato stem tubers, strawberry runners or stolons, and bulbs such as onions or daffodils. A cutting is an artificial method of asexual reproduction.'],['Sexual reproduction','Sexual reproduction involves fusion of the nuclei of two gametes during fertilisation to form a zygote. Offspring are genetically different because genetic material comes from two sources.'],['Meiosis and gametes','Gametes are produced by meiosis and are haploid. A haploid nucleus contains one set of unpaired chromosomes.'],['Diploid nuclei','A diploid nucleus contains two complete sets of chromosomes. Zygotes and ordinary body cells are diploid.'],['Fertilisation and chromosome number','Fusion of one haploid male nucleus and one haploid female nucleus restores the diploid chromosome number in the zygote.']]},
 {id:'c14-flower',chapter:14,name:'Read a flower as a reproductive organ',short:'Flower structure & functions',icon:'02',desc:'Identify sepals, petals, stamens and carpels and connect each structure to its reproductive function.',notes:[['Sepals and petals','Sepals protect the flower while it is in the bud. Petals are often large, coloured and scented in insect-pollinated flowers to attract pollinators.'],['Nectary','A nectary is a gland, often near the base of petals, that secretes sugary nectar to attract insects.'],['Stamen','The stamen is the male reproductive part. The anther produces and contains pollen grains carrying male gamete nuclei. The filament supports the anther.'],['Carpel or pistil','The carpel is the female reproductive part and includes the stigma, style, ovary and ovules.'],['Stigma and style','The stigma has a sticky surface that catches pollen. The style connects the stigma to the ovary and provides the route through which the pollen tube grows.'],['Ovary and ovule','The ovary contains one or more ovules. After fertilisation the ovule develops into a seed and the ovary wall develops into the fruit.']]},
 {id:'c14-pollination',chapter:14,name:'Match flowers to their pollinators',short:'Pollination & flower adaptations',icon:'03',desc:'Compare insect- and wind-pollinated flowers and use structural clues to infer the route of pollen transfer.',notes:[['Pollination','Pollination is the transfer of pollen grains from an anther to a stigma. It is not the same as fertilisation.'],['Insect-pollinated flowers','These usually have large, brightly coloured or scented petals, nectaries, enclosed anthers, a sticky enclosed stigma and smaller quantities of large sticky or spiky pollen.'],['Wind-pollinated flowers','These usually have small or dull petals or no petals, no nectar or scent, exposed dangling anthers, a feathery exposed stigma and very large quantities of smooth, light, dry pollen.'],['Why exposed anthers help','Long flexible filaments hold wind-pollinated anthers outside the flower so air movement can shake pollen free.'],['Why feathery stigmas help','A feathery stigma has a large surface area and hangs outside the flower, increasing the chance of catching airborne pollen.'],['Pollen quantity','Wind pollination is relatively wasteful, so wind-pollinated plants produce very large quantities of pollen to increase the probability that some reaches a suitable stigma.']]},
 {id:'c14-fertilisation',chapter:14,name:'From pollination to a new embryo',short:'Self, cross & fertilisation',icon:'04',desc:'Compare self- and cross-pollination, then sequence pollen-tube growth and fertilisation.',notes:[['Self-pollination','Self-pollination transfers pollen to the stigma of the same flower or another flower on the same plant. It can succeed without relying strongly on external pollinators, but reduces genetic variation.'],['Cross-pollination','Cross-pollination transfers pollen to a flower on a different plant of the same species. It increases genetic variation but depends more on external vectors such as insects or wind.'],['Pollen tube growth','After a compatible pollen grain lands on the stigma, it absorbs moisture, germinates and grows a pollen tube down through the style.'],['Micropyle','The pollen tube enters an ovule through a tiny pore called the micropyle.'],['Fertilisation','The male gamete nucleus travels down the pollen tube and fuses with the female egg nucleus in the ovule. This fusion is fertilisation and forms a diploid zygote.'],['After fertilisation','The zygote divides by mitosis to form an embryo. The fertilised ovule becomes a seed, the ovule wall forms the testa, and the ovary wall grows into the fruit.']]},
 {id:'c14-germination',chapter:14,name:'Wake a dormant seed',short:'Germination & seed metabolism',icon:'05',desc:'Explain the need for water, oxygen and suitable temperature and follow stored starch into growing tissues.',notes:[['Dormancy','A dormant seed is dehydrated and has a very low metabolic rate, helping it survive unfavourable periods.'],['Water','Water rehydrates tissues, causes the testa to swell, activates enzymes and provides a medium for transporting soluble nutrients.'],['Oxygen','Oxygen is required for aerobic respiration, which releases ATP needed for mitosis and growth.'],['Suitable temperature','A suitable temperature allows enzymes such as amylase to work effectively. Low temperature slows reactions and very high temperature can denature enzymes.'],['Light','The guide states that light is not required for germination of most seeds. Light becomes important later when leaves develop and photosynthesis begins.'],['Stored food','Amylase breaks stored insoluble starch in cotyledons or endosperm into soluble maltose and glucose. Glucose is transported to the radicle and plumule, used in respiration and used to make cellulose for new cell walls.']]},
 {id:'c14-strategies',chapter:14,name:'Judge reproductive strategies',short:'Reproductive advantages & practical',icon:'06',desc:'Compare the trade-offs of sexual and asexual reproduction and analyse a germination investigation.',notes:[['Asexual advantages','One parent is enough, population increase can be rapid in favourable conditions, successful traits are preserved and less energy is required for attracting pollinators or producing large quantities of pollen.'],['Asexual disadvantages','There is no genetic variation, so a population may be vulnerable to the same disease or environmental change. Rapid cloning can also cause overcrowding and competition.'],['Sexual advantages','Sexual reproduction produces genetic variation, increasing the chance that some offspring are suited to changing conditions or resistant to new pathogens. Seed dispersal can also reduce competition.'],['Sexual disadvantages','Successful sexual reproduction depends on gamete transfer and often two parents or an external pollination vector. It is slower and can break up favourable combinations of genes.'],['Germination practical','A useful comparison keeps most factors the same while removing one requirement at a time. Seeds with water, oxygen and a suitable temperature should germinate.'],['Interpreting the tubes','In the guide practical, the control tube has water, air and 20°C. A cold tube lacks suitable warmth, boiled cooled water under oil lacks oxygen, and dry cotton wool lacks water. Only the control is expected to germinate.']]}
];

// Chapter 14 · 48 activities (42 objective + 6 written reflection tasks)
add('c14-modes','mcq','Which statement defines asexual reproduction?',{options:['Fusion of two gamete nuclei to form a zygote','Production of genetically identical offspring from one parent','Production of haploid gametes by meiosis only','Transfer of pollen from anther to stigma'],answer:1},'Asexual reproduction produces genetically identical offspring from one parent and does not involve fusion of gametes.');
add('c14-modes','fill','A nucleus containing one set of unpaired chromosomes is described as _____.',{answer:['haploid','haploid nucleus']},'Gamete nuclei are haploid and contain one set of chromosomes.');
add('c14-modes','multi','Which are examples of asexual reproduction in plants given in the guide?',{options:['Potato stem tubers','Strawberry runners','Bulbs','Stem or leaf cuttings','Fusion of pollen and egg nuclei'],answer:[0,1,2,3]},'Tubers, runners, bulbs and cuttings can produce new plants without fusion of gametes.');
add('c14-modes','match','Match each term to its description.',{pairs:[['Haploid nucleus','One set of unpaired chromosomes'],['Diploid nucleus','Two complete sets of chromosomes'],['Mitosis','Cell division involved in asexual reproduction'],['Zygote','Diploid cell formed by fertilisation']]},'Fertilisation combines two haploid nuclei to restore the diploid chromosome number.');
add('c14-modes','matrix','Evaluate these statements about reproduction.',{rows:[['Asexual offspring are genetically identical to the parent in the definition used here.',true],['Sexual reproduction involves fusion of gamete nuclei.',true],['Gametes are diploid body cells.',false],['Fertilisation restores the diploid chromosome number.',true]]},'Gametes are haploid; the zygote formed by their fusion is diploid.');
add('c14-modes','mcq','What happens to chromosome sets during fertilisation?',{options:['Two diploid nuclei form one haploid nucleus','Two haploid nuclei fuse to form one diploid nucleus','One haploid nucleus divides to make two diploid nuclei','Chromosome number is lost completely'],answer:1},'A haploid male gamete nucleus and a haploid female gamete nucleus fuse to form a diploid zygote.');
add('c14-modes','order','Arrange these events in a sexual reproductive sequence.',{items:['A diploid zygote forms','Haploid gametes are produced','Two gamete nuclei fuse','Meiosis produces gametes'],answer:['Meiosis produces gametes','Haploid gametes are produced','Two gamete nuclei fuse','A diploid zygote forms']},'Meiosis produces haploid gametes; fertilisation fuses their nuclei and restores diploidy.');
add('c14-modes','written','Compare asexual and sexual reproduction using number of parents, gametes, cell division and genetic variation.',{rubric:['Asexual reproduction requires one parent and no fusion of gametes.','Asexual reproduction involves mitosis and produces genetically identical offspring.','Sexual reproduction involves fusion of the nuclei of two gametes to form a zygote.','Gametes are haploid and are produced by meiosis.','Sexual reproduction produces genetically different offspring / variation.']},'Use paired comparisons and include the role of gametes and chromosome sets.');

add('c14-flower','mcq','Which flower structure produces and contains pollen grains?',{options:['Stigma','Anther','Ovule','Sepal'],answer:1},'The anther is part of the stamen and produces pollen grains carrying male gamete nuclei.');
add('c14-flower','fill','The sticky surface that receives pollen grains is the _____.',{answer:['stigma']},'The stigma catches pollen during pollination.');
add('c14-flower','multi','Which structures are parts of the carpel or pistil?',{options:['Stigma','Style','Ovary','Ovule','Anther'],answer:[0,1,2,3]},'The carpel includes stigma, style, ovary and ovules. The anther belongs to the stamen.');
add('c14-flower','match','Match each flower structure to its function.',{pairs:[['Sepal','Protects the flower in the bud'],['Filament','Supports the anther'],['Style','Connects stigma to ovary and carries the pollen tube'],['Nectary','Produces sugary nectar']]},'Flower structures have specialised roles in protection, attraction, pollen production and fertilisation.');
add('c14-flower','matrix','Check these flower-structure statements.',{rows:[['The stamen is the male reproductive part.',true],['The ovary contains ovules.',true],['The ovule develops into the fruit after fertilisation.',false],['Petals may attract insect pollinators.',true]]},'The fertilised ovule develops into a seed; the ovary wall develops into the fruit.');
add('c14-flower','mcq','What is the function of the filament?',{options:['It makes nectar','It supports and positions the anther','It catches pollen on a sticky surface','It develops into the seed coat'],answer:1},'The filament is the stalk that holds the anther in position.');
add('c14-flower','order','Arrange these female flower structures from the top of the carpel towards the inside of the ovary.',{items:['Ovule','Ovary','Style','Stigma'],answer:['Stigma','Style','Ovary','Ovule']},'Pollen lands on the stigma, the pollen tube grows through the style into the ovary, and then enters an ovule.');
add('c14-flower','written','Describe the functions of the stigma, style, ovary and ovule in flowering-plant reproduction.',{rubric:['The stigma is sticky and catches pollen grains.','The style connects the stigma to the ovary and provides a route for pollen-tube growth.','The ovary contains one or more ovules.','The ovule contains the female gamete / egg nucleus.','After fertilisation the ovule becomes a seed and the ovary wall becomes the fruit.']},'Link each named structure to a distinct function or post-fertilisation change.');

add('c14-pollination','mcq','Which combination best identifies a wind-pollinated flower?',{options:['Large coloured petals, nectar and sticky pollen','Exposed anthers, feathery stigma and abundant light pollen','Enclosed anthers and a sticky enclosed stigma with little pollen','Large scented petals and spiky pollen only'],answer:1},'Wind-pollinated flowers commonly expose anthers and feathery stigmas and produce large quantities of light, smooth pollen.');
add('c14-pollination','fill','Pollination is the transfer of pollen grains from an anther to a _____.',{answer:['stigma']},'Pollination is transfer to a stigma; fertilisation is later fusion of nuclei.');
add('c14-pollination','multi','Which features are typical of insect-pollinated flowers?',{options:['Large brightly coloured petals','Nectaries and scent','Sticky or spiky pollen','Feathery stigma hanging outside','Anthers usually enclosed inside the flower'],answer:[0,1,2,4]},'Insect-pollinated flowers usually attract animals and place sticky pollen where it can attach to them.');
add('c14-pollination','match','Match each feature to the pollination method it most strongly supports.',{pairs:[['Feathery exposed stigma','Wind pollination'],['Large scented petals','Insect pollination'],['Very large quantity of smooth light pollen','Wind pollination'],['Nectar production','Insect pollination']]},'The structural pattern reflects the different ways pollen is transferred.');
add('c14-pollination','matrix','Evaluate these pollination statements.',{rows:[['Pollination is the same process as fertilisation.',false],['Wind-pollinated anthers often dangle outside the flower.',true],['Insect-pollinated flowers usually produce more pollen than wind-pollinated flowers.',false],['A feathery stigma helps catch airborne pollen.',true]]},'Wind pollination wastes more pollen, so wind-pollinated plants generally produce far larger quantities.');
add('c14-pollination','mcq','Why do wind-pollinated plants usually produce very large quantities of pollen?',{options:['Pollen must make nectar','Most pollen does not reach a compatible stigma','Wind pollen is used for respiration','Each pollen grain forms many seeds directly'],answer:1},'Wind transport is inefficient, so producing more pollen increases the chance that some reaches a suitable stigma.');
add('c14-pollination','order','Arrange the structures in the path of pollen after it is released by an anther and successfully reaches a flower.',{items:['Stigma','Anther','Style','Ovary'],answer:['Anther','Stigma','Style','Ovary']},'Pollen is released from the anther, lands on the stigma and a pollen tube then grows through the style towards the ovary.');
add('c14-pollination','written','Compare an insect-pollinated flower with a wind-pollinated flower using petals, anthers, stigma and pollen.',{rubric:['Insect-pollinated flowers have large / bright / scented petals; wind-pollinated flowers have small / dull / no petals.','Insect-pollinated anthers are usually enclosed; wind-pollinated anthers dangle outside on long filaments.','Insect-pollinated stigmas are usually enclosed and sticky; wind-pollinated stigmas are exposed and feathery.','Insect-pollinated flowers produce less sticky / spiky pollen; wind-pollinated flowers produce much more smooth / light / dry pollen.','Insect-pollinated flowers may have nectar / scent; wind-pollinated flowers generally do not.']},'Use paired structural comparisons rather than isolated lists.');

add('c14-fertilisation','mcq','What is self-pollination?',{options:['Pollen moves to a flower on a different plant of the same species','Pollen moves from anther to stigma of the same flower or another flower on the same plant','Two gamete nuclei fuse','A seed absorbs water and germinates'],answer:1},'Self-pollination occurs within the same flower or between flowers on the same plant.');
add('c14-fertilisation','fill','The tiny pore through which the pollen tube enters the ovule is the _____.',{answer:['micropyle']},'The micropyle is the opening through which the pollen tube enters the ovule.');
add('c14-fertilisation','multi','Which statements about cross-pollination are supported by the guide?',{options:['It occurs between different plants of the same species','It tends to increase genetic variation','It can improve adaptability to changing conditions','It never depends on insects or wind','It can improve the chance of disease resistance in a population'],answer:[0,1,2,4]},'Cross-pollination depends more strongly on external vectors but increases genetic variation.');
add('c14-fertilisation','match','Match each event or structure to the correct outcome.',{pairs:[['Male nucleus + female nucleus','Diploid zygote'],['Fertilised ovule','Seed'],['Ovule wall','Testa / seed coat'],['Ovary wall','Fruit']]},'After fertilisation, the ovule becomes the seed and the ovary wall forms the fruit.');
add('c14-fertilisation','matrix','Evaluate the fertilisation statements.',{rows:[['A pollen grain germinates on a compatible stigma.',true],['The pollen tube grows through the style.',true],['The whole pollen grain fuses with the ovary wall.',false],['The male nucleus fuses with the female egg nucleus.',true]]},'Fertilisation is specifically the fusion of male and female nuclei.');
add('c14-fertilisation','mcq','Which event is fertilisation?',{options:['Transfer of pollen from anther to stigma','Fusion of male and female gamete nuclei','Growth of the pollen tube through the style','Development of the ovary wall into fruit'],answer:1},'Pollination is transfer; fertilisation is fusion of the two gamete nuclei.');
add('c14-fertilisation','order','Arrange the events from pollination to fertilisation.',{items:['Male nucleus fuses with female nucleus','Pollen tube enters the ovule through the micropyle','Pollen grain lands on the stigma','Pollen tube grows through the style'],answer:['Pollen grain lands on the stigma','Pollen tube grows through the style','Pollen tube enters the ovule through the micropyle','Male nucleus fuses with female nucleus']},'This sequence separates pollination, tube growth, entry to the ovule and nuclear fusion.');
add('c14-fertilisation','written','Describe the events from a pollen grain landing on a stigma until fertilisation occurs.',{rubric:['The pollen grain absorbs moisture and germinates on the stigma.','A pollen tube grows down through the style, using digestive enzymes to form a pathway.','The pollen tube enters the ovule through the micropyle.','The male gamete nucleus travels down the pollen tube.','The male nucleus fuses with the female / egg nucleus.','A diploid zygote is formed.']},'Keep pollination and fertilisation distinct and refer to fusion of nuclei.');

add('c14-germination','mcq','Which set of conditions is required for germination of most seeds according to the guide?',{options:['Water, oxygen and a suitable temperature','Light, carbon dioxide and chlorophyll','Water, light and soil minerals only','Oxygen, nectar and a pollinator'],answer:0},'The guide identifies water, oxygen and a suitable temperature as the three essential conditions.');
add('c14-germination','fill','During germination, amylase breaks stored starch into maltose and _____.',{answer:['glucose']},'Stored insoluble starch is converted into soluble sugars that can be transported to growing tissues.');
add('c14-germination','multi','Which statements explain why water is needed for germination?',{options:['It rehydrates seed tissues','It activates metabolic enzymes','It helps the testa swell and burst','It provides a medium for transport of dissolved nutrients','It supplies oxygen for respiration'],answer:[0,1,2,3]},'Oxygen is a separate requirement; water supports rehydration, enzyme activity and transport.');
add('c14-germination','match','Match each germination requirement or product to its role.',{pairs:[['Oxygen','Needed for aerobic respiration'],['Suitable temperature','Allows effective enzyme activity'],['Glucose','Used in respiration and to make cellulose'],['Radicle','Developing root']]},'Each requirement supports metabolism or growth of the embryo.');
add('c14-germination','matrix','Check these germination statements.',{rows:[['Most seeds need light in order to germinate.',false],['Oxygen is needed for aerobic respiration during germination.',true],['Very high temperature can denature enzymes.',true],['The radicle is the young shoot.',false]]},'The radicle is the young root; the plumule is the young shoot.');
add('c14-germination','mcq','Why is a suitable temperature required during seed germination?',{options:['It provides suitable conditions for enzyme activity','It supplies chromosomes to the embryo','It replaces oxygen in respiration','It turns glucose directly into pollen'],answer:0},'Enzyme-controlled reactions such as starch breakdown need a suitable temperature.');
add('c14-germination','order','Arrange the biochemical events during early germination.',{items:['Glucose is used in respiration and growth','Amylase breaks down stored starch','Water enters and rehydrates the seed','Soluble sugars move to growing tissues'],answer:['Water enters and rehydrates the seed','Amylase breaks down stored starch','Soluble sugars move to growing tissues','Glucose is used in respiration and growth']},'Water activates metabolism, stored food is mobilised, and soluble sugars are delivered to the growing embryo.');
add('c14-germination','written','Explain why water, oxygen and a suitable temperature are needed for germination.',{rubric:['Water rehydrates cells / activates enzymes / causes the testa to swell / allows transport of dissolved nutrients.','Oxygen is required for aerobic respiration.','Respiration releases ATP / energy for mitosis and growth.','A suitable temperature allows enzymes to work effectively.','Very low temperature slows enzyme-controlled reactions and very high temperature may denature enzymes.','Light is not required for germination of most seeds according to the guide.']},'Link each environmental condition to a specific biological process.');

add('c14-strategies','mcq','What is one major advantage of asexual reproduction in favourable conditions?',{options:['It always produces genetic variation','Only one parent is needed and population growth can be rapid','It always prevents overcrowding','It depends on successful pollination'],answer:1},'Asexual reproduction can rapidly increase numbers without needing a mate or pollination.');
add('c14-strategies','fill','Sexual reproduction increases genetic _____ among offspring.',{answer:['variation','variability']},'Genetic variation can improve adaptability when conditions or pathogens change.');
add('c14-strategies','multi','Which are disadvantages of asexual reproduction listed in the guide?',{options:['No genetic variation','A whole population may be vulnerable to the same disease','Overcrowding and competition may occur','Two parents are always needed','Successful traits cannot be preserved'],answer:[0,1,2]},'Clonal populations can grow rapidly but share the same genetic weaknesses.');
add('c14-strategies','match','Match each feature to the reproductive method it describes.',{pairs:[['Rapid population growth','Asexual reproduction'],['Genetic variation in offspring','Sexual reproduction'],['One parent sufficient','Asexual reproduction'],['Greater adaptability to changing conditions','Sexual reproduction']]},'The major trade-off is speed and certainty versus genetic variation and adaptability.');
add('c14-strategies','matrix','Evaluate the reproduction-strategy statements.',{rows:[['Sexual reproduction can produce offspring with different combinations of genes.',true],['Asexual reproduction always requires a pollinating vector.',false],['Asexual clones may all be susceptible to the same pathogen.',true],['Sexual reproduction is always faster than asexual reproduction.',false]]},'Sexual reproduction creates variation but is generally slower and depends on successful gamete transfer.');
add('c14-strategies','mcq','In the guide germination investigation, which tube should germinate?',{options:['Water + air + 20°C','Water + air + 4°C','Boiled cooled water under an oil layer + 20°C','Dry cotton wool + air + 20°C'],answer:0},'Only the control tube has water, oxygen and a suitable warm temperature.');
add('c14-strategies','order','Arrange these experimental treatments from the factor they remove to the control with all conditions present.',{items:['Control: water + air + 20°C','No water: dry cotton wool + air + 20°C','No oxygen: boiled cooled water + oil + 20°C','Low temperature: water + air + 4°C'],answer:['No water: dry cotton wool + air + 20°C','No oxygen: boiled cooled water + oil + 20°C','Low temperature: water + air + 4°C','Control: water + air + 20°C']},'Each treatment removes one required condition, while the control provides all three.');
add('c14-strategies','written','Compare the advantages and disadvantages of sexual and asexual reproduction in plants.',{rubric:['Asexual reproduction needs one parent, can be rapid and preserves successful traits.','Asexual reproduction produces no genetic variation, so the population can be vulnerable to the same disease or environmental change.','Asexual reproduction may lead to overcrowding and competition.','Sexual reproduction produces genetic variation.','Variation increases the chance of adaptation to changing conditions or new pathogens.','Sexual reproduction is slower and depends on successful gamete transfer / pollination / two parents.']},'Explain the trade-off between rapid cloning and the adaptive value of genetic variation.');


// Chapter 15 · Reproduction in humans
const C15TOPICS = [
 {id:"c15-anatomy",chapter:15,name:"Map the reproductive systems",short:"Male & female anatomy",icon:"01",desc:"Connect reproductive organs to gamete production, transport, fertilisation and birth.",notes:[["Male reproductive system","The testes produce sperm and testosterone. They are held in the scrotum outside the abdominal cavity, where the temperature is slightly lower than core body temperature for sperm production."],["Sperm transport","Muscle-walled sperm ducts carry sperm towards the urethra during ejaculation. The urethra passes through the penis and can carry urine or semen, but not simultaneously according to the guide."],["Seminal fluid","The prostate gland and seminal vesicles add seminal fluid containing nutrients and alkaline buffers. Semen is sperm plus seminal fluid."],["Female reproductive system","The ovaries produce eggs and the hormones oestrogen and progesterone. An egg is released during ovulation."],["Oviduct and uterus","The oviduct connects an ovary to the uterus. It is lined with cilia and is the site of fertilisation. The uterus has a thick muscular wall and a blood-rich endometrium for implantation and development."],["Cervix and vagina","The cervix is a ring of muscle at the lower end of the uterus. The vagina receives semen during intercourse and also serves as the birth canal."]]},
 {id:"c15-gametes",chapter:15,name:"Compare sperm and egg cells",short:"Gamete adaptations",icon:"02",desc:"Relate sperm and egg structures to movement, fertilisation and early development.",notes:[["Sperm cell","A sperm is very small and motile. It has a head, midpiece and flagellum, and carries a haploid nucleus."],["Acrosome","The acrosome contains digestive enzymes that help the sperm penetrate the protective jelly coat of the egg."],["Mitochondria and flagellum","The midpiece contains many mitochondria that release ATP for movement of the flagellum."],["Egg cell","The egg is large and non-motile. It is moved along the oviduct by cilia and contains a haploid nucleus."],["Stored nutrients","The guide describes the egg cytoplasm as containing nutrient or yolk reserves that support the early embryo before implantation."],["Jelly coat","After the first sperm nucleus enters, the egg jelly coat changes so that additional sperm cannot enter, preventing polyspermy."]]},
 {id:"c15-fertilisation",chapter:15,name:"Follow fertilisation to implantation",short:"Fertilisation & implantation",icon:"03",desc:"Sequence sperm movement, nuclear fusion, mitosis and implantation in the uterus.",notes:[["Where fertilisation occurs","Semen is deposited in the vagina. Sperm swim through the cervix and uterus into the oviduct, where fertilisation occurs."],["Acrosome reaction","Acrosome enzymes digest the outer jelly layer of the egg so a sperm can reach and fuse with the egg membrane."],["Nuclear fusion","The male haploid nucleus fuses with the female haploid nucleus to form a diploid zygote."],["Early divisions","The zygote divides repeatedly by mitosis while moving down the oviduct."],["Embryo or blastocyst","The dividing zygote forms a ball of cells described in the guide as a blastocyst / embryo within several days."],["Implantation","Implantation is attachment and embedding of the embryo in the thick, blood-rich lining of the uterus, the endometrium."]]},
 {id:"c15-placenta",chapter:15,name:"Decode pregnancy exchange",short:"Placenta, cord & amniotic fluid",icon:"04",desc:"Explain exchange across the placenta and the roles of the umbilical cord and amniotic fluid.",notes:[["Placenta structure","The placenta is embedded in the uterus wall and has finger-like villi that provide a large exchange surface. Maternal and fetal blood remain separate."],["Mother to fetus","Oxygen, glucose, amino acids, fatty acids, vitamins, mineral ions, water and maternal antibodies can pass from mother to fetus according to the guide."],["Fetus to mother","Carbon dioxide, urea and other metabolic wastes pass from fetal blood to maternal blood for removal."],["Umbilical vessels","Two umbilical arteries carry deoxygenated blood and wastes from fetus to placenta. One umbilical vein carries oxygenated, nutrient-rich blood from placenta to fetus."],["Amniotic fluid","Amniotic fluid cushions the fetus against mechanical shocks, helps maintain a stable thermal environment and permits movement."],["Substances that can cross","The guide notes that nicotine, carbon monoxide, alcohol and some viruses can cross the placenta."]]},
 {id:"c15-cycle",chapter:15,name:"Control puberty and the menstrual cycle",short:"Puberty & menstrual hormones",icon:"05",desc:"Link testosterone and oestrogen to puberty, then follow FSH, LH, oestrogen and progesterone through the cycle.",notes:[["Puberty hormones","Testosterone from the testes drives male secondary sexual characteristics. Oestrogen from the ovaries drives female secondary sexual characteristics."],["FSH","FSH is secreted by the pituitary gland and stimulates development of an ovarian follicle. The developing follicle secretes oestrogen."],["Oestrogen","Oestrogen repairs and thickens the uterus lining. High oestrogen inhibits FSH and helps trigger an LH surge."],["LH and ovulation","A surge of LH from the pituitary triggers ovulation, around day 14 in the guide's 28-day model."],["Progesterone","After ovulation the empty follicle becomes the corpus luteum, which secretes progesterone. Progesterone maintains the uterus lining and inhibits FSH and LH."],["If fertilisation occurs or not","Without fertilisation, the corpus luteum degenerates, hormone levels fall and menstruation begins. If fertilisation occurs, the guide describes hCG maintaining the corpus luteum until the placenta later takes over progesterone secretion."]]},
 {id:"c15-hiv",chapter:15,name:"Understand STIs and HIV",short:"STIs, HIV & prevention",icon:"06",desc:"Explain HIV transmission, immune damage and prevention measures described in the guide.",notes:[["STI definition","An STI is an infection transmitted from one person to another through sexual contact. The guide also discusses transmission involving blood and reproductive fluids."],["HIV","HIV is a virus that destroys specific white blood cells, including T-helper lymphocytes, weakening immune defence over time."],["AIDS","AIDS is the advanced stage of HIV infection in which the immune system is severely damaged, allowing serious opportunistic infections or rare cancers to develop."],["Sexual and blood transmission","HIV can be transmitted through unprotected sexual contact, sharing unsterilised needles and infected blood transfusions."],["Mother-to-child transmission","The guide states that HIV can pass from mother to child across the placenta, during childbirth or through breast milk."],["Prevention and control","Measures in the guide include condoms, sterile disposable needles, screening donated blood, and antiretroviral treatment for pregnant HIV-positive mothers."]]},
];

add("c15-anatomy","match","Match each female reproductive structure to its function.",{"pairs":[["Ovary","Produces eggs and female sex hormones"],["Oviduct","Site of fertilisation"],["Uterus","Site of implantation and fetal development"],["Cervix","Ring of muscle at the lower uterus"]]},"The female reproductive organs have distinct roles in gamete production, fertilisation, implantation and pregnancy.");

add("c15-anatomy","written","Compare the roles of four structures in the male and female reproductive systems.",{"rubric":["Testes produce sperm and testosterone.","Sperm ducts carry sperm towards the urethra.","Ovaries produce eggs and oestrogen / progesterone.","Oviducts transport the egg / zygote and are the site of fertilisation.","The uterus is the site of implantation and fetal development.","The cervix is a ring of muscle between uterus and vagina."]},"Use precise organ names and state a distinct function for each one.");

add("c15-gametes","multi","Which adaptations of a sperm cell are described in the guide?",{"options":["Acrosome containing enzymes","Many mitochondria in the midpiece","A flagellum for movement","A haploid nucleus","A large food-filled cytoplasm"],"answer":[0,1,2,3]},"The sperm has an acrosome, many mitochondria, a flagellum and a haploid nucleus; the egg is the larger gamete with nutrient reserves.");
add("c15-gametes","match","Match each gamete feature to its role.",{"pairs":[["Sperm acrosome","Contains digestive enzymes"],["Sperm mitochondria","Release ATP for movement"],["Sperm flagellum","Provides propulsion"],["Egg nutrient store","Supports early development before implantation"]]},"Each structure is linked to movement, penetration of the egg or early embryonic development.");
add("c15-gametes","matrix","Check these sperm and egg statements.",{"rows":[["Both sperm and egg nuclei are haploid.",true],["The egg is motile because it has a flagellum.",false],["The guide describes sperm as being produced in very large numbers.",true],["The sperm cell is larger than the egg cell.",false]]},"Both gametes are haploid, but they differ strongly in size, mobility and number produced.");
add("c15-gametes","mcq","What is the role of the many mitochondria in the sperm midpiece?",{"options":["Release ATP to power flagellar movement","Produce the egg coat","Store the diploid chromosome set","Secrete progesterone"],"answer":0},"Mitochondria release energy through aerobic respiration to power sperm movement.");

add("c15-gametes","written","Compare sperm and egg cells using size, movement, numbers produced and structural adaptations.",{"rubric":["Sperm are very small; eggs are much larger.","Sperm are motile using a flagellum; eggs are non-motile and are moved by cilia in the oviduct.","Sperm are produced in very large numbers; typically one egg is released in a cycle.","Sperm have an acrosome containing enzymes.","Sperm have many mitochondria to provide ATP for movement.","The egg has a large cytoplasm / nutrient store and a protective jelly coat."]},"Make paired comparisons and link structures to their functions.");
add("c15-fertilisation","mcq","Where does fertilisation normally occur according to the guide?",{"options":["Oviduct","Uterus","Ovary","Vagina"],"answer":0},"The guide identifies the oviduct as the site of fertilisation.");

add("c15-fertilisation","multi","Which events occur during fertilisation in the guide?",{"options":["Sperm reach the egg in the oviduct","Acrosome enzymes digest the egg coat","Male and female haploid nuclei fuse","A diploid zygote forms","The placenta forms before nuclear fusion"],"answer":[0,1,2,3]},"Fertilisation occurs in the oviduct and ends with fusion of haploid nuclei to form a diploid zygote.");
add("c15-fertilisation","match","Match each event to the correct description.",{"pairs":[["Fertilisation","Fusion of male and female nuclei"],["Mitosis","Repeated cell divisions of the zygote"],["Implantation","Embedding of the embryo in the endometrium"],["Endometrium","Blood-rich lining of the uterus"]]},"Keep fertilisation, mitosis and implantation as separate stages.");
add("c15-fertilisation","matrix","Evaluate these statements about early development.",{"rows":[["Fertilisation occurs in the uterus.",false],["The zygote divides by mitosis as it travels towards the uterus.",true],["Implantation occurs in the lining of the uterus.",true],["The zygote is haploid after fertilisation.",false]]},"Fertilisation occurs in the oviduct and forms a diploid zygote; implantation occurs later in the uterine lining.");
add("c15-fertilisation","mcq","What is implantation?",{"options":["Attachment and embedding of the embryo in the uterus lining","Release of an egg from an ovary","Fusion of sperm and egg nuclei","Production of sperm in a testis"],"answer":0},"Implantation is the attachment and embedding of the embryo in the endometrium.");
add("c15-fertilisation","order","Arrange these events from intercourse to implantation.",{"items":["Embryo implants in the endometrium","Sperm travel through cervix and uterus","Male and female nuclei fuse in the oviduct","Zygote divides by mitosis"],"answer":["Sperm travel through cervix and uterus","Male and female nuclei fuse in the oviduct","Zygote divides by mitosis","Embryo implants in the endometrium"]},"Sperm reach the oviduct first, fertilisation forms the zygote, mitosis follows, then the embryo implants in the uterus.");
add("c15-fertilisation","written","Describe the sequence from deposition of semen to implantation of the embryo.",{"rubric":["Semen is deposited in the vagina near the cervix.","Sperm swim through the cervix and uterus into the oviduct.","Acrosome enzymes help a sperm penetrate the egg coat.","The male and female haploid nuclei fuse to form a diploid zygote.","The zygote divides repeatedly by mitosis while moving towards the uterus.","The embryo attaches and embeds in the endometrium."]},"State the location of fertilisation and distinguish it from implantation.");

 {id:"c16-terms",chapter:16,name:"Build the genetics vocabulary",short:"Chromosomes, genes & alleles",icon:"01",desc:"Distinguish chromosomes, genes, alleles, genotypes, phenotypes and chromosome sets precisely.",notes:[["Chromosomes and genes","A chromosome is a thread-like DNA structure carrying genetic information in genes. A gene is a length of DNA that codes for a specific protein."],["Alleles","An allele is an alternative form of a gene. Different alleles of the same gene occupy the same locus on homologous chromosomes."],["Haploid and diploid","A haploid nucleus contains one set of unpaired chromosomes; a diploid nucleus contains two sets. In humans the guide gives n = 23 and 2n = 46."],["Genotype and phenotype","Genotype is the genetic make-up in terms of alleles present. Phenotype is an observable feature or characteristic."],["Homozygous and heterozygous","Homozygous means two identical alleles for a gene; heterozygous means two different alleles. Homozygous individuals are described as pure-breeding in the guide."],["Dominant and recessive","A dominant allele is expressed when present. A recessive allele is expressed only when no dominant allele is present."]]},

 {id:"c16-crosses",chapter:16,name:"Solve monohybrid crosses",short:"Monohybrid & test crosses",icon:"03",desc:"Use allele symbols, gametes and offspring ratios to reason through simple inheritance and test crosses.",notes:[["Monohybrid inheritance","A monohybrid cross follows one gene controlling one characteristic."],["Tt × Tt","For a heterozygous × heterozygous cross, the guide gives a genotypic ratio of 1 TT : 2 Tt : 1 tt and a phenotypic ratio of 3 dominant : 1 recessive."],["Tt × tt","For a heterozygous × homozygous recessive cross, the guide gives a 1 Tt : 1 tt genotypic ratio and a 1 dominant : 1 recessive phenotypic ratio."],["Test cross","To investigate an unknown dominant phenotype, cross it with a known homozygous recessive individual."],["Interpreting a test cross","If any offspring show the recessive phenotype, the unknown parent must be heterozygous. If all show the dominant phenotype, the guide says the parent is likely homozygous dominant."],["Exam diagrams","The guide advises showing parent phenotypes and genotypes, gametes, a Punnett square or cross lines, and offspring genotypes and phenotypes linked to ratios."]]},

(function(root){
 const normal=s=>String(s??'').normalize('NFKD').toLowerCase().replace(/[!?;:]/g,'').replace(/\.(?=\s|$)/g,'').replace(/\s+/g,' ').trim();
 const unitAlias=u=>String(u||'').toLowerCase().replace(/μ/g,'µ').replace(/micrometres?|micrometers?/g,'µm').replace(/millimetres?|millimeters?/g,'mm').replace(/centimetres?|centimeters?/g,'cm').replace(/grams?/g,'g').replace(/seconds?/g,'s').replace(/minutes?/g,'min').replace(/\s+/g,'');
 function numeric(s){const raw=String(s??'').trim().replace(/,/g,'');const m=raw.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+))\s*(%|[a-zA-Zµμ°]+(?:\/[a-zA-Zµμ°]+)?)?$/);if(!m)return null;const value=Number(m[1]);return Number.isFinite(value)?{value,unit:unitAlias(m[2]||'')}:null;}
 function fillEqual(expected,actual,q){const e=numeric(expected),a=numeric(actual);if(e&&a){const allowed=Array.isArray(q.numericUnits)?q.numericUnits.map(unitAlias):null;if(allowed&&!allowed.includes(a.unit))return false;if(!allowed&&!e.unit&&a.unit)return false;if(e.unit&&a.unit&&e.unit!==a.unit)return false;const tol=Number.isFinite(Number(q.numericTolerance))?Math.abs(Number(q.numericTolerance)):Math.max(1e-9,Math.abs(e.value)*1e-6);return Math.abs(e.value-a.value)<=tol;}return normal(expected)===normal(actual);}
 function grade(q,a){
  if(q.type==='mcq')return a===q.answer;
  if(q.type==='fill')return q.answer.some(v=>fillEqual(v,a,q));
  if(q.type==='multi')return Array.isArray(a)&&a.length===q.answer.length&&q.answer.every(v=>a.includes(v));
  if(q.type==='matrix')return q.rows.every((r,i)=>a?.[i]===r[1]);
  if((q.type==='match'||q.type==='label'))return q.pairs.every((p,i)=>a?.[i]===p[1]);
   if(q.type==='drag')return q.statements.every((statement,i)=>a?.[i]===statement[1]);
  if(q.type==='order')return q.answer.every((v,i)=>a?.[i]===v);

 }
 function result(progress,q,correct,hint=false,now=Date.now()){
  const old=progress[q.id]||{attempts:0,stage:0,everCorrect:false,lastCredit:0};
  const fresh=!old.everCorrect, due=!!old.due&&old.due<=now, repairing=old.lastCorrect===false;
  const newDay=now-(old.lastCredit||0)>=86400000;

y mass and are described by the guide as almost always upright. Pyramids of energy are always upright."],["Human diet efficiency","Eating crop plants directly is more energy-efficient than feeding crops to livestock and then eating the livestock because the extra trophic level adds major energy losses."]]},{"id":"c18-carbon","chapter":18,"name":"Cycle carbon through ecosystems","short":"Carbon cycle","icon":"03","desc":"Connect photosynthesis, respiration, decomposition, combustion and fossilisation in the carbon cycle.","notes":[["Recycling","Unlike energy, which flows through ecosystems and is lost as heat, nutrients and elements are recycled."],["Photosynthesis","Plants and algae remove carbon dioxide from the atmosphere and use it to make organic compounds."],["Respiration","Plants, animals and decomposers return carbon dioxide to the atmosphere during respiration."],["Decomposition","Decomposers break down dead material and respire while doing so, returning carbon dioxide."],["Combustion","Burning fossil fuels or wood releases carbon dioxide to the atmosphere."],["Fossilisation","In anaerobic conditions, some dead organisms do not decay fully and can form fossil fuels over millions of years."]]},{"id":"c18-nitrogen","chapter":18,"name":"Track nitrogen through soil and life","short":"Nitrogen cycle","icon":"04","desc":"Distinguish nitrogen-fixing, nitrifying and denitrifying bacteria and follow nitrogen through living organisms.","notes":[["Why nitrogen matters","Nitrogen is needed to make amino acids, proteins and DNA."],["Atmospheric nitrogen","The guide states that nitrogen gas forms about 78% of air but cannot be used directly by plants or animals."],["Nitrogen fixation","Nitrogen-fixing bacteria convert nitrogen gas into ammonium ions or nitrates. They can be free-living in soil or live in root nodules of legumes."],["Nitrification","Nitrifying bacteria convert ammonium ions to nitrites and then nitrates in well-aerated soil. Plants absorb nitrates through ne","Vaccinations, antibiotics and disease control are listed as medical advances that contribute to population increase."],["Environmental impacts","The guide lists deforestation, habitat destruction, species extinction and climate change as environmental impacts associated with human population growth."],["Ecological connection","Population growth changes the scale of resource use and the pressures placed on ecosystems; use the guide's listed causes and impacts when explaining this link."]]}];

add("c18-ecosystems","multi","Which statements match the ecological roles described in the guide?",{"options":["A primary consumer feeds directly on a producer","A secondary consumer feeds on a primary consumer","A decomposer gets energy from dead or waste organic material","An omnivore eats both plants and animals","A producer must obtain all organic nutrients by eating other organisms"],"answer":[0,1,2,3]},"Consumers obtain energy by feeding, while producers make their own organic nutrients.");
add("c18-ecosystems","match","Match each ecological term to its role.",{"pairs":[["Producer","Makes its own organic nutrients"],["Primary consumer","Feeds directly on producers"],["Secondary consumer","Feeds on primary consumers"],["Decomposer","Gets energy from dead or waste organic material"]]},"These roles describe how organisms obtain energy within food chains and webs.");
add("c18-ecosystems","matrix","Evaluate these statements about food chains and food webs.",{"rows":[["A food chain begins with a producer.",true],["A food web is a network of interconnected food chains.",true],["Food-chain arrows point from the consumer to the organism it eats.",false],["The Sun is the principal energy input to biological systems.",true]]},"Arrows point from the organism being eaten to the consumer because they show energy transfer.");

add("c18-ecosystems","order","Arrange the organisms into the food chain given in the guide, starting with the producer.",{"items":["Hawk","Lizard","Grass","Locust"],"answer":["Grass","Locust","Lizard","Hawk"]},"The guide gives the example Grass → Locust → Lizard → Hawk, with arrows showing energy transfer.");
add("c18-ecosystems","written","Explain how producers, consumers and decomposers fit into an ecosystem, and state what arrows in food chains represent.",{"rubric":["An ecosystem contains a community and its environment interacting together.","Producers make their own organic nutrients, usually by photosynthesis.","Consumers obtain energy by feeding on other organisms.","Primary consumers feed on producers; higher consumers feed on other consumers.","Decomposers obtain energy from dead or waste organic material.","Food-chain arrows point from the organism being eaten to the consumer and show energy transfer."]},"Use the ecological roles and arrow direction exactly and connect them to energy transfer.");
add("c18-energy","mcq","Which organisms occupy trophic level 1?",{"options":["Producers","Primary consumers","Secondary consumers","Tertiary consumers"],"answer":0},"The first trophic level contains producers.");
add("c18-energy","fill","Approximately _____% of energy at one trophic level is transferred to the next according to the guide.",{"answer":["10","10%","10.0"]},"The guide uses an approximate 10% transfer rule between trophic levels.");
add("c18-energy","multi","Which processes or materials are listed as causes of energy loss between trophic levels?",{"options":["Respiration as heat","Movement and muscle contraction","Excretion","Egestion","Uneaten or inedible parts","Photosynthesis by the consumer"],"answer":[0,1,2,3,4]},"Most energy is not transferred because it is lost through metabolism, waste or material that is not eaten or digested.");
add("c18-energy","match","Match each ecological pyramid to what it represents.",{"pairs":[["Pyramid of numbers","Relative number of individual organisms"],["Pyramid of biomass","Total dry mass of biological material"],["Pyramid of energy","Energy entering each trophic level over time"],["Inverted numbers pyramid","Can occur when one large producer supports many consumers"]]},"The three pyramid types represent different ecological quantities and do not always have identical shapes.");
add("c18-energy","matrix","Check these statements about ecological pyramids and energy transfer.",{"rows":[["A pyramid of numbers can be inverted.",true],["The guide describes pyramids of biomass as almost always upright.",true],["A pyramid of energy is always upright.",true],["About 90% of energy is transferred to the next trophic level.",false]]},"Only about 10% is transferred; energy pyramids therefore narrow at higher trophic levels.");
add("c18-energy","mcq","Why is eating crop plants directly more energy-efficient than feeding crops to livestock and then eating the livestock?",{"options":["It skips an extra trophic level and avoids much of the associated energy loss","Plants contain no chemical energy","Livestock do not respire","Humans cannot digest animal food"],"answer":0},"An extra trophic level means additional energy is lost before it reaches humans.");
add("c18-energy","order","Arrange these trophic roles from the base of a four-level food chain to the top.",{"items":["Tertiary consumer","Producer","Secondary consumer","Primary consumer"],"answer":["Producer","Primary consumer","Secondary consumer","Tertiary consumer"]},"Trophic levels are numbered from producers upward through consumer levels.");
add("c18-energy","written","Explain why food chains are usually short and why eating crops directly can transfer more of the original energy to humans.",{"rubric":["Energy is lost at every trophic transfer.","Respiration releases energy as heat.","Energy can also be lost in movement, excretion, egestion and uneaten/inedible parts.","Only about 10% is transferred to the next trophic level according to the guide.","Eventually too little energy remains to support another viable trophic level.","Eating crops directly skips the livestock trophic level.","Skipping a trophic level avoids much of the energy loss that would occur in livestock."]},"Link energy losses to both food-chain length and the efficiency of direct crop consumption.");

add("c18-carbon","multi","Which processes return carbon dioxide to the atmosphere according to the guide?",{"options":["Respiration","Combustion","Decomposition","Photosynthesis"],"answer":[0,1,2]},"Respiration, combustion and decomposer respiration return carbon dioxide; photosynthesis removes it.");
add("c18-carbon","match","Match each carbon-cycle process to its role.",{"pairs":[["Photosynthesis","Removes carbon dioxide from the atmosphere"],["Respiration","Releases carbon dioxide from living cells"],["Combustion","Releases carbon dioxide from burning fuels or wood"],["Fossilisation","Can form fossil fuels from incompletely decayed organisms"]]},"These processes transfer carbon between the atmosphere, living organisms and long-term stores.");
add("c18-carbon","matrix","Evaluate these carbon-cycle statements.",{"rows":[["Nutrients and elements are recycled within ecosystems.",true],["Energy is recycled in exactly the same way as carbon.",false],["Decomposers respire while breaking down organic material.",true],["Fossilisation is associated with incomplete decay in anaerobic conditions.",true]]},"The guide contrasts one-way energy flow with recycling of nutrients and elements.");
add("c18-carbon","mcq","Under which condition can dead organisms fail to decay fully and eventually contribute to fossil-fuel formation?",{"options":["Anaerobic conditions","Bright light only","Very high oxygen supply","Continuous photosynthesis"],"answer":0},"The guide links fossilisation with anaerobic conditions such as peat bogs or deep sediments.");
add("c18-carbon","order","Arrange this simplified carbon pathway, beginning with atmospheric carbon dioxide.",{"items":["Carbon dioxide is released by respiration","Carbon enters plant organic compounds","A consumer obtains carbon by feeding","Carbon dioxide is absorbed in photosynthesis"],"answer":["Carbon dioxide is absorbed in photosynthesis","Carbon enters plant organic compounds","A consumer obtains carbon by feeding","Carbon dioxide is released by respiration"]},"Carbon can move from atmospheric carbon dioxide into producers, then consumers, and back to the atmosphere through respiration.");
add("c18-carbon","written","Describe the main processes in the carbon cycle and explain the role of decomposers.",{"rubric":["Photosynthesis removes carbon dioxide from the atmosphere and incorporates carbon into organic compounds.","Feeding transfers carbon through food chains.","Respiration by plants, animals and decomposers returns carbon dioxide to the atmosphere.","Decomposers break down dead or waste organic material.","Combustion of fossil fuels or wood releases carbon dioxide.","Incomplete decay under anaerobic conditions can contribute to fossil-fuel formation over long periods."]},"Describe transfers rather than listing process names without their carbon movement.");
add("c18-nitrogen","mcq","Which bacteria convert atmospheric nitrogen gas into ammonium ions or nitrates?",{"options":["Nitrogen-fixing bacteria","Denitrifying bacteria","Nitrifying bacteria only","Decomposers only"],"answer":0},"Nitrogen-fixing bacteria make atmospheric nitrogen available in forms that can enter the soil nitrogen cycle.");
add("c18-nitrogen","fill","Bacteria that convert ammonium ions to nitrites and then nitrates are called _____ bacteria.",{"answer":["nitrifying","nitrification"]},"Nitrifying bacteria operate in well-aerated soil and form nitrates.");
add("c18-nitrogen","multi","Which statements about the nitrogen cycle are supported by the guide?",{"options":["Plants absorb nitrates through root hair cells by active transport","Decomposers can form ammonium ions from dead proteins and urea","Denitrifying bacteria convert nitrates to nitrogen gas","Nitrogen-fixing bacteria may live in legume root nodules","Plants use atmospheric nitrogen gas directly without conversion"],"answer":[0,1,2,3]},"Atmospheric nitrogen must be fixed before it can enter forms available to plants.");
add("c18-nitrogen","match","Match each group to its role in the nitrogen cycle.",{"pairs":[["Nitrogen-fixing bacteria","Convert nitrogen gas into ammonium ions or nitrates"],["Nitrifying bacteria","Convert ammonium ions through nitrites to nitrates"],["Decomposers","Convert nitrogen in dead material and urea to ammonium ions"],["Denitrifying bacteria","Convert soil nitrates back to nitrogen gas"]]},"Keeping these bacterial roles distinct is a major examiner emphasis in the guide.");
add("c18-nitrogen","matrix","Check these nitrogen-cycle statements.",{"rows":[["Nitrogen is needed to make amino acids, proteins and DNA.",true],["Plants can use atmospheric nitrogen gas directly.",false],["Denitrification is associated with anaerobic or waterlogged soil.",true],["Ploughing soil adds oxygen and can inhibit denitrification.",true]]},"The guide stresses that atmospheric nitrogen is inert for direct plant use and that denitrification is favoured by low-oxygen conditions.");
add("c18-nitrogen","mcq","Why can ploughing soil reduce denitrification according to the guide?",{"options":["It adds oxygen to the soil","It removes all nitrate ions","It prevents plant roots from absorbing water","It converts nitrogen gas directly into protein"],"answer":0},"Denitrifying bacteria are associated with anaerobic conditions, so aeration inhibits the process.");
add("c18-nitrogen","order","Arrange this pathway from nitrogen in dead organic material to nitrogen entering a plant.",{"items":["Plants absorb nitrates through root hair cells","Nitrifying bacteria form nitrates","Decomposers form ammonium ions","Proteins in dead organisms are broken down"],"answer":["Proteins in dead organisms are broken down","Decomposers form ammonium ions","Nitrifying bacteria form nitrates","Plants absorb nitrates through root hair cells"]},"Ammonification is followed by nitrification, after which plants can absorb nitrate ions.");
add("c18-nitrogen","written","Describe the roles of bacteria in the nitrogen cycle.",{"rubric":["Nitrogen-fixing bacteria convert atmospheric nitrogen gas into ammonium ions or nitrates.","They may be free-living in soil or occur in root nodules of leguminous plants.","Decomposers convert nitrogen in dead organisms and urea into ammonium ions.","Nitrifying bacteria convert ammonium ions to nitrites and then nitrates.","Plants absorb nitrates and use nitrogen to make amino acids/proteins.","Denitrifying bacteria convert nitrates back into nitrogen gas.","Denitrification is favoured by anaerobic or waterlogged conditions."]},"Name each bacterial group and state the direction of the nitrogen conversion.");

add("c18-populations","match","Match each phase of a sigmoid population curve to its description.",{"pairs":[["Lag phase","Slow growth while organisms adapt, mature and find mates"],["Log phase","Rapid growth with birth rate greater than death rate"],["Stationary phase","Population levels off near carrying capacity"],["Death phase","Population falls because death rate exceeds birth rate"]]},"The guide describes four phases of population change in a new environment with limited resources.");
add("c18-populations","matrix","Evaluate these statements about population growth phases.",{"rows":[["During the log phase, birth rate is greater than death rate.",true],["At the stationary phase, birth rate equals death rate.",true],["During the death phase, birth rate is greater than death rate.",false],["Limiting factors become important as a population approaches carrying capacity.",true]]},"Stationary populations have balanced birth and death rates, while the death phase has a greater death rate.");
add("c18-populations","mcq","What best describes the stationary phase of a sigmoid population growth curve?",{"options":["Population size levels off as birth rate equals death rate","Population grows fastest because resources are unlimited","Every individual dies at once","Organisms are first adapting and finding mates"],"answer":0},"At the stationary phase the population has reached carrying capacity and birth rate equals death rate.");
add("c18-populations","order","Arrange the four population-growth phases in the order described by the guide.",{"items":["Death phase","Stationary phase","Lag phase","Log phase"],"answer":["Lag phase","Log phase","Stationary phase","Death phase"]},"The guide presents the sequence lag → log/exponential → stationary → death.");
add("c18-populations","written","Explain the four phases of a sigmoid population growth curve and the role of limiting factors.",{"rubric":["Lag phase: growth is slow while organisms adapt, mature and find mates.","Log/exponential phase: growth is rapid and birth rate exceeds death rate while resources are abundant.","Stationary phase: population levels off at carrying capacity and birth rate equals death rate.","Limiting factors such as food, water, space, competition, predation or disease restrict further growth.","Death phase: population decreases because death rate exceeds birth rate, for example after severe resource depletion or toxic waste accumulation."]},"Link changes in birth/death rates and resource availability to each phase.");
