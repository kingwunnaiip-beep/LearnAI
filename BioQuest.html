add('c6-photosynthesis','mcq','Which statement best defines photosynthesis?',{options:['Plants synthesise carbohydrates from carbon dioxide and water using light energy','Plants absorb glucose directly from soil using chlorophyll','Plants release energy from glucose without oxygen','Plants convert proteins into light energy'],answer:0},'Photosynthesis uses carbon dioxide and water as raw materials and energy from light to synthesise carbohydrates.');
add('c6-photosynthesis','fill','The green pigment that absorbs light energy for photosynthesis is _____.',{answer:['chlorophyll']},'Chlorophyll is located in chloroplasts and absorbs light energy.');
add('c6-photosynthesis','multi','Which are directly involved in the photosynthesis equation?',{options:['Carbon dioxide','Water','Glucose','Oxygen','Urea'],answer:[0,1,2,3]},'Carbon dioxide and water are reactants; glucose and oxygen are products.');
add('c6-photosynthesis','match','Match each item to its role in photosynthesis.',{pairs:[['Carbon dioxide','Raw material'],['Water','Raw material'],['Glucose','Carbohydrate product'],['Oxygen','Gas product']]},'Carbon dioxide and water are used to produce glucose and oxygen.');
add('c6-photosynthesis','matrix','Check these statements about photosynthesis.',{rows:[['Chlorophyll absorbs light energy.',true],['Carbon dioxide is a product of photosynthesis.',false],['Water is a raw material for photosynthesis.',true],['Photosynthesis transfers light energy into chemical energy in carbohydrate.',true]]},'Chlorophyll captures light energy; carbon dioxide and water are the raw materials.');
add('c6-photosynthesis','fill','In the balanced equation 6CO₂ + 6H₂O → C₆H₁₂O₆ + _____O₂, the missing coefficient is _____.',{answer:['6','six']},'The balanced equation produces six oxygen molecules for each glucose molecule represented.');
add('c6-photosynthesis','order','Arrange these ideas into a logical photosynthesis sequence.',{items:['Glucose and oxygen are produced','Chlorophyll absorbs light energy','Carbon dioxide and water are available as raw materials'],answer:['Chlorophyll absorbs light energy','Carbon dioxide and water are available as raw materials','Glucose and oxygen are produced']},'Light energy absorbed by chlorophyll drives the synthesis of carbohydrate from carbon dioxide and water.');
add('c6-photosynthesis','written','Describe the process of photosynthesis using precise biological terms.',{rubric:['Light energy is absorbed by chlorophyll in chloroplasts.','Carbon dioxide and water are the raw materials.','Light energy is transferred into chemical energy.','Glucose or carbohydrate is produced.','Oxygen is produced.','A correct balanced equation may be included: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂.']},'A strong answer connects light absorption, raw materials and products rather than only quoting an equation.');

add('c6-glucose','match','Match each fate of photosynthetic glucose to its use.',{pairs:[['Respiration','Release energy'],['Starch','Insoluble storage'],['Cellulose','Build cell walls'],['Sucrose','Transport in phloem']]},'Glucose is converted into different substances depending on the plant need.');
add('c6-glucose','mcq','Why is starch well suited to carbohydrate storage in plant cells?',{options:['It is insoluble and therefore has little effect on water potential','It is a gas that diffuses away','It is always transported in xylem','It contains magnesium'],answer:0},'Starch is insoluble, making it suitable for storage without strongly changing cell water potential.');
add('c6-glucose','multi','Which are listed uses or fates of glucose produced by photosynthesis?',{options:['Respiration','Starch storage','Cellulose synthesis','Sucrose transport','Making amino acids with nitrate ions','Producing urea for excretion'],answer:[0,1,2,3,4]},'The guide lists respiration, storage as starch, cellulose, sucrose and amino-acid/protein synthesis among the fates of glucose.');
add('c6-glucose','fill','The sugar commonly transported through phloem is _____.',{answer:['sucrose']},'Glucose can be converted to sucrose for transport in phloem.');
add('c6-glucose','matrix','Evaluate these statements about products of photosynthesis.',{rows:[['Glucose can be used in respiration.',true],['Starch is the main sugar transported in phloem.',false],['Cellulose can be made from glucose.',true],['Nitrate ions are needed to make amino acids and proteins.',true]]},'Sucrose, not starch, is the principal transport sugar named in the guide.');
add('c6-glucose','order','Arrange the sequence for using photosynthetic products to make protein.',{items:['Proteins are built','Amino acids are made','Nitrate ions are combined with carbohydrate products'],answer:['Nitrate ions are combined with carbohydrate products','Amino acids are made','Proteins are built']},'Plants need nitrate ions to make amino acids, which are then assembled into proteins.');
add('c6-glucose','mcq','Why might a flower convert some photosynthetic product into nectar?',{options:['To attract insect pollinators','To block stomata permanently','To remove all chlorophyll','To transport water in xylem'],answer:0},'The supplied guide lists nectar production as a use of photosynthetic carbohydrate in flowers.');
add('c6-glucose','written','Explain several different ways a plant can use glucose made in photosynthesis.',{rubric:['Use in respiration to release energy.','Convert to insoluble starch for storage.','Make cellulose for cell walls.','Convert to sucrose for phloem transport.','Combine carbohydrate products with nitrate ions to make amino acids and proteins.','Use in nectar production; glucose products also contribute to other plant compounds.']},'Name the product and its function for each fate of glucose.');

add('c6-minerals','mcq','Which mineral ion is required for the synthesis of amino acids and proteins?',{options:['Nitrate ions','Magnesium ions only','Sodium ions','Chloride ions'],answer:0},'Nitrate ions supply nitrogen for amino-acid and protein synthesis.');
add('c6-minerals','fill','Magnesium ions are required for the synthesis of _____.',{answer:['chlorophyll']},'Magnesium is a key mineral requirement for chlorophyll synthesis.');
add('c6-minerals','match','Match each mineral condition to the correct description.',{pairs:[['Nitrate ions','Needed for amino acids and proteins'],['Magnesium ions','Needed for chlorophyll'],['Nitrate deficiency','Poor or stunted growth'],['Magnesium deficiency','Chlorosis between leaf veins']]},'Nitrate and magnesium have different biochemical roles and deficiency patterns.');
add('c6-minerals','matrix','Check these mineral-nutrition statements.',{rows:[['Nitrate deficiency can reduce plant growth.',true],['Magnesium is needed to make chlorophyll.',true],['Magnesium deficiency always increases chlorophyll content.',false],['Nitrate ions are used to make amino acids.',true]]},'A lack of magnesium reduces chlorophyll production and can cause chlorosis.');
add('c6-minerals','multi','Which observations are consistent with mineral deficiency in the supplied guide?',{options:['Stunted growth with nitrate deficiency','Yellowing of older leaves with nitrate deficiency','Yellowing between veins with magnesium deficiency','Extra chlorophyll with magnesium deficiency'],answer:[0,1,2]},'Nitrate deficiency affects growth and can yellow older leaves; magnesium deficiency produces chlorosis.');
add('c6-minerals','mcq','A plant develops yellowing between the veins of older leaves. Which deficiency is most directly suggested?',{options:['Magnesium deficiency','Excess nitrate only','Extra carbon dioxide','High light intensity'],answer:0},'Yellowing between veins is the chlorosis pattern associated with magnesium deficiency in the guide.');
add('c6-minerals','order','Arrange the nitrate-to-growth pathway.',{items:['Proteins support growth','Nitrate ions are absorbed','Amino acids are synthesised'],answer:['Nitrate ions are absorbed','Amino acids are synthesised','Proteins support growth']},'Nitrate ions provide nitrogen for amino acids, which form proteins required for growth.');
add('c6-minerals','written','Compare the roles of nitrate ions and magnesium ions in plants and describe one deficiency symptom for each.',{rubric:['Nitrate ions are needed to make amino acids and proteins.','Nitrate deficiency causes poor or stunted growth and may yellow older leaves.','Magnesium ions are needed to make chlorophyll.','Magnesium deficiency causes chlorosis or yellowing between leaf veins.']},'Keep the role and deficiency symptom of each mineral clearly paired.');

add('c6-leaf','mcq','Which tissue contains the highest density of chloroplasts in a typical leaf?',{options:['Palisade mesophyll','Lower epidermis','Xylem vessel','Waxy cuticle'],answer:0},'Palisade cells near the upper surface are tightly packed and contain many chloroplasts.');
add('c6-leaf','match','Match each leaf structure to its main function.',{pairs:[['Waxy cuticle','Reduces water loss'],['Palisade mesophyll','Absorbs much of the light'],['Spongy mesophyll','Provides air spaces for gas diffusion'],['Stomata','Allow gas exchange']]},'Each structure contributes to photosynthesis or water conservation in a specific way.');
add('c6-leaf','multi','Which leaf features increase photosynthetic efficiency?',{options:['Large surface area','Thin structure','Many chloroplasts in palisade cells','Large air spaces in spongy mesophyll','Completely opaque upper epidermis'],answer:[0,1,2,3]},'Large area, short diffusion distance, many chloroplasts and air spaces all support photosynthesis.');
add('c6-leaf','matrix','Evaluate these leaf-structure statements.',{rows:[['The upper epidermis is transparent enough to let light reach mesophyll.',true],['Stomata allow carbon dioxide to enter the leaf.',true],['Guard cells regulate stomatal opening.',true],['Spongy mesophyll is tightly packed with no air spaces.',false]]},'Spongy mesophyll is loosely packed and contains interconnecting air spaces.');
add('c6-leaf','fill','The vascular tissue that brings water and mineral ions to the leaf is _____.',{answer:['xylem']},'Xylem transports water and mineral ions from roots to leaves.');
add('c6-leaf','order','Arrange these leaf layers from upper surface towards the lower surface.',{items:['Spongy mesophyll','Upper epidermis','Lower epidermis','Palisade mesophyll'],answer:['Upper epidermis','Palisade mesophyll','Spongy mesophyll','Lower epidermis']},'This is the main top-to-bottom sequence listed in the guide, beneath the waxy cuticle.');
add('c6-leaf','mcq','Which vascular tissue transports sucrose and amino acids away from a photosynthesising leaf?',{options:['Phloem','Xylem','Cuticle','Guard cells'],answer:0},'Phloem transports sucrose and amino acids from sources such as photosynthesising leaves to sinks.');
add('c6-leaf','written','Explain how the internal structure of a leaf is adapted for photosynthesis.',{rubric:['Palisade mesophyll is near the upper surface and contains many chloroplasts.','Palisade cells are columnar and closely packed for light absorption.','Spongy mesophyll contains large air spaces for rapid gas diffusion.','Stomata allow carbon dioxide to enter and guard cells regulate opening.','Xylem delivers water to leaf cells.','Phloem transports sucrose or amino acids away.','The transparent upper epidermis and cuticle allow light to reach mesophyll.']},'Link each structural feature to the process it helps.');

add('c6-limiting','mcq','What is a limiting factor?',{options:['A factor in such short supply that it restricts the rate of a process','Any factor that is present in excess','A product that always stops photosynthesis','A pigment that absorbs only green light'],answer:0},'A limiting factor restricts rate because it is in short supply relative to what the process requires.');
add('c6-limiting','match','Match each factor to its effect on photosynthesis when increased from a low level.',{pairs:[['Light intensity','Rate can rise until another factor limits'],['Carbon dioxide concentration','Rate can rise until another factor limits'],['Temperature below optimum','Rate rises as enzyme reactions speed up'],['Temperature above optimum','Rate can fall as enzymes denature']]},'Light, carbon dioxide and temperature can all limit photosynthesis under different conditions.');
add('c6-limiting','matrix','Interpret these limiting-factor statements.',{rows:[['On a rising light-intensity graph, light can be the limiting factor.',true],['On a plateau, the x-axis factor must still be the only limiting factor.',false],['At very high temperature, photosynthetic enzymes can denature.',true],['Increasing carbon dioxide always raises rate without any upper limit.',false]]},'A plateau means some other factor has become limiting.');
add('c6-limiting','fill','When a photosynthesis graph becomes horizontal even though the x-axis factor keeps increasing, another factor has become _____.',{answer:['limiting','a limiting factor']},'A plateau indicates that increasing the x-axis factor no longer raises the rate because something else limits it.');
add('c6-limiting','mcq','Why can the rate of photosynthesis fall sharply above the optimum temperature?',{options:['Enzymes denature and their active sites change shape','Chlorophyll becomes nitrate','Carbon dioxide becomes glucose without enzymes','Water can no longer exist in cells at any temperature'],answer:0},'Photosynthesis depends on enzymes; high temperature can denature them.');
add('c6-limiting','multi','Which interventions are listed as ways commercial growers can increase photosynthesis in a greenhouse?',{options:['Artificial lighting','Increasing carbon dioxide supply','Thermostatically controlled heating','Removing all water'],answer:[0,1,2]},'Growers can manipulate light, carbon dioxide and temperature.');
add('c6-limiting','order','Arrange the temperature effect from low temperature to excessive heat.',{items:['Enzymes denature and rate falls','Molecules have low kinetic energy and reactions are slow','Rate reaches an optimum','More frequent successful collisions increase rate'],answer:['Molecules have low kinetic energy and reactions are slow','More frequent successful collisions increase rate','Rate reaches an optimum','Enzymes denature and rate falls']},'Temperature first increases collision frequency, then excessive heat alters enzyme structure.');
add('c6-limiting','written','Explain how light intensity, carbon dioxide concentration and temperature can limit the rate of photosynthesis.',{rubric:['At low light intensity, increasing light can increase rate until another factor becomes limiting.','At low carbon dioxide concentration, increasing carbon dioxide can increase rate until another factor becomes limiting.','Temperature increases rate towards an optimum because enzyme-controlled reactions speed up.','Above the optimum, enzymes denature and rate decreases.','A plateau on a graph indicates that a different factor has become limiting.']},'Explain both the rising part of a graph and why it reaches a plateau or falls.');

add('c6-practical','mcq','Why is a plant destarched before testing a factor required for photosynthesis?',{options:['So any starch detected later was made during the investigation','To permanently remove chlorophyll','To stop respiration forever','To add carbon dioxide to the leaves'],answer:0},'Keeping a plant in darkness for 24–48 hours uses previously stored starch, so new starch can be attributed to the investigation.');
add('c6-practical','order','Put the leaf starch test in the correct sequence.',{items:['Add iodine solution on a white tile','Boil the leaf briefly in water','Heat the leaf in ethanol using a hot-water bath','Dip the leaf back into hot water to soften it'],answer:['Boil the leaf briefly in water','Heat the leaf in ethanol using a hot-water bath','Dip the leaf back into hot water to soften it','Add iodine solution on a white tile']},'The ethanol step removes chlorophyll and must be heated safely in a hot-water bath.');
add('c6-practical','multi','Which statements are important for safely and correctly removing chlorophyll from a leaf?',{options:['Use ethanol','Heat ethanol in a hot-water bath','Keep ethanol away from a naked flame','Heat ethanol directly over a Bunsen burner'],answer:[0,1,2]},'Ethanol is highly flammable, so it must not be heated directly over a flame.');
add('c6-practical','match','Match each photosynthesis requirement investigation to the key treatment.',{pairs:[['Light requirement','Cover part of a destarched leaf with opaque material'],['Chlorophyll requirement','Use a variegated leaf'],['Carbon dioxide requirement','Use potassium hydroxide or soda lime to absorb CO₂'],['Starch detection','Add iodine after decolourising the leaf']]},'These treatments isolate light, chlorophyll and carbon dioxide as variables.');
add('c6-practical','matrix','Check these pondweed-investigation statements.',{rows:[['Sodium hydrogencarbonate can provide dissolved carbon dioxide.',true],['Lamp distance can be changed to alter light intensity.',true],['Temperature should be allowed to vary freely with lamp heating.',false],['Collecting oxygen volume is more precise than counting bubbles.',true]]},'Temperature should be controlled because it also affects photosynthesis rate.');
add('c6-practical','fill','A solution of sodium _____ can be used to provide dissolved carbon dioxide for an aquatic-plant photosynthesis experiment.',{answer:['hydrogencarbonate','hydrogen carbonate','bicarbonate']},'Sodium hydrogencarbonate is used as a source of dissolved carbon dioxide.');
add('c6-practical','mcq','Why is measuring oxygen volume usually more accurate than counting bubbles from pondweed?',{options:['Bubble sizes vary, whereas gas volume is a quantitative measurement','Oxygen cannot form bubbles','A gas syringe changes the light intensity','Counting bubbles measures carbon dioxide only'],answer:0},'Bubble volume varies and rapid bubbles can be difficult to count; collected gas volume is more objective.');
add('c6-practical','written','Design an investigation to determine how light intensity affects the rate of photosynthesis in pondweed.',{rubric:['Use the same piece or length of aquatic plant in water containing a fixed concentration of sodium hydrogencarbonate.','Place a lamp at measured distances to change light intensity.','Measure oxygen production over a fixed time, preferably as gas volume using a gas syringe or inverted measuring cylinder.','Control temperature using a heat shield, water tank or suitable lamp and keep carbon dioxide concentration constant.','Repeat measurements and calculate or compare mean rates.']},'State the independent variable, how rate is measured, and the variables that must be controlled.');



const C7TOPICS=[
 {id:'c7-diet',chapter:7,name:'Build a balanced diet',short:'Balanced diet & nutrients',icon:'01',desc:'Use nutrient functions, sources and deficiency diseases to explain human nutrition.',notes:[['Balanced diet','A balanced diet provides all essential nutrients — carbohydrates, fats, proteins, vitamins, minerals, fibre and water — in the correct proportions and quantities for energy and growth needs.'],['Carbohydrates, fats and proteins','Carbohydrates are the main source of energy for respiration. Fats provide long-term energy storage, insulation, protection and help make cell membranes. Proteins are needed for growth, tissue repair and to make enzymes, antibodies, haemoglobin and some hormones.'],['Vitamin C and vitamin D','Vitamin C is needed for collagen synthesis, healthy skin, blood vessels, gums and bones; deficiency causes scurvy. Vitamin D helps calcium absorption for strong bones and teeth; deficiency causes rickets.'],['Calcium and iron','Calcium is important for bone and tooth strength, blood clotting and muscle contraction. Iron is needed to make haemoglobin in red blood cells; deficiency causes anaemia.'],['Fibre and water','Dietary fibre provides bulk for peristalsis and helps prevent constipation. Water acts as a solvent, helps regulate temperature, transports substances in plasma and helps excrete urea.']]} ,
 {id:'c7-energy',chapter:7,name:'Match diet to need',short:'Energy needs & malnutrition',icon:'02',desc:'Explain why diet changes with lifestyle and identify forms of malnutrition.',notes:[['Energy requirements vary','Energy needs depend on age, sex, activity level and whether a person is pregnant or lactating. Children need more energy per kilogram for growth, and manual workers usually need more than office workers.'],['Pregnancy and lactation','Pregnant women need extra energy, protein, calcium and iron to support the developing fetus and later milk production.'],['Overnutrition','Obesity results from regularly taking in more energy than is used. It raises the risk of type 2 diabetes, high blood pressure, osteoarthritis and coronary heart disease.'],['Undernutrition','Starvation causes loss of fat and muscle. Marasmus is severe deficiency of both protein and total energy intake, while kwashiorkor is severe protein deficiency, often after weaning onto a starchy diet.'],['Fibre and heart disease','Low fibre intake can lead to constipation. Excess saturated fat and cholesterol can contribute to coronary heart disease by promoting fatty plaque formation in coronary arteries.']]} ,
 {id:'c7-canal',chapter:7,name:'Follow the food pathway',short:'Alimentary canal & peristalsis',icon:'03',desc:'Trace food through the body and separate ingestion, digestion, absorption, assimilation and egestion.',notes:[['Five stages of processing','Ingestion is taking food into the body. Digestion breaks large insoluble molecules into small soluble molecules. Absorption moves digested molecules through the intestine wall into blood or lymph. Assimilation is the use of absorbed nutrients by body cells. Egestion removes undigested food as faeces.'],['Alimentary canal pathway','Food passes through the mouth, oesophagus, stomach, duodenum, ileum, colon, rectum and anus. Associated glands include the salivary glands, liver, gallbladder and pancreas.'],['Peristalsis','Peristalsis is a wave of muscular contraction and relaxation that pushes food along the alimentary canal.'],['Muscles involved','Circular muscles contract behind the food while longitudinal muscles help move it forward along the gut.'],['Mucus','Mucus lubricates food and protects the lining of the alimentary canal. It is secreted by goblet cells.'],['Egestion is not excretion','Faeces are undigested food, not metabolic waste from cells. Excretion removes substances such as carbon dioxide, urea and excess water.']]} ,
 {id:'c7-teeth',chapter:7,name:'Break food down physically',short:'Teeth & mechanical digestion',icon:'04',desc:'Connect tooth structure, tooth function and the steps leading to dental caries.',notes:[['Mechanical digestion','Mechanical digestion breaks large pieces of food into smaller pieces without changing chemical structure. It increases the surface area for enzyme action.'],['Types of teeth','Incisors bite and cut. Canines tear. Premolars crush and grind. Molars carry out heavy crushing and grinding.'],['Tooth structure','Enamel is the hard, non-living outer layer. Dentine lies beneath and is living tissue. The pulp cavity contains nerves and blood capillaries. Cement helps anchor the root to the jaw.'],['Dental caries','Sugar-rich food can remain on teeth. Bacteria feed on it and form plaque. The bacteria respire and produce acid, which dissolves enamel and dentine. If decay reaches the pulp, toothache or an abscess may develop.'],['Prevention','Brush teeth regularly with fluoride toothpaste, reduce sugary food intake and visit the dentist.']]} ,
 {id:'c7-enzymes',chapter:7,name:'Digest it chemically',short:'Digestive enzymes, HCl & bile',icon:'05',desc:'Use enzyme-substrate ideas to explain digestion in the stomach and small intestine.',notes:[['Amylase and maltase','Amylase digests starch to maltose. Maltase digests maltose to glucose. Salivary amylase works in the mouth; pancreatic amylase works in the duodenum; maltase acts on the ileum membrane.'],['Proteases and lipase','Proteases digest proteins into peptides and amino acids. Pepsin works in the stomach at low pH. Trypsin from the pancreas works in the duodenum at alkaline pH. Lipase digests fats and oils into fatty acids and glycerol in the duodenum.'],['Hydrochloric acid','Hydrochloric acid in the stomach kills many microorganisms and provides the acidic conditions needed for pepsin to work efficiently.'],['Bile','Bile is produced in the liver, stored in the gallbladder and released into the duodenum. It neutralises acidic chyme and emulsifies fats into tiny droplets.'],['Emulsification','Bile does not chemically digest fat. It breaks large fat globules into smaller droplets, increasing the surface area for lipase action.']]} ,
 {id:'c7-absorb',chapter:7,name:'Absorb and assimilate',short:'Villi, absorption & assimilation',icon:'06',desc:'Explain why the ileum is efficient and what the liver does with absorbed nutrients.',notes:[['Ileum as absorption surface','Most digested nutrients and much water are absorbed in the small intestine, especially the ileum.'],['Villi and microvilli','The ileum has many folds with villi, and the epithelial cells of the villi have microvilli. This produces a very large surface area.'],['Short diffusion distance','The epithelial wall is only one cell thick, so absorbed substances move through a short pathway into the blood or lacteal.'],['Capillaries and lacteal','A dense capillary network carries away glucose, amino acids, water and mineral ions, helping maintain concentration gradients. Each villus also has a lacteal that absorbs fatty acids and glycerol.'],['Many mitochondria','Epithelial cells contain many mitochondria to provide ATP for active transport.'],['Hepatic portal vein and liver','Glucose, amino acids and other absorbed solutes enter blood capillaries and are carried to the liver in the hepatic portal vein. The liver stores excess glucose as glycogen, makes plasma proteins from amino acids and deaminates excess amino acids to form urea.'],['Water absorption','Most water is absorbed in the small intestine. The colon absorbs most of the remaining water to help form solid faeces.']]}
];
TOPICS.push(...C7TOPICS);

// Chapter 7 · 48 activities (42 objective + 6 written reflection tasks)
add('c7-diet','mcq','Which statement best defines a balanced diet?',{options:['A diet containing only plant food','A diet that provides all essential nutrients in the correct proportions and quantities','A diet with no fats','A diet that gives the same amount of each nutrient'],answer:1},'A balanced diet includes all essential nutrients, but not in equal amounts. The proportions must meet the body’s needs.');
add('c7-diet','fill','The nutrient group that is the primary source of energy for respiration is _____.',{answer:['carbohydrates','carbohydrate']},'Carbohydrates are the main energy source named in the guide.');
add('c7-diet','multi','Which functions are correctly linked to fats / lipids?',{options:['Long-term energy storage','Thermal insulation','Protection of vital organs','Making cell membranes','Forming starch granules'],answer:[0,1,2,3]},'Fats store energy, insulate, protect and help form cell membranes. They do not make starch granules.');
add('c7-diet','match','Match each nutrient or mineral to its main role.',{pairs:[['Protein','Growth and tissue repair'],['Vitamin C','Collagen synthesis and healthy gums'],['Calcium','Strong bones and teeth'],['Iron','Making haemoglobin']]},'Keep the nutrient role precise. Iron is linked to haemoglobin, not bone strength.');
add('c7-diet','matrix','Evaluate the nutrition statements.',{rows:[['Vitamin D helps calcium absorption in the small intestine.',true],['Scurvy is caused by a lack of vitamin C.',true],['Iron deficiency can cause anaemia.',true],['Dietary fibre is fully digested to release energy.',false]]},'Fibre is mainly cellulose from plant cell walls and is not digested by human enzymes.');
add('c7-diet','mcq','What is the main role of dietary fibre in the human diet?',{options:['To supply vitamin D','To provide bulk for peristalsis and help prevent constipation','To digest starch in the ileum','To make haemoglobin'],answer:1},'Fibre helps movement of food and faeces through the gut.');
add('c7-diet','mcq','Which answer describes one important role of water in the body?',{options:['It is the main source of amino acids','It is a solvent and transport medium in blood plasma','It digests cellulose','It stores glycogen in the liver'],answer:1},'Water acts as a solvent, helps transport substances, regulates temperature and helps excrete urea.');
add('c7-diet','written','Explain the functions of vitamin C, vitamin D and iron, and name the deficiency disease caused by a shortage of each.',{rubric:['Vitamin C is needed for collagen synthesis / healthy skin, blood vessels, gums and bones; deficiency causes scurvy.','Vitamin D helps absorption of calcium for strong bones and teeth; deficiency causes rickets.','Iron is needed to make haemoglobin in red blood cells; deficiency causes anaemia.']},'Use nutrient names, functions and diseases together rather than listing isolated words.');

add('c7-energy','mcq','Which person would usually need the greatest daily energy intake?',{options:['A sleeping infant','An office worker sitting all day','A manual labourer performing heavy work','A person fasting for religious reasons'],answer:2},'Manual workers typically need more energy because their activity level is higher.');
add('c7-energy','fill','Kwashiorkor is mainly caused by severe _____ deficiency.',{answer:['protein']},'Kwashiorkor is a protein-energy malnutrition state caused primarily by lack of protein.');
add('c7-energy','multi','Which factors can affect a person’s energy requirements?',{options:['Age','Sex','Activity level','Pregnancy or lactation','Eye colour'],answer:[0,1,2,3]},'Energy needs depend on biological and lifestyle factors, not eye colour.');
add('c7-energy','match','Match each nutritional problem to its description.',{pairs:[['Constipation','Slow movement of faeces due to low fibre intake'],['Coronary heart disease','Fatty plaques block coronary arteries'],['Marasmus','Severe deficiency of protein and energy'],['Obesity','Excess energy stored as adipose tissue']]},'Match the condition to its core cause or description.');
add('c7-energy','matrix','Decide whether each statement about malnutrition is true or false.',{rows:[['Children often need more energy per kilogram of body mass because they are growing.',true],['Kwashiorkor typically gives a swollen abdomen.',true],['Marasmus is caused only by lack of fibre.',false],['Pregnant women may need extra protein, calcium and iron.',true]]},'Kwashiorkor and marasmus are both forms of protein-energy malnutrition, not fibre deficiency.');
add('c7-energy','mcq','Which feature is more typical of marasmus than kwashiorkor?',{options:['Swollen abdomen caused by oedema','Extreme wasting and emaciation','Bleeding gums','Bow-leggedness'],answer:1},'Marasmus causes severe wasting because both total energy and protein intake are very low.');
add('c7-energy','mcq','Why can obesity increase the risk of coronary heart disease?',{options:['It always causes anaemia','Excess body fat is linked with higher blood pressure and greater CHD risk','It prevents calcium absorption','It stops peristalsis completely'],answer:1},'Obesity is associated with several health risks, including coronary heart disease.');
add('c7-energy','written','Explain why the diet of a pregnant manual worker would usually need more energy and key nutrients than the diet of a sedentary adult.',{rubric:['Manual work raises energy requirements because more respiration is needed.','Pregnancy increases needs for growth of the fetus and later milk production.','Extra protein is needed for growth and repair.','Extra calcium and iron are important for fetal development / bones and haemoglobin production.']},'Tie the explanation to activity level and pregnancy, not just one of them.');

add('c7-canal','mcq','Which stage of food processing means taking food into the body through the mouth?',{options:['Digestion','Absorption','Ingestion','Assimilation'],answer:2},'Ingestion is the intake of food and drink.');
add('c7-canal','fill','After the stomach, food enters the first part of the small intestine called the _____.',{answer:['duodenum']},'The duodenum comes immediately after the stomach.');
add('c7-canal','multi','Which organs or glands are associated with the human alimentary canal?',{options:['Salivary glands','Liver','Gallbladder','Pancreas','Kidney'],answer:[0,1,2,3]},'The kidney is part of the excretory system, not an associated digestive gland.');
add('c7-canal','match','Match each food-processing stage to its description.',{pairs:[['Digestion','Breakdown of large insoluble molecules into small soluble molecules'],['Absorption','Movement of small soluble molecules through the gut wall into blood or lymph'],['Assimilation','Use of absorbed molecules by body cells'],['Egestion','Removal of undigested food as faeces']]},'Absorption is movement into blood or lymph; assimilation is use by cells.');
add('c7-canal','matrix','Evaluate these statements about the alimentary canal.',{rows:[['Egestion is the same as excretion.',false],['Peristalsis pushes food along the gut.',true],['Mucus helps lubricate food.',true],['Goblet cells secrete mucus.',true]]},'Egestion removes undigested food; excretion removes metabolic waste from cells.');
add('c7-canal','order','Place these parts of the alimentary canal in the order food passes through them.',{items:['Ileum','Mouth','Colon','Oesophagus','Stomach'],answer:['Mouth','Oesophagus','Stomach','Ileum','Colon']},'Food goes mouth → oesophagus → stomach → small intestine (including ileum) → colon.');
add('c7-canal','mcq','What is one main role of mucus in the alimentary canal?',{options:['To digest proteins into amino acids','To lubricate food and protect the lining','To store bile','To transport oxygen'],answer:1},'Mucus helps food move more easily and protects tissues from abrasion, acid and enzymes.');
add('c7-canal','written','Describe how peristalsis moves food through the alimentary canal and explain how mucus helps this process.',{rubric:['Peristalsis is a wave of muscular contraction and relaxation along the gut wall.','Circular muscles contract behind the food / bolus and push it forward.','Longitudinal muscles help move the food along.','Mucus lubricates the food and protects the lining of the canal.']},'Mention movement by muscles and the support role of mucus.');

add('c7-teeth','mcq','Why is mechanical digestion important?',{options:['It changes starch into maltose','It increases the surface area available for enzyme action','It makes bile alkaline','It stores excess glucose as glycogen'],answer:1},'Breaking food into smaller pieces gives digestive enzymes a larger surface area to act on.');
add('c7-teeth','fill','The pointed teeth used for tearing food are called _____.',{answer:['canines','canine']},'Canines are pointed teeth adapted for tearing and ripping.');
add('c7-teeth','multi','Which tooth types are correctly linked to their functions?',{options:['Incisors — biting and cutting','Canines — tearing','Premolars — crushing and grinding','Molars — heavy crushing and grinding'],answer:[0,1,2,3]},'Each tooth type has a characteristic shape related to its job.');
add('c7-teeth','match','Match each tooth structure to its description.',{pairs:[['Enamel','Hard, non-living outer layer'],['Dentine','Living tissue under the enamel'],['Pulp cavity','Contains nerves and blood capillaries'],['Cement','Anchors the root to the jawbone']]},'Use the structural names accurately.');
add('c7-teeth','matrix','Check the statements about dental caries.',{rows:[['Bacteria can form plaque on the tooth surface.',true],['Bacteria use sugar and may produce acid.',true],['Acid can dissolve enamel and dentine.',true],['Tooth decay is prevented by eating more sugar frequently.',false]]},'Sugar encourages bacterial activity and acid production, so frequent sugary snacks increase the risk of caries.');
add('c7-teeth','mcq','Which action best helps prevent dental caries?',{options:['Reducing sugary food intake and brushing with fluoride toothpaste','Avoiding all protein foods','Drinking less water','Increasing plaque build-up'],answer:0},'Good oral hygiene and less sugar are key preventive measures.');
add('c7-teeth','mcq','Which structure would most likely cause pain if bacteria reached it during tooth decay?',{options:['Enamel','Pulp cavity','Cement','Plaque'],answer:1},'The pulp cavity contains nerves and blood capillaries.');
add('c7-teeth','written','Describe how dental caries develops from sugary food on the teeth to toothache, and give two ways to reduce the risk.',{rubric:['Sugar-containing food may remain on the teeth.','Bacteria feed on the sugar and form plaque.','The bacteria produce acid that dissolves enamel and then dentine.','If decay reaches the pulp cavity it irritates nerves and causes pain / toothache.','Prevention includes brushing with fluoride toothpaste, reducing sugar intake and visiting the dentist.']},'Show the sequence clearly from sugar to plaque to acid to damage.');

add('c7-enzymes','mcq','What is the product of amylase acting on starch?',{options:['Glucose','Maltose','Amino acids','Fatty acids'],answer:1},'Amylase digests starch into maltose. Maltase then converts maltose into glucose.');
add('c7-enzymes','fill','Lipase digests fats and oils into fatty acids and _____.',{answer:['glycerol']},'Lipase breaks lipid molecules into fatty acids and glycerol.');
add('c7-enzymes','multi','Which statements about digestive enzymes are correct?',{options:['Salivary amylase works in the mouth','Pepsin works in the stomach','Trypsin is secreted by the pancreas','Maltase acts on the ileum membrane','Lipase changes glucose into glycogen'],answer:[0,1,2,3]},'Lipase digests fats; it does not convert glucose into glycogen.');
add('c7-enzymes','match','Match each secretion source to the enzyme it releases.',{pairs:[['Salivary glands','Amylase'],['Stomach wall','Pepsin'],['Pancreas','Trypsin and lipase'],['Small-intestine epithelial cells','Maltase']]},'Remember that bile is not an enzyme.');
add('c7-enzymes','matrix','Decide whether each statement about HCl and bile is true or false.',{rows:[['Hydrochloric acid helps provide the low pH needed by pepsin.',true],['Bile is produced in the liver and stored in the gallbladder.',true],['Bile chemically digests fat into fatty acids.',false],['Bile helps neutralise acidic chyme in the duodenum.',true]]},'Bile emulsifies fat but does not digest it chemically.');
add('c7-enzymes','mcq','Why is bile important in the digestion of fats?',{options:['It provides glucose for respiration','It emulsifies fats and provides alkaline conditions for lipase','It digests protein into peptides','It stores enzymes in the mouth'],answer:1},'Bile increases the surface area of fat and helps create the optimum pH for pancreatic enzymes.');
add('c7-enzymes','order','Put these stages of starch digestion into the correct order.',{items:['Maltase forms glucose','Starch is present in food','Amylase forms maltose','Glucose can then be absorbed'],answer:['Starch is present in food','Amylase forms maltose','Maltase forms glucose','Glucose can then be absorbed']},'Amylase acts first on starch. Maltase acts later on maltose.');
add('c7-enzymes','written','Explain why bile is important in the duodenum during fat digestion.',{rubric:['Bile is alkaline / contains sodium hydrogencarbonate.','It neutralises acidic chyme arriving from the stomach.','This provides a suitable alkaline pH for lipase / pancreatic enzymes.','Bile emulsifies fats into small droplets.','This increases the surface area for lipase action so fats are digested faster into fatty acids and glycerol.']},'Include both main roles: neutralisation and emulsification.');

add('c7-absorb','mcq','Where does most absorption of digested food take place?',{options:['Stomach','Ileum','Rectum','Oesophagus'],answer:1},'The ileum has specialised adaptations for absorption.');
add('c7-absorb','fill','The epithelial wall of a villus is only _____ cell thick.',{answer:['one','1']},'A one-cell-thick wall gives a short diffusion distance.');
add('c7-absorb','multi','Which features help the ileum absorb digested food efficiently?',{options:['Many villi and microvilli','Thin epithelial wall','Dense capillary network','Many mitochondria in epithelial cells','Very thick muscle layer for photosynthesis'],answer:[0,1,2,3]},'The ileum is not a photosynthetic structure.');
add('c7-absorb','match','Match each absorbed substance or process to the correct route or fate.',{pairs:[['Fatty acids and glycerol','Enter the lacteal'],['Glucose','Enter blood capillaries and travel to the liver'],['Excess glucose in the liver','Stored as glycogen'],['Excess amino acids','Deaminated to form urea']]},'Capillaries absorb glucose and amino acids; lacteals absorb lipid digestion products.');
add('c7-absorb','matrix','Evaluate the absorption and assimilation statements.',{rows:[['The hepatic portal vein carries absorbed nutrients from the ileum to the liver.',true],['Most remaining water is absorbed in the colon.',true],['Assimilation means using absorbed molecules in cells.',true],['Lacteals mainly absorb starch molecules.',false]]},'Lacteals absorb fatty acids and glycerol, not starch.');
add('c7-absorb','mcq','What is the main role of the hepatic portal vein?',{options:['To carry oxygen from the lungs to the liver','To transport absorbed nutrients from the small intestine to the liver','To carry urine to the bladder','To move bile into the stomach'],answer:1},'The hepatic portal vein links the small intestine and the liver.');
add('c7-absorb','mcq','What is produced when the liver deaminates excess amino acids?',{options:['Starch','Urea','Cellulose','Bile salts'],answer:1},'The nitrogenous part is removed and eventually forms urea.');
add('c7-absorb','written','Explain how the structure of the ileum and villi helps absorption, and describe two roles of the liver in assimilation.',{rubric:['Large surface area due to long intestine / folds / villi / microvilli.','Wall is one cell thick, giving a short diffusion distance.','Dense capillary network removes absorbed solutes and maintains concentration gradients.','Lacteals absorb fatty acids and glycerol.','Many mitochondria provide ATP for active transport.','The liver stores excess glucose as glycogen and uses amino acids to make proteins / deaminates excess amino acids to form urea.']},'A strong answer links each structural feature to how it improves absorption and then names clear liver roles.');

 {id:'c8-xylem',chapter:8,name:'Engineer the xylem',short:'Xylem structure & function',icon:'01',desc:'Connect dead hollow vessels, lignin and pits to transport and support.',notes:[['Xylem function','Xylem transports water and dissolved mineral ions from roots to leaves in one direction and also provides mechanical support.'],['Dead hollow vessels','Xylem vessels are made from dead cells joined end-to-end. Their cytoplasm, nuclei and organelles are lost, leaving an empty lumen for unobstructed water flow.'],['No end walls','Cross-walls break down so many cells form a continuous tube from roots to leaves.'],['Lignin','Lignin strengthens and waterproofs the walls. It prevents collapse under the negative pressure created by transpiration pull and helps support the plant.'],['Pits','Unlignified pits in side walls allow lateral movement of water between adjacent xylem vessels and surrounding tissues.']]},
 {id:'c8-phloem',chapter:8,name:'Map the vascular bundles',short:'Phloem & bundle positions',icon:'02',desc:'Compare phloem with xylem and locate both tissues in root, stem and leaf.',notes:[['Phloem function','Phloem transports sucrose and amino acids by translocation. Movement can occur up or down the plant depending on the locations of sources and sinks.'],['Sieve tube elements','Sieve tube elements are living cells joined end-to-end with reduced cytoplasm and no nucleus, leaving room for transport. Their end walls form perforated sieve plates.'],['Companion cells','Companion cells contain many mitochondria and ribosomes. They provide ATP and proteins needed for active loading and unloading of phloem contents.'],['Root distribution','In a dicot root, xylem forms a central X or star. Phloem lies in the spaces between the arms.'],['Stem distribution','In a dicot stem, vascular bundles form a ring. Within each bundle, xylem is toward the centre and phloem toward the outside, with cambium between them.'],['Leaf distribution','In a leaf vein, xylem is on the upper side and phloem on the lower side.']]},
 {id:'c8-water',chapter:8,name:'Follow the water',short:'Water pathway & transpiration',icon:'03',desc:'Trace water from soil to atmosphere and explain the transpiration stream.',notes:[['Into root hairs','Water enters root hair cells from soil by osmosis because soil water has a higher water potential than the root hair cell cytoplasm.'],['Across the root','Water moves across cortex cells and reaches the xylem.'],['Up the xylem','Evaporation in the leaves creates low pressure that pulls a continuous column of water upward through xylem.'],['Into the leaf','Water leaves xylem in leaf veins and enters mesophyll cells. It evaporates from moist mesophyll cell walls into leaf air spaces.'],['Transpiration definition','Transpiration is the loss of water vapour from plant leaves by evaporation at mesophyll cell surfaces followed by diffusion of water vapour through stomata.'],['Cohesion and adhesion','Cohesion holds water molecules together in a continuous column. Adhesion helps water molecules cling to xylem walls.']]},
 {id:'c8-factors',chapter:8,name:'Control water loss',short:'Transpiration factors & wilting',icon:'04',desc:'Predict how temperature, wind, humidity and light alter transpiration and explain wilting.',notes:[['Temperature','Higher temperature increases kinetic energy, increasing evaporation from mesophyll surfaces and diffusion of water vapour.'],['Wind speed','Higher wind speed removes humid air near stomata, maintaining a steep gradient and increasing transpiration.'],['Humidity','Higher humidity decreases transpiration because the gradient in water vapour concentration between leaf and air becomes smaller.'],['Light intensity','Higher light intensity generally opens stomata for carbon dioxide uptake, so transpiration increases until another factor limits it.'],['Wilting','If transpiration exceeds root water uptake, cells lose water and turgor, become flaccid and leaves or stems droop. Reduced turgor can also help stomata close and reduce further water loss.']]},

// Chapter 8 · 48 activities (42 objective + 6 written reflection tasks)
add('c8-xylem','mcq','Which pair of substances is transported in xylem?',{options:['Sucrose and amino acids','Water and mineral ions','Glucose and oxygen','Proteins and fats'],answer:1},'Xylem carries water and dissolved mineral ions from roots to leaves.');
add('c8-xylem','fill','The strengthening polymer deposited in xylem walls is called _____.',{answer:['lignin']},'Lignin strengthens and waterproofs the vessel walls.');
add('c8-xylem','multi','Which features help xylem transport water efficiently?',{options:['Dead cells','Empty lumen','Absent end walls','Lignified walls','Sieve plates'],answer:[0,1,2,3]},'Sieve plates are a phloem feature.');
add('c8-xylem','match','Match each xylem feature to its advantage.',{pairs:[['Empty lumen','Unobstructed pathway for water'],['No end walls','Continuous tube'],['Lignin','Prevents collapse and provides support'],['Pits','Allow lateral movement of water']]},'Each adaptation supports transport or mechanical strength.');
add('c8-xylem','matrix','Check the xylem statements.',{rows:[['Mature xylem vessel elements are dead.',true],['Xylem transports sucrose from leaves to roots.',false],['Lignin helps stop vessels collapsing under tension.',true],['Pits are areas where water can move sideways.',true]]},'Sucrose is transported in phloem, not xylem.');
add('c8-xylem','mcq','Why does the absence of end walls improve xylem transport?',{options:['It allows a continuous water column through the vessel','It creates sieve plates','It enables photosynthesis','It allows nuclei to move between cells'],answer:0},'Broken-down end walls create a continuous tube.');
add('c8-xylem','order','Arrange these changes during xylem vessel formation into a logical sequence.',{items:['Continuous hollow vessel remains','End walls break down','Cells die and lose contents'],answer:['Cells die and lose contents','End walls break down','Continuous hollow vessel remains']},'Loss of cell contents and end walls produces the hollow tube.');
add('c8-xylem','written','Explain how the structure of a xylem vessel is adapted for transport of water and support.',{rubric:['Vessel elements are dead and hollow, so there is little resistance to flow.','End walls are absent / broken down, forming a continuous tube.','Walls are lignified, strengthening them and preventing collapse under tension.','Lignin also provides mechanical support to the plant.','Pits allow lateral movement of water.']},'Link each structural feature directly to its function.');

add('c8-phloem','mcq','Which substances are transported in phloem?',{options:['Water and nitrate ions only','Sucrose and amino acids','Oxygen and carbon dioxide','Starch and cellulose'],answer:1},'Phloem transports organic solutes, especially sucrose and amino acids.');
add('c8-phloem','fill','The perforated end walls between sieve tube elements are called sieve _____.',{answer:['plates','plate']},'Sieve plates allow movement between adjacent sieve tube elements.');
add('c8-phloem','multi','Which statements describe companion cells?',{options:['They are living cells','They contain many mitochondria','They help active loading and unloading','They are hollow dead tubes','They make proteins using ribosomes'],answer:[0,1,2,4]},'Companion cells are living and metabolically active; hollow dead tubes describe xylem.');
add('c8-phloem','match','Match each plant organ to the usual vascular arrangement.',{pairs:[['Dicot root','Central xylem star with phloem between the arms'],['Dicot stem','Bundles in a ring'],['Leaf vein','Xylem upper, phloem lower'],['Stem vascular bundle','Xylem inside, phloem outside']]},'These positions are common exam-identification points.');
add('c8-phloem','matrix','Evaluate the phloem and bundle statements.',{rows:[['Phloem tissue is living.',true],['Phloem transport can occur upward or downward.',true],['In a dicot stem, phloem is nearer the outside of a vascular bundle than xylem.',true],['In a leaf vein, phloem lies above xylem.',false]]},'In leaf veins, xylem is usually upper and phloem lower.');
add('c8-phloem','mcq','Why do companion cells contain many mitochondria?',{options:['To provide ATP for active loading and unloading','To store water for transpiration','To make lignin rings','To absorb light for photosynthesis'],answer:0},'Phloem loading and unloading require energy from respiration.');
add('c8-phloem','order','From outside to inside, arrange these tissues in a typical dicot stem vascular bundle.',{items:['Xylem','Phloem','Cambium'],answer:['Phloem','Cambium','Xylem']},'Phloem is outer, cambium lies between, and xylem is inner.');
add('c8-phloem','written','Compare xylem and phloem in terms of substances transported, direction of transport and cell structure.',{rubric:['Xylem transports water and mineral ions; phloem transports sucrose and amino acids.','Xylem movement is mainly upward / unidirectional; phloem can move in both directions.','Mature xylem vessels are dead and hollow; phloem sieve tubes are living.','Xylem lacks end walls in the vessel; phloem has sieve plates.','Xylem walls are lignified; phloem walls are not lignified in the same way.']},'Compare the same feature on both sides.');

add('c8-water','mcq','How does water enter a root hair cell from moist soil?',{options:['Active transport','Osmosis','Translocation','Respiration'],answer:1},'Water enters by osmosis down a water potential gradient.');
add('c8-water','fill','The attraction between water molecules that helps keep a continuous column in xylem is called _____.',{answer:['cohesion']},'Cohesion is attraction between water molecules.');
add('c8-water','multi','Which steps are part of the transpiration stream?',{options:['Water enters root hair cells by osmosis','Water moves into xylem','Water is pulled up xylem','Water evaporates from mesophyll cell walls','Water vapour diffuses out through stomata'],answer:[0,1,2,3,4]},'All five are parts of the pathway from soil to atmosphere.');
add('c8-water','match','Match each process to its description.',{pairs:[['Osmosis','Water enters root hair cells down a water potential gradient'],['Evaporation','Liquid water becomes vapour at mesophyll surfaces'],['Diffusion','Water vapour moves out through stomata'],['Adhesion','Water molecules stick to xylem walls']]},'Use the process names precisely.');
add('c8-water','matrix','Check the transpiration statements.',{rows:[['Transpiration includes evaporation from mesophyll surfaces.',true],['Water vapour leaves mainly through stomata.',true],['Cohesion helps hold the water column together.',true],['Transpiration is the movement of sucrose through phloem.',false]]},'Movement of sucrose in phloem is translocation.');
add('c8-water','mcq','What creates the suction that pulls water upward in xylem?',{options:['Evaporation of water from leaves','Active transport by xylem cells','Photosynthesis in roots','Movement of sucrose into phloem'],answer:0},'Water loss from leaves creates low pressure at the top of the xylem.');
add('c8-water','order','Arrange the path of water from soil to atmosphere.',{items:['Water vapour diffuses out through stomata','Water enters root hair cell','Water moves up xylem','Water evaporates from mesophyll walls'],answer:['Water enters root hair cell','Water moves up xylem','Water evaporates from mesophyll walls','Water vapour diffuses out through stomata']},'The pathway runs from root uptake to xylem transport to evaporation and diffusion.');
add('c8-water','written','Describe how water moves from soil into the leaves of a tall plant and then into the atmosphere.',{rubric:['Water enters root hair cells by osmosis down a water potential gradient.','Water crosses cortex cells and enters xylem.','Transpiration pull / suction draws water upward in xylem.','Cohesion helps keep a continuous water column.','Water enters mesophyll, evaporates from cell walls and diffuses out through stomata.']},'Follow the path in order and name the processes.');

add('c8-factors','mcq','What happens to transpiration rate when wind speed increases, assuming other factors stay constant?',{options:['It usually increases','It always becomes zero','It decreases because stomata close immediately','It is unaffected'],answer:0},'Moving air removes humid air from around the leaf, maintaining a steep gradient.');
add('c8-factors','fill','Increasing air humidity usually _____ the rate of transpiration.',{answer:['decreases','reduces','lowers']},'Humid air reduces the water vapour concentration gradient.');
add('c8-factors','multi','Which changes would usually increase transpiration rate?',{options:['Higher temperature','Higher wind speed','Lower humidity','Higher light intensity','Closing all stomata'],answer:[0,1,2,3]},'Closing stomata decreases water loss.');
add('c8-factors','match','Match each factor to the reason it affects transpiration.',{pairs:[['Higher temperature','Faster evaporation and diffusion'],['Higher wind speed','Removes humid boundary layer'],['Higher humidity','Reduces water vapour gradient'],['Higher light intensity','Stomata open for carbon dioxide entry']]},'Link environmental changes to the mechanism.');
add('c8-factors','matrix','Evaluate the statements about wilting.',{rows:[['Wilting can occur when water loss exceeds water uptake.',true],['Wilting is associated with cells losing turgor.',true],['Flaccid cells provide stronger support than turgid cells.',false],['A dry windy environment can increase the risk of wilting.',true]]},'Loss of turgor reduces support and causes drooping.');
add('c8-factors','mcq','Why does higher temperature often increase transpiration?',{options:['It increases kinetic energy of water molecules','It stops evaporation','It turns xylem into phloem','It lowers the number of stomata'],answer:0},'Higher kinetic energy increases evaporation and diffusion.');
add('c8-factors','mcq','Which environment would usually produce the lowest transpiration rate?',{options:['Hot, dry and windy','Cool, humid and still','Warm, bright and windy','Hot, bright and dry'],answer:1},'Cool temperature, high humidity and little air movement all reduce transpiration.');
add('c8-factors','written','Explain why a plant can wilt rapidly in dry, windy conditions when soil water is limited.',{rubric:['Wind removes moist air from around the leaf and increases the gradient for water vapour diffusion.','Dry air / low humidity also steepens the gradient.','Transpiration can exceed water uptake by roots.','Cells lose water by osmosis and lose turgor / become flaccid.','Leaves and stems droop / wilt because turgor support is lost.']},'Connect environment → increased water loss → loss of turgor → wilting.');

add('c8-translocation','mcq','What is translocation?',{options:['Movement of water in xylem','Movement of sucrose and amino acids in phloem from sources to sinks','Loss of water vapour through stomata','Absorption of mineral ions by roots'],answer:1},'Translocation is specifically phloem transport of sucrose and amino acids.');
add('c8-translocation','fill','A part of a plant that releases sucrose into phloem is called a _____.',{answer:['source']},'A source loads organic solutes into phloem.');
add('c8-translocation','multi','Which organs can act as sinks during active growth?',{options:['Developing fruits','Growing roots','Young buds','Flowers','Mature photosynthesising leaves only'],answer:[0,1,2,3]},'Growing or storage tissues often act as sinks; mature green leaves are usually sources in summer.');
add('c8-translocation','match','Match each season or tissue to its typical source–sink role.',{pairs:[['Mature leaves in summer','Source'],['Developing fruit in summer','Sink'],['Root tuber in early spring','Source'],['Growing bud in early spring','Sink']]},'Source and sink roles can reverse with season.');
add('c8-translocation','matrix','Check the translocation statements.',{rows:[['Phloem can transport solutes upward or downward.',true],['A source always means a leaf.',false],['A storage organ can change from sink to source.',true],['Removing a ring of bark can interrupt phloem transport.',true]]},'Source is defined by release into phloem, not by organ identity.');
add('c8-translocation','mcq','What is expected above a ring where bark and phloem have been removed?',{options:['Sucrose accumulates and swelling may occur','Xylem immediately disappears','All water transport stops at once','Leaves instantly lose chlorophyll'],answer:0},'Sugars accumulate above the cut because downward phloem transport is blocked.');
add('c8-translocation','order','Arrange the spring source–sink sequence.',{items:['Growing buds use sucrose','Stored starch is converted to sucrose','Sucrose travels through phloem from storage organ'],answer:['Stored starch is converted to sucrose','Sucrose travels through phloem from storage organ','Growing buds use sucrose']},'Stored carbohydrate is mobilised before young leaves are self-supporting.');
add('c8-translocation','written','Explain why a root tuber can act as a sink in summer but a source in early spring.',{rubric:['In summer, photosynthesising leaves produce excess sucrose.','Sucrose is transported to tubers and stored, so the tuber is a sink.','In spring, before leaves are fully photosynthetic, stored starch is converted to sucrose.','Sucrose moves out of the tuber through phloem to growing buds / leaves.','Therefore the tuber becomes a source.']},'Emphasise that source and sink roles depend on net movement of solutes.');

add('c8-practical','mcq','What does a potometer directly measure?',{options:['Rate of photosynthesis','Rate of water uptake by a shoot','Exact rate of transpiration','Rate of sucrose translocation'],answer:1},'A potometer measures water uptake, which approximates but does not exactly equal transpiration.');
add('c8-practical','fill','The movement of an air bubble along a capillary tube can be used to calculate water uptake per unit _____.',{answer:['time']},'Rate is a change in distance or volume divided by time.');
add('c8-practical','multi','Which are good potometer precautions?',{options:['Cut the shoot underwater','Seal joints with petroleum jelly','Allow acclimatisation time','Keep the apparatus airtight','Deliberately introduce air into xylem'],answer:[0,1,2,3]},'Air in xylem can break the continuous water column.');
add('c8-practical','match','Match each practical action to its reason.',{pairs:[['Cut shoot underwater','Prevent air entering xylem'],['Cut stem at an angle','Increase cut surface area'],['Seal joints','Prevent air leaks'],['Allow acclimatisation','Let the shoot adjust to conditions before measurement']]},'Each precaution improves validity or reliability.');
add('c8-practical','matrix','Evaluate the potometer statements.',{rows:[['Water uptake usually closely approximates transpiration.',true],['Every drop of absorbed water must be transpired.',false],['Airtight seals are important.',true],['Only one environmental variable should be deliberately changed in a fair test.',true]]},'Some absorbed water is retained or used by the plant.');
add('c8-practical','mcq','Why is water uptake not exactly equal to transpiration?',{options:['Some absorbed water is retained for growth or used in photosynthesis','Potometers contain phloem only','Leaves cannot lose water','Xylem transports sucrose instead'],answer:0},'A small fraction of absorbed water remains in the plant or is used metabolically.');
add('c8-practical','order','Arrange a fair potometer investigation in a sensible sequence.',{items:['Record bubble movement over a fixed time','Assemble and seal the apparatus','Allow the shoot to acclimatise','Change one environmental variable'],answer:['Assemble and seal the apparatus','Allow the shoot to acclimatise','Change one environmental variable','Record bubble movement over a fixed time']},'Set up carefully, acclimatise, change the intended variable, then measure.');
add('c8-practical','written','Plan how a potometer could be used to investigate the effect of wind speed on water uptake.',{rubric:['Use the same leafy shoot / comparable shoots and an airtight water-filled potometer.','Cut the shoot underwater and allow time to acclimatise.','Vary wind speed, for example by changing fan speed or distance.','Measure bubble movement / water uptake over the same time interval.','Keep temperature, light intensity and humidity as constant as possible.','Repeat each wind-speed treatment and calculate a mean.']},'State the independent variable, measured response and important controls.');

 {id:'c9-circuits',chapter:9,name:'Trace the circulation',short:'Single & double circulation',icon:'01',desc:'Compare fish and mammal circuits and explain why double circulation supports efficient transport.',notes:[['Circulatory system','A circulatory system is a system of blood vessels with a pump, the heart, and valves that help maintain one-way flow.'],['Single circulation','In fish, blood passes through the heart once per complete circuit: heart → gills → body → heart. Pressure falls across the gill capillaries, so blood reaches body tissues at relatively low pressure.'],['Double circulation','In mammals, blood passes through the heart twice per complete circuit. The pulmonary circuit links heart and lungs; the systemic circuit links heart and the rest of the body.'],['Why double circulation helps','Blood is repressurised after leaving the lungs before being sent around the body, allowing faster delivery of oxygen and glucose to active tissues.'],['Separation','The septum separates oxygenated and deoxygenated blood in the mammalian heart.']]},

add('c9-circuits','mcq','In a fish single circulation, how many times does blood pass through the heart in one complete circuit?',{options:['Once','Twice','Three times','It never returns to the heart'],answer:0},'In a single circulation, blood passes through the heart once per complete circuit.');
add('c9-circuits','fill','In mammals, the circuit from the heart to the lungs and back is the _____ circuit.',{answer:['pulmonary']},'The pulmonary circuit connects the heart and lungs.');
add('c9-circuits','multi','Which are advantages or features of double circulation?',{options:['Blood is repressurised before systemic circulation','High-pressure delivery to body tissues','Blood passes through the heart twice per complete circuit','Oxygenated and deoxygenated blood are kept separated','Blood never enters capillaries'],answer:[0,1,2,3]},'Double circulation maintains efficient pressure and separates the two sides of the circulation.');
add('c9-circuits','match','Match each pathway or term to its description.',{pairs:[['Single circulation','Heart → gills → body → heart'],['Pulmonary circuit','Heart → lungs → heart'],['Systemic circuit','Heart → body → heart'],['Septum','Prevents mixing of left- and right-side blood']]},'Use the direction of each circuit and the septum’s separating function.');
add('c9-circuits','matrix','Evaluate the circulation statements.',{rows:[['Fish have a single circulation.',true],['Mammalian blood passes through the heart twice in one complete circuit.',true],['Blood pressure rises after passing through fish gill capillaries without returning to the heart.',false],['Double circulation supports rapid delivery to active tissues.',true]]},'Blood pressure falls across capillary beds; mammals restore pressure by sending blood through the heart again.');
add('c9-circuits','order','Put the pulmonary pathway in the correct order.',{items:['Left atrium','Lungs','Right ventricle','Pulmonary vein','Pulmonary artery'],answer:['Right ventricle','Pulmonary artery','Lungs','Pulmonary vein','Left atrium']},'The right ventricle sends deoxygenated blood to the lungs; oxygenated blood returns to the left atrium.');
add('c9-circuits','mcq','Why does double circulation allow a higher pressure to the body than fish single circulation?',{options:['Blood is pumped again after returning from the lungs','Veins have thicker walls than arteries','Capillaries contain valves','The heart has no septum'],answer:0},'The heart repressurises blood after the pulmonary circuit before systemic circulation.');
add('c9-circuits','written','Compare single circulation in fish with double circulation in mammals and explain one advantage of double circulation.',{rubric:['Fish: heart → gills → body → heart; blood passes through heart once per circuit.','Mammals have pulmonary and systemic circuits; blood passes through the heart twice.','Blood is repressurised after the lungs before going to the body.','Higher pressure allows faster delivery of oxygen and glucose to active tissues.']},'Make the comparison explicit and link the advantage to pressure and transport.');

add('c9-heart','mcq','Which chamber has the thickest muscular wall?',{options:['Right atrium','Left atrium','Right ventricle','Left ventricle'],answer:3},'The left ventricle pumps blood around the whole body at high pressure.');
add('c9-heart','fill','The muscular wall separating the left and right sides of the heart is the _____.',{answer:['septum']},'The septum prevents mixing of oxygenated and deoxygenated blood.');
add('c9-heart','multi','Which structures help ensure one-way flow through the heart?',{options:['Atrioventricular valves','Semilunar valves','Septum','Chloroplasts'],answer:[0,1]},'Valves directly prevent backflow. The septum separates the two sides rather than acting as a valve.');
add('c9-heart','match','Match each heart structure to its function.',{pairs:[['Atria','Receive blood entering the heart'],['Ventricles','Pump blood out of the heart'],['Septum','Prevents mixing between left and right sides'],['Valves','Prevent backflow']]},'Heart structures are specialised for receiving, pumping, separating and controlling flow.');
add('c9-heart','matrix','Check the heart statements.',{rows:[['Atria have thinner walls than ventricles.',true],['The right ventricle pumps to the lungs.',true],['The left ventricle pumps through the aorta to the body.',true],['Semilunar valves allow blood to flow backwards into ventricles.',false]]},'Semilunar valves prevent backflow from the arteries into the ventricles.');
add('c9-heart','order','Trace oxygenated blood from the lungs until it leaves the heart for the body.',{items:['Aorta','Left ventricle','Pulmonary vein','Left atrium'],answer:['Pulmonary vein','Left atrium','Left ventricle','Aorta']},'Oxygenated blood returns in the pulmonary vein, passes through the left heart and leaves by the aorta.');
add('c9-heart','mcq','Why is the left ventricular wall thicker than the right ventricular wall?',{options:['It pumps blood a greater distance around the body at higher pressure','It stores more blood','It receives blood from the vena cava','It contains valves'],answer:0},'Systemic circulation has greater resistance and distance than the pulmonary circuit.');
add('c9-heart','written','Explain why ventricular walls are thicker than atrial walls and why the left ventricle is thicker than the right ventricle.',{rubric:['Atria only push blood a short distance into ventricles.','Ventricles pump blood out of the heart and therefore require stronger contractions.','The right ventricle pumps to the nearby lungs at lower pressure.','The left ventricle pumps through the aorta to the whole body and must generate higher pressure.']},'Relate muscle thickness to distance, resistance and pressure.');

add('c9-chd','mcq','What do coronary arteries supply directly?',{options:['The heart muscle','The kidney tubules','The alveoli','The liver lobules'],answer:0},'Coronary arteries supply cardiac muscle with oxygenated blood and glucose.');
add('c9-chd','fill','A build-up of fatty material in an artery wall is called an _____.',{answer:['atheroma','atherosclerotic plaque','fatty plaque']},'Fatty deposits narrow coronary arteries and can reduce blood flow.');
add('c9-chd','multi','Which are risk factors for coronary heart disease?',{options:['Smoking','Diet high in saturated fat','Lack of exercise','Genetic predisposition','Regular moderate exercise'],answer:[0,1,2,3]},'Regular exercise is generally protective rather than a risk factor.');
add('c9-chd','match','Match each CHD-related idea to its effect.',{pairs:[['Coronary artery blockage','Less oxygen and glucose reach cardiac muscle'],['Smoking','Can damage artery linings and reduce oxygen transport'],['Exercise','Can strengthen cardiovascular fitness'],['Angioplasty / stent','Helps reopen a narrowed coronary artery']]},'Keep risk factors, mechanisms and treatments distinct.');
add('c9-chd','matrix','Evaluate the statements about exercise and heart rate.',{rows:[['Heart rate usually rises during exercise.',true],['Working muscles need more oxygen and glucose.',true],['Recovery time is the time for heart rate to move back towards resting level.',true],['Exercise makes the heart stop delivering carbon dioxide to the lungs.',false]]},'Exercise increases transport demands rather than stopping gas transport.');
add('c9-chd','order','Put the sequence leading from coronary blockage to heart muscle damage in order.',{items:['Cardiac muscle receives less oxygen','Fatty plaque narrows a coronary artery','Aerobic respiration falls','Heart muscle cells may die'],answer:['Fatty plaque narrows a coronary artery','Cardiac muscle receives less oxygen','Aerobic respiration falls','Heart muscle cells may die']},'Reduced blood flow lowers oxygen delivery, limiting respiration and damaging tissue.');
add('c9-chd','mcq','Which change would generally reduce CHD risk?',{options:['Smoking more cigarettes','Regular exercise and a balanced lower-saturated-fat diet','Increasing saturated-fat intake','Avoiding all physical activity'],answer:1},'Exercise, not smoking, and a balanced diet are major preventable risk factors.');
add('c9-chd','written','Explain how a coronary artery blockage can cause a heart attack and describe two ways to reduce the risk.',{rubric:['A fatty deposit narrows or blocks a coronary artery.','Less blood reaches cardiac muscle, so less oxygen and glucose are delivered.','Aerobic respiration falls and cardiac muscle may stop contracting / die.','Risk can be reduced by not smoking, regular exercise and/or a balanced diet low in saturated fat.']},'Link the blockage to reduced respiration before giving prevention strategies.');

add('c9-vessels','mcq','Which vessel type carries blood away from the heart at high pressure?',{options:['Artery','Vein','Capillary','Lacteal'],answer:0},'Arteries carry blood away from the heart.');

add('c9-vessels','multi','Which are characteristic features of veins?',{options:['Wide lumen','Valves','Thinner walls than arteries','Carry blood towards the heart','Very thick elastic wall for the highest pressure'],answer:[0,1,2,3]},'Veins operate at lower pressure and rely on valves to reduce backflow.');
add('c9-vessels','match','Match each named vessel to its route.',{pairs:[['Pulmonary artery','Heart to lungs'],['Pulmonary vein','Lungs to heart'],['Renal artery','Carries blood to a kidney'],['Hepatic vein','Carries blood away from the liver']]},'The pulmonary vessels are important exceptions to the usual oxygenation pattern of arteries and veins.');
add('c9-vessels','matrix','Evaluate the vessel statements.',{rows:[['Arteries have thick muscular and elastic walls.',true],['Veins generally have a wider lumen than arteries.',true],['Capillaries are major sites of exchange.',true],['All arteries carry oxygenated blood.',false]]},'The pulmonary artery carries deoxygenated blood to the lungs.');
add('c9-vessels','order','Trace deoxygenated blood from the body to the lungs.',{items:['Pulmonary artery','Right atrium','Vena cava','Right ventricle'],answer:['Vena cava','Right atrium','Right ventricle','Pulmonary artery']},'Systemic venous blood returns in the vena cava and is pumped to the lungs by the right ventricle.');
add('c9-vessels','mcq','How does artery elasticity help blood flow?',{options:['It allows the wall to stretch and recoil as pressure changes','It creates antibodies','It prevents all diffusion','It turns glucose into glycogen'],answer:0},'Elastic recoil helps smooth out the pulse produced by ventricular contractions.');
add('c9-vessels','written','Compare an artery, vein and capillary, linking their structures to their functions.',{rubric:['Arteries: thick muscular and elastic walls, relatively narrow lumen, carry blood away at high pressure.','Veins: thinner walls, wide lumen and valves, carry blood towards the heart at lower pressure.','Capillaries: one-cell-thick walls and very narrow lumen, allowing efficient exchange with tissues.']},'Use paired structure–function statements for each vessel.');

add('c9-blood','mcq','Which blood component contains haemoglobin?',{options:['Red blood cells','Platelets','Plasma only','Lymphocytes'],answer:0},'Haemoglobin in red blood cells binds oxygen.');
add('c9-blood','fill','Haemoglobin combined with oxygen forms _____.',{answer:['oxyhaemoglobin','oxyhemoglobin']},'Oxygen binds reversibly to haemoglobin to form oxyhaemoglobin.');
add('c9-blood','multi','Which are adaptations of red blood cells for oxygen transport?',{options:['Biconcave shape','No nucleus','Haemoglobin','Flexible membrane','Thick cellulose wall'],answer:[0,1,2,3]},'Red blood cells lack a cellulose wall. Their shape, haemoglobin content and flexibility support oxygen transport.');
add('c9-blood','match','Match each blood component to its main role.',{pairs:[['Red blood cell','Transport oxygen'],['Phagocyte','Engulf and digest pathogens'],['Lymphocyte','Produce specific antibodies'],['Plasma','Transport dissolved substances and heat']]},'Each blood component has a specialised transport or defence role.');
add('c9-blood','matrix','Check the blood statements.',{rows:[['Platelets are cell fragments involved in clotting.',true],['Plasma carries urea and hormones.',true],['Phagocytes produce haemoglobin.',false],['Lymphocytes can produce antibodies.',true]]},'Phagocytes engulf pathogens; haemoglobin is found in red blood cells.');
add('c9-blood','mcq','Why does a mammalian red blood cell have no nucleus?',{options:['To leave more space for haemoglobin','To make fibrin','To carry antibodies','To digest bacteria'],answer:0},'Loss of the nucleus increases space available for haemoglobin.');

add('c9-blood','written','Describe how red blood cells, phagocytes, lymphocytes and plasma contribute to transport and defence.',{rubric:['Red blood cells contain haemoglobin and transport oxygen.','Phagocytes engulf and digest pathogens by phagocytosis.','Lymphocytes produce specific antibodies.','Plasma transports dissolved substances such as glucose, amino acids, carbon dioxide, urea and hormones, as well as heat.']},'Keep the functions of phagocytes and lymphocytes separate.');

add('c9-clotting','mcq','Which soluble plasma protein is converted into insoluble fibrin during clotting?',{options:['Fibrinogen','Haemoglobin','Insulin','Cellulose'],answer:0},'Fibrinogen is converted into fibrin threads.');
add('c9-clotting','fill','Insoluble _____ threads form a mesh across a wound.',{answer:['fibrin']},'Fibrin forms the mesh of a blood clot.');
add('c9-clotting','multi','What are functions of blood clotting?',{options:['Reduce blood loss','Help block entry of pathogens','Create a fibrin mesh','Increase bleeding from the wound'],answer:[0,1,2]},'A clot seals the wound; it does not increase bleeding.');
add('c9-clotting','match','Match each practical term to its meaning.',{pairs:[['Resting heart rate','Pulse measured before exercise after resting'],['Recovery time','Time for heart rate to return towards resting level'],['Standardised exercise','Same type and duration of activity for fair comparison'],['Pulse rate','Number of arterial pulses per minute']]},'Reliable exercise investigations standardise the activity and measurement method.');
add('c9-clotting','matrix','Evaluate the clotting and pulse statements.',{rows:[['Platelets contribute to the clotting process.',true],['Fibrin forms an insoluble mesh.',true],['A pulse can be counted at the wrist or neck.',true],['A fair exercise comparison should use a different exercise duration for every participant.',false]]},'Fair tests control exercise duration and method.');
add('c9-clotting','order','Put these clotting events in order.',{items:['Fibrin forms a mesh','Fibrinogen is converted to fibrin','Blood vessel is damaged','Cells become trapped and a clot forms'],answer:['Blood vessel is damaged','Fibrinogen is converted to fibrin','Fibrin forms a mesh','Cells become trapped and a clot forms']},'Damage triggers clotting; fibrin then forms a mesh that traps cells.');
add('c9-clotting','mcq','Which design gives the fairest comparison of recovery after exercise?',{options:['Use the same exercise type and duration, then measure pulse at the same intervals','Let everyone choose different exercises and times','Measure one person before exercise and a different person after','Change the pulse-counting method each minute'],answer:0},'Control the exercise and measurement conditions so recovery can be compared fairly.');
