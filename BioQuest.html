/* BioQuest UX refinement — fully clickable section cards + right-expanding chapter flyout */
.mission.clickable-section,.mastery-card.clickable-section{cursor:pointer;position:relative;padding-bottom:20px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.mission.clickable-section::after,.mastery-card.clickable-section::after{content:'↗';position:absolute;right:14px;bottom:11px;font-size:1.05rem;color:var(--text);opacity:.62;transition:transform .18s ease,opacity .18s ease}
.mission.clickable-section:hover,.mastery-card.clickable-section:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--cyan) 38%,var(--border));box-shadow:0 16px 42px color-mix(in srgb,var(--cyan) 9%,transparent),var(--glow)}
.mission.clickable-section:hover::after,.mastery-card.clickable-section:hover::after{transform:translate(2px,-2px);opacity:1}
.mission.clickable-section:focus-visible,.mastery-card.clickable-section:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
.mission.clickable-section .bar,.mastery-card.clickable-section .bar{margin-bottom:4px}

.chapter-flyout{position:fixed!important;right:auto!important;z-index:120!important;width:520px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow:auto;padding:8px!important;border-radius:18px!important;transform-origin:left top;animation:chapterFlyRight .24s cubic-bezier(.2,.82,.24,1) both!important;box-shadow:0 28px 90px rgba(0,0,0,.24),var(--glow)!important}
@keyframes chapterFlyRight{0%{opacity:0;transform:translateX(-18px) scale(.97)}100%{opacity:1;transform:translateX(0) scale(1)}}
.chapter-flyout .chapter-option{grid-template-columns:38px minmax(0,1fr) 22px;min-height:44px;padding:8px 10px;gap:10px;border:1px solid transparent;border-radius:12px}
.chapter-flyout .chapter-option:hover{border-color:color-mix(in srgb,var(--text) 12%,transparent)}
.chapter-flyout .chapter-option strong{display:block;white-space:nowrap;overflow:visible;text-overflow:clip;font-size:.78rem;line-height:1.25;color:var(--text)!important;font-weight:680}
.chapter-flyout .chapter-option.active{border-color:color-mix(in srgb,var(--lime) 28%,transparent)}
.chapter-flyout .chapter-picker-num{width:32px;height:32px}
.chapter-picker.open .chapter-picker-chevron{transform:rotate(-90deg)}
@media(max-width:800px){.chapter-flyout{width:calc(100vw - 20px)!important;max-width:none}.chapter-flyout .chapter-option strong{font-size:.72rem}}
@media(max-width:430px){.chapter-flyout .chapter-option{grid-template-columns:31px minmax(0,1fr) 18px;padding:7px 8px;gap:7px}.chapter-flyout .chapter-picker-num{width:28px;height:28px;font-size:.62rem}.chapter-flyout .chapter-option strong{font-size:.66rem}}
@media(prefers-reduced-motion:reduce){.chapter-flyout{animation:none!important}.mission.clickable-section,.mastery-card.clickable-section,.mission.clickable-section::after,.mastery-card.clickable-section::after{transition:none!important}}

.option[role="radio"]{position:relative}.option[role="radio"][aria-checked="true"],.option[aria-pressed="true"]{border-color:color-mix(in srgb,var(--lime) 55%,var(--border))!important}.chapter-option:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}.chapter-flyout .chapter-option[aria-checked="true"]{background:linear-gradient(135deg,color-mix(in srgb,var(--panel-bg-strong) 82%,#c8ff83 18%),color-mix(in srgb,var(--panel-bg) 90%,#8be9ff 10%))!important}

 }

</style></head><body><a class="skip" href="#main">Skip to learning</a><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><noscript>BioQuest needs JavaScript to run interactive challenges. Please enable JavaScript in your browser.</noscript>
<script>
const TOPICS = [
 {id:'life',name:'What makes something alive?',short:'Characteristics of life',icon:'01',desc:'Seven processes. One living world.',notes:[['The seven characteristics','MRS GREN: movement, respiration, sensitivity, growth, reproduction, excretion and nutrition. An individual need not show every process at every moment.'],['Movement & sensitivity','Movement changes the position of an organism or part of it. Sensitivity means detecting a stimulus and making an appropriate response. A shoot bending towards light illustrates both.'],['Respiration','Chemical reactions in cells break down nutrient molecules and release energy for metabolism. Respiration is not the same as breathing.'],['Growth','A permanent increase in size and dry mass through an increase in cell number, cell size, or both. Water uptake alone can temporarily increase wet mass.'],['Excretion & egestion','Excretion removes metabolic waste, toxic materials and substances in excess. Carbon dioxide from respiration is metabolic waste. Egestion removes undigested food from the gut.'],['Nutrition & reproduction','Nutrition supplies materials for energy, growth and development. Reproduction produces more organisms of the same kind.']]},
 {id:'names',name:'Bring order to life',short:'Names & relationships',icon:'02',desc:'From a scientific name to a shared ancestor.',notes:[['Species','For this course, a species is a group of organisms that can reproduce with each other to produce fertile offspring. The word fertile matters.'],['Scientific names','A binomial has a genus name followed by a specific name: Homo sapiens. Capitalise the genus; use lowercase for the second word. Print both in italics, or underline each word when handwritten.'],['Classification hierarchy','Kingdom → phylum → class → order → family → genus → species. Moving towards species means smaller, more closely related groups.'],['Evolutionary relationships','Classification aims to reflect shared ancestry. More similar DNA base sequences or amino acid sequences usually indicate a more recent common ancestor.'],['Appearance can mislead','Organisms may evolve similar adaptations independently. Sequence evidence complements comparisons of morphology (form) and anatomy (internal structure).']]},
 {id:'kingdoms',name:'Explore the five kingdoms',short:'The five kingdoms',icon:'03',desc:'Read the clues hidden inside cells.',notes:[['Animals','Multicellular organisms with nuclei. Their cells have no cell walls or chloroplasts. They obtain nutrients by feeding on organic substances.'],['Plants','Multicellular organisms with cellulose cell walls. Photosynthetic cells have chloroplasts. Not every plant cell contains chloroplasts; root cells are a useful counterexample.'],['Fungi','Have nuclei and chitin cell walls. They do not have chloroplasts. Saprotrophic fungi digest material outside their bodies, then absorb the products. Yeast is unicellular.'],['Protoctists','Organisms with nuclei, often single-celled. Some, such as Chlamydomonas, have chloroplasts; others, such as Amoeba, do not.'],['Prokaryotes','Bacteria have no nucleus. Their circular DNA is in the cytoplasm; plasmids may also be present. They have ribosomes but no mitochondria. Bacterial cell walls are not cellulose.'],['Compare evidence','A cell wall alone cannot identify a kingdom. Combine clues such as wall material, nuclei, chloroplasts and how the organism obtains nutrients.']]},
 {id:'animals',name:'Meet the animal groups',short:'Vertebrates & arthropods',icon:'04',desc:'Observe the features. Find the group.',notes:[['Vertebrates','Animals with a vertebral column (backbone). The five groups studied here are fish, amphibians, reptiles, birds and mammals.'],['Fish, amphibians & reptiles','Fish typically have fins, scales and gills. Amphibians typically have moist skin; larvae use gills and adults often use lungs and skin. Reptiles have dry scales and use lungs.'],['Birds & mammals','Feathers identify birds. Mammals have hair and mammary glands that produce milk. Most mammals give birth to live young, but egg-laying mammals are exceptions.'],['Arthropods','Have jointed legs and an exoskeleton. Insects: three pairs of legs, three main body regions and one pair of antennae. Arachnids: four pairs of legs, two main body regions and no antennae.'],['Crustaceans & myriapods','Crustaceans have two pairs of antennae and usually more than four pairs of legs in school identification keys. Myriapods have many body segments, many legs and one pair of antennae.'],['Choose reliable features','Flight alone cannot distinguish birds from mammals or insects. Feathers are a much stronger classification clue than habitat or movement.']]},
 {id:'plants',name:'Decode the plant world',short:'Ferns & flowering plants',icon:'05',desc:'Seeds, spores and patterns in leaves.',notes:[['Ferns','Have roots, stems and leaves (fronds). Reproduce by spores rather than seeds. Spore-producing structures are often found on the undersides of fronds.'],['Flowering plants','Produce flowers and seeds. Seeds develop from ovules; ovaries develop into fruits. Cotyledons are seed leaves.'],['Monocotyledons','One cotyledon. Typical features include parallel leaf veins, flower parts in multiples of three and fibrous roots.'],['Dicotyledons','Two cotyledons. Typical features include branching, net-like leaf veins, flower parts in multiples of four or five and a main taproot.'],['Use several clues','Leaf-vein patterns and flower-part counts are useful typical features. The number of cotyledons gives the meaning of the group name.']]},
 {id:'keys',name:'Think like a taxonomist',short:'Keys & viruses',icon:'06',desc:'Follow the evidence. Challenge the exceptions.',notes:[['Dichotomous keys','Each step offers two contrasting alternatives. Follow the statement matching the specimen, then go to the indicated step or identification.'],['Good key statements','Use observable features with clear boundaries: wings present / wings absent. Avoid subjective labels such as beautiful or large without a measurement.'],['Viruses','A virus has genetic material (DNA or RNA) inside a protein coat. Some also have a lipid envelope. Viruses are not cells and have no ribosomes or independent metabolism.'],['Host dependence','Viruses can replicate only using a host cell. They are not placed in the five kingdoms in this course because they do not carry out the characteristics of life independently.'],['A simple arthropod key','First look for antennae. No antennae and eight legs suggests an arachnid. With antennae: six legs suggests an insect; two pairs of antennae suggests a crustacean; many segments with one pair suggests a myriapod.']]}
];
const QUESTIONS=[];
const QUESTION_SEQ_BY_TOPIC=Object.create(null);
function add(topic,type,prompt,config,explain){const n=(QUESTION_SEQ_BY_TOPIC[topic]||0)+1;QUESTION_SEQ_BY_TOPIC[topic]=n;QUESTIONS.push({id:topic+'-'+n,topic,type,prompt,...config,explain});}
add('life','mcq','A seedling bends towards a window. Which characteristic describes detecting and responding to the light?',{options:['Nutrition','Sensitivity','Reproduction','Excretion'],answer:1},'Sensitivity links a stimulus (light) to an appropriate response. The bending also involves movement, but the question asks about detecting and responding.');
add('life','fill','Growth is a permanent increase in size and _____ mass.',{answer:['dry'],hint:'Think about why drinking water is not growth.'},'Dry mass excludes water. Temporary water uptake can increase wet mass without biological growth.');
add('life','multi','Which are examples of excretion? Select every correct answer.',{options:['Removing carbon dioxide made in respiration','Passing undigested food from the gut','Removing excess water in urine','Removing urea made from amino acid breakdown'],answer:[0,2,3]},'Carbon dioxide and urea are metabolic wastes. Excess water is also excreted. Passing undigested food is egestion.');
add('life','match','Match each process to its example.',{pairs:[['Reproduction','A bacterium divides into two'],['Nutrition','An animal takes in food'],['Respiration','Cells release energy from glucose'],['Movement','A leaf changes position']]},'Reproduction makes more organisms; nutrition takes in materials; respiration releases energy through chemical reactions; movement changes position.');
add('life','matrix','Decide whether each statement is true or false.',{rows:[['Respiration happens only in animals.',false],['Growth can involve an increase in cell number.',true],['Breathing and cellular respiration mean the same thing.',false],['Sensitivity includes responses to internal stimuli.',true]]},'Plants respire too. Breathing ventilates gas-exchange surfaces; respiration is a set of chemical reactions in cells. Stimuli can be internal or external.');
add('life','mcq','Which statement best defines respiration?',{options:['Taking oxygen into the lungs','Chemical reactions in cells that break down nutrient molecules and release energy','Moving nutrients through the blood','Removing undigested food'],answer:1},'Include chemical reactions, cells, nutrient molecules and release of energy. Do not substitute breathing for respiration.');
add('life','fill','The removal of undigested food from the gut is called _____.',{answer:['egestion']},'Egestion deals with undigested food. Excretion deals with metabolic waste, toxic substances and substances in excess.');
add('life','written','Define growth and explain why a temporary increase in water content is not sufficient evidence of growth.',{rubric:['A permanent increase in size and dry mass.','An increase in cell number, cell size, or both.','Water can be lost again; extra water does not establish an increase in dry mass.']},'These are practice assessment points, not an official Cambridge mark scheme. Compare your meaning, not just individual keywords.');
add('names','fill','Organisms of the same species can reproduce with each other to produce _____ offspring.',{answer:['fertile']},'Fertile offspring can themselves reproduce. Merely producing offspring is not enough in this course definition.');
add('names','mcq','Which scientific name uses the correct capitalisation?',{options:['homo Sapiens','Homo Sapiens','Homo sapiens','homo sapiens'],answer:2},'The genus starts with a capital letter; the specific name starts with a lowercase letter. Both words should be italicised in print.');
add('names','order','Arrange the groups from broadest to most specific.',{items:['Species','Order','Kingdom','Genus','Phylum','Family','Class'],answer:['Kingdom','Phylum','Class','Order','Family','Genus','Species']},'Kingdom → phylum → class → order → family → genus → species. Each step narrows the group.');
add('names','multi','Which evidence can help infer evolutionary relationships?',{options:['DNA base sequences','Amino acid sequences in proteins','The alphabetical order of names','Anatomical similarities'],answer:[0,1,3]},'DNA, proteins and anatomical features can provide evidence of relationships. Names are labels, not independent evidence of ancestry.');
add('names','matrix','Check these claims about names and relationships.',{rows:[['Panthera leo and Panthera tigris share a genus.',true],['Organisms in the same genus must be the same species.',false],['More similar DNA sequences usually suggest closer ancestry.',true],['A binomial scientific name contains three words.',false]]},'A genus may contain several species. A binomial has two words. Sequence similarity is evidence of evolutionary relationships.');
add('names','match','Match the term to its meaning.',{pairs:[['Morphology','External form and features'],['Anatomy','Internal structure'],['Genus','The first word in a binomial'],['Fertile','Able to reproduce']]},'Distinguish observations of form and structure from the naming system and reproductive ability.');
add('names','mcq','A horse and a donkey produce an infertile mule. What does this support?',{options:['Horses and donkeys are the same species','Horses and donkeys are different species','Mules form a new kingdom','All mammals belong to one species'],answer:1},'The offspring is infertile. This does not meet the fertile-offspring criterion used to define a species here.');
add('names','written','Explain why DNA evidence can improve classification based on appearance alone.',{rubric:['Classification aims to reflect evolutionary relationships.','More similar DNA base sequences usually indicate a more recent common ancestor.','Similar appearances can evolve independently, so appearance alone can mislead.']},'A strong explanation connects the evidence to shared ancestry rather than simply saying DNA is more accurate.');
add('kingdoms','mcq','An organism has nuclei, chitin cell walls and no chloroplasts. Which kingdom fits best?',{options:['Plants','Animals','Fungi','Prokaryotes'],answer:2},'Chitin walls are a key fungal feature. Plant cell walls contain cellulose; animal cells have no cell walls.');
add('kingdoms','fill','The cell walls of plants are made mainly of _____.',{answer:['cellulose']},'Cellulose is the key plant cell-wall material. Do not confuse it with chitin in fungal walls.');
add('kingdoms','multi','Which features are found in a typical bacterial cell?',{options:['Ribosomes','A nucleus','Circular DNA in the cytoplasm','Mitochondria'],answer:[0,2]},'Bacteria are prokaryotes. They have ribosomes and DNA but no nucleus or mitochondria.');
add('kingdoms','match','Match each organism to its kingdom.',{pairs:[['Amoeba','Protoctists'],['Yeast','Fungi'],['Oak tree','Plants'],['Bacterium','Prokaryotes']]},'Yeast is a unicellular fungus. Amoeba is a protoctist, not a prokaryote: it has a nucleus.');
add('kingdoms','matrix','Separate reliable rules from overgeneralisations.',{rows:[['All fungi are multicellular.',false],['Animal cells lack cell walls.',true],['Every plant cell contains chloroplasts.',false],['Some protoctists photosynthesise.',true]]},'Yeast is unicellular. Many root cells lack chloroplasts. Some protoctists have chloroplasts and photosynthesise.');
add('kingdoms','order','Put saprotrophic feeding into a logical sequence.',{items:['Absorb soluble products','Release digestive enzymes onto food','Break large molecules into soluble products'],answer:['Release digestive enzymes onto food','Break large molecules into soluble products','Absorb soluble products']},'Saprotrophic fungi digest food externally, then absorb the soluble products. They do not swallow the food.');
add('kingdoms','mcq','Which observation most directly distinguishes a prokaryotic cell from a protoctist cell?',{options:['Whether it is microscopic','Whether it has a nucleus','Whether it contains water','Whether it has a cell membrane'],answer:1},'Protoctists have nuclei. Prokaryotes lack a nucleus. Microscopic size and a cell membrane do not separate these groups.');
add('kingdoms','written','Compare a typical plant cell with a bacterial cell using three structural features.',{rubric:['Plant cells have a nucleus; bacterial cells do not.','Both have cell walls, but plant walls contain cellulose and bacterial walls do not.','Plant cells have mitochondria; bacterial cells do not.']},'Compare the same feature on both sides. Chloroplasts are also useful if you specify a photosynthetic plant cell.');
add('animals','mcq','An animal has eight jointed legs and no antennae. Which group fits?',{options:['Insects','Arachnids','Myriapods','Crustaceans'],answer:1},'Arachnids have four pairs of jointed legs and no antennae. Insects have three pairs of legs.');
add('animals','fill','An insect has _____ pairs of jointed legs.',{answer:['three','3']},'Three pairs means six legs. Distinguish the number of legs from the number of pairs.');
add('animals','multi','Which features are characteristic of mammals?',{options:['Hair','Mammary glands','Feathers','Three pairs of jointed legs'],answer:[0,1]},'Hair and milk-producing mammary glands are mammalian features. Feathers identify birds.');
add('animals','match','Match the vertebrate group to a characteristic feature.',{pairs:[['Birds','Feathers'],['Fish','Fins and gills'],['Amphibians','Typically moist, scaleless skin'],['Reptiles','Dry, scaly skin']]},'Use structural features rather than habitat alone. Many unrelated animals live in water or can fly.');
add('animals','matrix','Which animal statements stand up to scrutiny?',{rows:[['Arthropods have jointed legs.',true],['Every mammal gives birth to live young.',false],['Insects have one pair of antennae.',true],['Arachnids have three main body regions.',false]]},'Egg-laying mammals are exceptions to live birth. Arachnids have two main body regions; insects have three.');
add('animals','mcq','Which feature most reliably identifies a bird?',{options:['Can fly','Lives in trees','Has feathers','Lays eggs'],answer:2},'Some birds cannot fly, and many other animals lay eggs or live in trees. Feathers are the decisive clue.');
add('animals','fill','An arthropod with two pairs of antennae is classified here as a _____.',{answer:['crustacean']},'Two pairs of antennae distinguish crustaceans from the other arthropod groups studied here.');
add('animals','written','Compare an insect and an arachnid using legs, body regions and antennae.',{rubric:['Insects: three pairs of legs; arachnids: four pairs.','Insects: three main body regions; arachnids: two.','Insects: one pair of antennae; arachnids: no antennae.']},'Paired comparisons make each difference clear. State pairs or individual legs consistently.');
add('plants','mcq','A plant has fronds with spore-producing structures beneath them and no flowers. Which group fits?',{options:['Ferns','Monocotyledons','Dicotyledons','Fungi'],answer:0},'Ferns have roots, stems and leaves but reproduce by spores rather than seeds. Fungi are not plants.');
add('plants','fill','A monocotyledon seed has _____ cotyledon.',{answer:['one','1','a single']},'Mono means one. A cotyledon is a seed leaf.');
add('plants','multi','Which are typical features of monocotyledons?',{options:['Parallel leaf veins','Flower parts in multiples of three','Two cotyledons','Fibrous roots'],answer:[0,1,3]},'Monocots typically have parallel veins, flower parts in threes and fibrous roots, and have one cotyledon.');
add('plants','match','Match each feature to its description.',{pairs:[['Cotyledon','Seed leaf'],['Reticulate veins','A branching network'],['Frond','A fern leaf'],['Taproot','A main root with side branches']]},'These terms let you describe plant features precisely instead of relying on vague visual impressions.');
add('plants','matrix','Check the plant classification statements.',{rows:[['Ferns produce seeds inside flowers.',false],['Dicotyledons have two cotyledons.',true],['Monocot leaves typically have parallel veins.',true],['Both ferns and flowering plants have roots, stems and leaves.',true]]},'Ferns reproduce using spores. Flowering plants produce seeds. Both groups have differentiated plant organs.');
add('plants','mcq','A flowering plant has net-like leaf veins and flower parts in fives. Which group is most likely?',{options:['Monocotyledons','Dicotyledons','Ferns','Prokaryotes'],answer:1},'Net-like veins and flower parts in fours or fives are typical dicotyledon features.');
add('plants','fill','Ferns reproduce using _____ rather than seeds.',{answer:['spores','a spore','spore']},'Spores are reproductive units. Seeds contain an embryo; ferns do not produce seeds.');
add('plants','written','Give three paired differences between monocotyledons and dicotyledons.',{rubric:['Monocots have one cotyledon; dicots have two.','Monocots typically have parallel veins; dicots typically have net-like veins.','Monocots typically have flower parts in threes; dicots in fours or fives.']},'Typical root patterns can provide another comparison: fibrous roots versus a main taproot.');
add('keys','key','Identify the specimen: eight jointed legs, two main body regions, and no antennae.',{specimen:'8 legs · 2 body regions · no antennae',answer:'Arachnid'},'Follow the observed absence of antennae. Eight legs supports the arachnid identification.');
add('keys','mcq','Which pair is best for a dichotomous key?',{options:['Beautiful / unattractive','Large / very large','Wings present / wings absent','Fast / lives in water'],answer:2},'The choices should be clear, observable and mutually exclusive. Wings cannot be both present and absent on the same specimen.');
add('keys','multi','Which statements about viruses are correct?',{options:['They contain genetic material','They have a protein coat','They have their own ribosomes','They require host cells to replicate'],answer:[0,1,3]},'Viruses have genetic material and a protein coat, but lack ribosomes and depend on host machinery for replication.');
add('keys','fill','A virus has genetic material surrounded by a protein _____ .',{answer:['coat','capsid']},'The protein coat is called a capsid. Some viruses also have a lipid envelope.');
add('keys','matrix','Evaluate these key and virus statements.',{rows:[['Each step in a dichotomous key has two alternatives.',true],['Viruses carry out independent cellular respiration.',false],['Some viruses have a lipid envelope.',true],['Large and attractive are ideal key descriptions.',false]]},'Dichotomous means two-way branching. Viruses have no independent cellular metabolism. Key statements should avoid subjective descriptions.');

add('c3-diffusion','mcq','Which statement best defines diffusion?',{options:['Net movement of particles from high to low concentration due to random movement','Movement of water through a partially permeable membrane only','Movement from low to high concentration using energy','Movement of particles only through carrier proteins'],answer:0},'Diffusion is net movement down a concentration gradient as a result of random particle movement.');
add('c3-diffusion','fill','Diffusion is the _____ movement of particles from higher to lower concentration.',{answer:['net']},'Particles move randomly in both directions, but the overall or net movement is from higher to lower concentration.');
add('c3-diffusion','multi','Which statements about diffusion are correct?',{options:['It is passive','It depends on random particle movement','It always requires ATP','Net movement is down a concentration gradient'],answer:[0,1,3]},'Diffusion does not require ATP from respiration. Random motion produces net movement down the concentration gradient.');
add('c3-diffusion','match','Match each term to its meaning.',{pairs:[['Concentration gradient','Difference in concentration between two regions'],['Equilibrium','No net movement because concentrations are equal'],['Passive process','Does not require ATP from respiration'],['Net movement','Overall movement after both directions are considered']]},'These terms explain why particles can keep moving randomly even when net diffusion has stopped.');
add('c3-diffusion','matrix','Evaluate the diffusion statements.',{rows:[['Particles stop moving at equilibrium.',false],['Diffusion can occur without a cell membrane.',true],['Net diffusion is from higher to lower concentration.',true],['Diffusion requires energy released by respiration.',false]]},'At equilibrium particles still move randomly. Diffusion can occur in gases and liquids without a membrane and does not require respiratory energy.');
add('c3-diffusion','order','Put these events in a logical diffusion sequence.',{items:['Particles spread through random movement','A concentration difference exists','Net movement occurs from high to low concentration','Concentrations become equal'],answer:['A concentration difference exists','Particles spread through random movement','Net movement occurs from high to low concentration','Concentrations become equal']},'A gradient drives net movement until concentrations equalise; random movement continues throughout.');
add('c3-diffusion','mcq','At diffusion equilibrium, what is true?',{options:['Particles still move randomly but there is no net movement','All particles stop moving','Particles begin active transport','The concentration gradient becomes steeper'],answer:0},'Equal concentrations mean movements in opposite directions balance, so net movement is zero.');
add('c3-diffusion','written','Define diffusion using all of the key marking ideas.',{rubric:['Net movement of particles.','From a region of higher concentration to a region of lower concentration / down a concentration gradient.','Movement occurs as a result of random particle movement.']},'A high-quality definition includes net movement, the direction of the concentration gradient and random movement.');

add('c3-rates','fill','A greater difference in concentration creates a _____ concentration gradient.',{answer:['steeper','greater']},'A steeper concentration gradient increases the rate of net diffusion.');
add('c3-rates','multi','Which changes can increase the rate of diffusion?',{options:['Increase surface area','Increase temperature','Make the diffusion distance shorter','Reduce the concentration difference'],answer:[0,1,2]},'A larger surface area, higher temperature and shorter distance all increase diffusion rate. Reducing the concentration difference makes the gradient less steep.');
add('c3-rates','match','Match each change to why it speeds diffusion.',{pairs:[['Higher temperature','Particles have more kinetic energy'],['Larger surface area','More area is available for particles to cross'],['Shorter distance','Particles travel less far'],['Steeper gradient','Greater difference drives faster net movement']]},'Link every factor to a mechanism rather than memorising a list.');
add('c3-rates','matrix','Check the diffusion-rate statements.',{rows:[['A shorter diffusion distance can increase diffusion rate.',true],['A smaller concentration difference makes net diffusion faster.',false],['A larger surface area can increase diffusion rate.',true],['Lower temperature gives particles more kinetic energy.',false]]},'Faster diffusion is associated with shorter distance, larger surface area, higher temperature and a steeper gradient.');
add('c3-rates','order','Arrange the explanation for why a smaller agar cube changes colour faster.',{items:['Acid reaches the centre sooner','The cube has a larger surface-area-to-volume ratio','Acid diffuses in from the surface'],answer:['The cube has a larger surface-area-to-volume ratio','Acid diffuses in from the surface','Acid reaches the centre sooner']},'A larger surface-area-to-volume ratio and shorter path to the centre make the smaller cube fully penetrated sooner.');
add('c3-rates','mcq','Two agar cubes are placed in acid. Which is expected to become colourless throughout first?',{options:['The smaller cube','The larger cube','Both always at exactly the same time','Neither, because diffusion needs ATP'],answer:0},'Smaller cubes have a larger surface-area-to-volume ratio and a shorter distance to the centre.');
add('c3-rates','written','Explain how temperature and surface area affect the rate of diffusion.',{rubric:['Higher temperature gives particles more kinetic energy so they move faster.','Faster particle movement increases diffusion rate.','Larger surface area provides more area for particles to cross at the same time, increasing diffusion rate.']},'Explain the mechanism behind each factor, not only whether the rate rises or falls.');

add('c3-osmosis','mcq','Which statement best defines osmosis?',{options:['Net movement of water from higher to lower water potential through a partially permeable membrane','Movement of any particle from high to low concentration','Movement of ions against a gradient using energy','Movement of water from low to high water potential without a membrane'],answer:0},'Osmosis is specifically water moving down a water-potential gradient through a partially permeable membrane.');
add('c3-osmosis','fill','Adding solute to pure water _____ its water potential.',{answer:['lowers','decreases','reduces']},'Pure water has the highest water potential. Dissolved solutes lower water potential.');
add('c3-osmosis','multi','Which features are required in the definition of osmosis?',{options:['Water molecules','Higher to lower water potential','A partially permeable membrane','Energy from respiration'],answer:[0,1,2]},'Osmosis requires water, a water-potential gradient and a partially permeable membrane; it is passive.');
add('c3-osmosis','match','Match each osmosis term to the best description.',{pairs:[['Higher water potential','More dilute solution'],['Lower water potential','More concentrated solution'],['Partially permeable membrane','Allows some molecules such as water through'],['Osmosis','Net movement of water down a water-potential gradient']]},'These links help you infer water direction from the relative concentration of solutions.');
add('c3-osmosis','matrix','Evaluate the osmosis statements.',{rows:[['Osmosis refers only to water molecules.',true],['Osmosis requires a partially permeable membrane.',true],['Water moves from lower to higher water potential.',false],['Osmosis requires ATP from respiration.',false]]},'Water moves from higher to lower water potential through a partially permeable membrane, without ATP.');
add('c3-osmosis','order','Put these steps in the correct osmosis sequence.',{items:['Water crosses the partially permeable membrane','A water-potential difference exists','Net water movement is towards lower water potential'],answer:['A water-potential difference exists','Water crosses the partially permeable membrane','Net water movement is towards lower water potential']},'A difference in water potential creates the direction for net water movement across the membrane.');
add('c3-osmosis','mcq','A membrane separates pure water from a concentrated sucrose solution. In which direction is net water movement?',{options:['From pure water into the sucrose solution','From the sucrose solution into pure water','There is never any movement','Sucrose moves instead because osmosis is solute movement'],answer:0},'Pure water has higher water potential, so net water movement is towards the lower water potential of the concentrated solution.');
add('c3-osmosis','written','Define osmosis precisely.',{rubric:['Net movement of water molecules.','From a region of higher water potential to a region of lower water potential / down a water-potential gradient.','Through a partially permeable membrane.']},'A complete definition names water, water potential and the partially permeable membrane.');

add('c3-cell-effects','mcq','What happens to a plant cell placed in a solution with lower water potential than its cell sap?',{options:['Water leaves and the cell may become plasmolysed','Water enters and the cell bursts','The cell performs active transport of water','The cell becomes more turgid because solute enters'],answer:0},'Water moves out by osmosis; the vacuole and cytoplasm shrink and the membrane may pull away from the cell wall.');
add('c3-cell-effects','mcq','What may happen to an animal cell placed in pure water?',{options:['It swells and may burst','It becomes plasmolysed because it has a cell wall','It loses water and crenates','It becomes turgid without changing size'],answer:0},'Water enters an animal cell by osmosis. Without a cell wall, excessive entry can cause lysis.');
add('c3-cell-effects','match','Match each situation to the cell response.',{pairs:[['Plant cell in dilute solution','Turgid'],['Plant cell in concentrated solution','Plasmolysed / flaccid'],['Animal cell in dilute solution','Swells and may burst'],['Animal cell in concentrated solution','Shrinks / crenates']]},'The presence of a cell wall makes plant-cell responses different from animal-cell responses.');
add('c3-cell-effects','matrix','Check the osmosis-in-cells statements.',{rows:[['A plant cell wall helps prevent bursting when water enters.',true],['Plasmolysis involves the membrane pulling away from the cell wall.',true],['A crenated animal cell has gained water.',false],['Turgor can provide mechanical support to plant tissue.',true]]},'Crenation is caused by water loss. Plant cell walls resist expansion and turgor helps support tissues.');
add('c3-cell-effects','fill','A plant cell that has taken in water and is pressing against its cell wall is described as _____.',{answer:['turgid']},'A turgid cell has a full vacuole and cytoplasm pressing against the cell wall.');
add('c3-cell-effects','order','Arrange the events leading to plasmolysis.',{items:['The membrane pulls away from the cell wall','Water leaves the cell by osmosis','The surrounding solution has lower water potential','The vacuole and cytoplasm shrink'],answer:['The surrounding solution has lower water potential','Water leaves the cell by osmosis','The vacuole and cytoplasm shrink','The membrane pulls away from the cell wall']},'A lower external water potential causes water loss, shrinkage of the cell contents and eventual separation of the membrane from the wall.');
add('c3-cell-effects','multi','Which changes can occur when a plant cell loses water by osmosis?',{options:['Vacuole shrinks','Cytoplasm shrinks','Cell becomes flaccid','Cell wall dissolves'],answer:[0,1,2]},'Water loss reduces vacuole and cytoplasm volume and can make the cell flaccid or plasmolysed. The cell wall remains.');
add('c3-cell-effects','written','Explain what happens to a plant cell placed in a solution with lower water potential than its cell sap.',{rubric:['Water leaves the cell / vacuole by osmosis down a water-potential gradient.','Water crosses a partially permeable cell membrane.','The vacuole and cytoplasm shrink.','The cell membrane pulls away from the cell wall and the cell becomes plasmolysed / flaccid.']},'Connect the external water potential to water movement and then to the structural changes in the cell.');

add('c3-active','mcq','Which statement about active transport is correct?',{options:['It uses carrier proteins and energy from respiration','It moves only water down a water-potential gradient','It always moves from high to low concentration','It is passive and stops when ATP is available'],answer:0},'Active transport uses membrane carrier proteins and energy from respiration to move substances against a concentration gradient.');
add('c3-active','fill','The energy needed for active transport is released by _____.',{answer:['respiration','aerobic respiration']},'Respiration releases energy that can be used by carrier proteins for active transport.');
add('c3-active','match','Match each active-transport feature to its role.',{pairs:[['Carrier protein','Binds a specific ion or molecule and changes shape'],['Mitochondrion','Releases energy by aerobic respiration'],['Root hair cell','Absorbs mineral ions from soil'],['Against the gradient','Movement from lower to higher concentration']]},'Active transport links a concentration direction, membrane proteins and energy supply.');
add('c3-active','matrix','Evaluate the active-transport statements.',{rows:[['Active transport can move particles from lower to higher concentration.',true],['Active transport requires energy from respiration.',true],['Simple diffusion always requires carrier proteins.',false],['Root hair cells can use active transport to absorb mineral ions.',true]]},'Active transport is energy-dependent and can move against a concentration gradient; simple diffusion does not require carrier proteins.');
add('c3-active','multi','Which adaptations help a root hair cell absorb mineral ions by active transport?',{options:['Long hair-like extension giving a large surface area','Many mitochondria','Carrier proteins in the cell membrane','A thick waxy cuticle around the hair'],answer:[0,1,2]},'Large surface area aids uptake, mitochondria supply energy and carrier proteins move ions across the membrane.');
add('c3-active','mcq','Which direction can active transport achieve?',{options:['From lower concentration to higher concentration','Only from higher concentration to lower concentration','Only water from high to low water potential','No movement across a membrane'],answer:0},'Active transport can move substances against the concentration gradient, from lower to higher concentration.');
add('c3-active','order','Arrange a simplified active-transport mechanism.',{items:['Carrier protein changes shape using energy','A specific ion binds to a carrier protein','The ion is released on the other side of the membrane','Energy is supplied from respiration'],answer:['A specific ion binds to a carrier protein','Energy is supplied from respiration','Carrier protein changes shape using energy','The ion is released on the other side of the membrane']},'Specific binding, energy supply and a shape change in the carrier protein move the substance across the membrane.');
add('c3-active','written','Compare diffusion with active transport.',{rubric:['Diffusion moves particles down a concentration gradient; active transport can move against the gradient.','Diffusion does not require energy from respiration; active transport requires energy / ATP from respiration.','Active transport uses carrier proteins / protein pumps; simple diffusion does not require them.','Both involve movement of substances and can occur across cell membranes.']},'A strong comparison states paired differences and at least one valid similarity.');

add('c3-practical','mcq','Why should potato strips be blotted dry before their final mass is measured?',{options:['To remove surface solution that would add extra mass','To stop all osmosis permanently','To increase the potato concentration','To make the cell walls disappear'],answer:0},'Blotting removes external liquid so the measured mass change more accurately reflects water gained or lost by the potato tissue.');
add('c3-practical','fill','A potato piece changes from 5.0 g to 6.0 g. Its percentage change in mass is _____%.',{answer:['20','20.0','+20','+20.0'],hint:'(final − initial) ÷ initial × 100'},'(6.0 − 5.0) ÷ 5.0 × 100 = 20%.');
add('c3-practical','mcq','On a graph of percentage mass change against solution concentration, what does the x-intercept where change = 0 indicate?',{options:['The isotonic concentration, approximately equal to the cell sap concentration','The concentration that always causes lysis','The fastest diffusion rate','The maximum possible potato mass'],answer:0},'At zero percentage change there is no net water gain or loss, so the external solution is isotonic with the potato tissue.');
add('c3-practical','match','Match each practical feature to its purpose.',{pairs:[['Blot potato before weighing','Remove surface liquid'],['Use equal-sized potato pieces','Improve comparability'],['Keep pieces submerged','Ensure consistent exposure to solution'],['Cover containers','Reduce evaporation and concentration change']]},'Reliable osmosis experiments control variables and avoid adding mass from surface liquid or changing the solution concentration.');
add('c3-practical','matrix','Check the practical statements.',{rows:[['A positive percentage mass change indicates water gain.',true],['A negative percentage mass change indicates water loss.',true],['Evaporation can change the concentration of the solution.',true],['Different potato sizes are ideal because they add variation.',false]]},'Control the size of the tissue and minimise evaporation so concentration is the intended independent variable.');
add('c3-practical','order','Put the potato-osmosis method in a sensible order.',{items:['Blot and measure final mass','Place equal potato pieces in different concentrations','Measure initial mass','Calculate percentage change'],answer:['Measure initial mass','Place equal potato pieces in different concentrations','Blot and measure final mass','Calculate percentage change']},'Measure before treatment, expose samples consistently, remove surface liquid before final weighing, then calculate percentage change.');
add('c3-practical','mcq','Why is Visking tubing useful in osmosis investigations?',{options:['It models a partially permeable membrane','It supplies ATP to potato cells','It is completely impermeable to water','It measures temperature automatically'],answer:0},'Visking tubing can allow small molecules such as water through while restricting larger solutes, modelling a partially permeable membrane.');
add('c3-practical','written','Describe how to investigate the effect of solution concentration on potato mass by osmosis.',{rubric:['Prepare equal-sized potato pieces and measure their initial mass.','Place them in known different solution concentrations for the same time, using comparable volumes and temperature.','Keep the pieces submerged and minimise evaporation.','Remove pieces, blot dry to remove surface solution, then measure final mass.','Calculate percentage change in mass and compare or plot against concentration.']},'A valid method controls variables, prevents surface liquid from distorting mass measurements and uses percentage change to compare samples.');

add('c4-elements','match','Match each biological molecule to the element set given in the guide.',{pairs:[['Carbohydrates','C, H, O'],['Fats / lipids','C, H, O'],['Proteins','C, H, O, N, usually S'],['DNA','C, H, O, N, P']]},'Keep chemical elements separate from molecular building blocks.');
add('c4-elements','matrix','Check the element statements.',{rows:[['Carbohydrates contain carbon, hydrogen and oxygen.',true],['Proteins are distinguished from carbohydrates by containing nitrogen.',true],['DNA is listed as containing phosphorus.',true],['Amino acids are chemical elements.',false]]},'Amino acids are building blocks of proteins, not chemical elements.');

add('c4-elements','order','Arrange these element sets from the fewest different element symbols to the most.',{items:['C, H, O, N, P','C, H, O','C, H, O, N'],answer:['C, H, O','C, H, O, N','C, H, O, N, P']},'Carbohydrates and fats use CHO; proteins add nitrogen; DNA also includes phosphorus in the guide.');
add('c4-elements','written','Explain how the elemental composition of proteins differs from carbohydrates and fats, and state the elements listed for DNA.',{rubric:['Carbohydrates and fats contain carbon, hydrogen and oxygen.','Proteins also contain nitrogen and usually sulfur.','DNA contains carbon, hydrogen, oxygen, nitrogen and phosphorus.','Do not confuse elements with building blocks such as amino acids.']},'Use element names or symbols accurately and keep elemental composition distinct from sub-units.');

add('c4-carbs','mcq','Which molecule is the monosaccharide named as a basic unit of several carbohydrates?',{options:['Glucose','Glycerol','Amino acid','Fatty acid'],answer:0},'Glucose is the simple sugar named as the building block for starch, glycogen and cellulose.');
add('c4-carbs','fill','Two glucose molecules join to form the disaccharide _____.',{answer:['maltose']},'The guide gives maltose as glucose + glucose.');
add('c4-carbs','match','Match each carbohydrate to its description.',{pairs:[['Starch','Insoluble energy store in plant cells'],['Glycogen','Insoluble energy store in animal cells'],['Cellulose','Structural polymer in plant cell walls'],['Glucose','Monosaccharide / simple sugar']]},'Starch and glycogen store energy; cellulose has a structural role; glucose is a monosaccharide.');
add('c4-carbs','multi','Which statements about carbohydrates are supported by the guide?',{options:['Starch is an insoluble plant energy store','Glycogen is stored in liver and muscle cells','Cellulose forms plant cell walls','Starch is made from amino acids'],answer:[0,1,2]},'Starch, glycogen and cellulose are carbohydrates built from glucose; amino acids build proteins.');
add('c4-carbs','matrix','Evaluate the carbohydrate statements.',{rows:[['Sucrose is described as glucose + fructose.',true],['Glycogen is an energy-storage molecule in animals.',true],['Cellulose is a tough structural polymer.',true],['Starch is highly soluble and strongly affects osmosis.',false]]},'The guide specifically describes starch as insoluble and notes that it therefore does not affect osmosis.');
add('c4-carbs','mcq','Why is starch suitable for storage in plant cells according to the guide?',{options:['It is insoluble and does not affect osmosis','It contains nitrogen','It is a lipid','It is made from glycerol'],answer:0},'The guide links the insolubility of starch with its not affecting osmosis.');
add('c4-carbs','order','Arrange the description from small unit to large storage molecule in plants.',{items:['Starch','Glucose molecules join together','Glucose'],answer:['Glucose','Glucose molecules join together','Starch']},'Glucose units join together to form the large polysaccharide starch.');
add('c4-carbs','written','Compare starch, glycogen and cellulose using their roles and where they are found.',{rubric:['Starch is an insoluble energy-storage molecule in plant cells.','Glycogen is an insoluble energy-storage molecule in animal cells and is stored in liver and muscle cells.','Cellulose is a tough structural polymer forming plant cell walls.','All are described as large carbohydrate molecules built from glucose.']},'A strong comparison pairs each polymer with its role and biological location.');

add('c4-lipids-proteins','mcq','What are the building blocks of one fat or oil molecule as described in the guide?',{options:['One glycerol and three fatty acids','Three glycerol and one fatty acid','Only glucose','Only amino acids'],answer:0},'A lipid is built from one glycerol molecule joined to three fatty acid molecules.');
add('c4-lipids-proteins','fill','Proteins are long chains of _____.',{answer:['amino acids','amino acid']},'Amino acids are the building blocks of proteins.');
add('c4-lipids-proteins','match','Match each molecule or feature to its role.',{pairs:[['Glycerol + fatty acids','Build fats and oils'],['Amino-acid sequence','Determines protein folding'],['Protein 3D shape','Determines protein function'],['Haemoglobin','Protein involved in oxygen transport']]},'The guide links molecular composition to three-dimensional shape and then to function.');
add('c4-lipids-proteins','multi','Which functions are listed for lipids?',{options:['High-energy storage','Insulation under skin','Waterproof coatings','Cell membranes','Coding DNA bases'],answer:[0,1,2,3]},'The guide lists energy storage, insulation, waterproof coatings and cell membranes as lipid functions.');
add('c4-lipids-proteins','matrix','Check these lipid and protein statements.',{rows:[['Fats are solid at room temperature while oils are liquid.',true],['There are 20 different types of amino acids stated in the guide.',true],['Protein function is unrelated to its 3D shape.',false],['Enzymes and antibodies are examples of proteins.',true]]},'Protein shape is central to function; the guide names enzymes and antibodies among protein roles.');
add('c4-lipids-proteins','mcq','What determines how a protein folds into its specific three-dimensional shape?',{options:['The precise sequence of amino acids','The number of glycerol molecules','The iodine colour','The amount of cellulose'],answer:0},'The guide states that the amino-acid sequence dictates protein folding.');
add('c4-lipids-proteins','order','Arrange the protein relationship from information to function.',{items:['Specific protein function','Specific 3D shape','Specific amino-acid sequence'],answer:['Specific amino-acid sequence','Specific 3D shape','Specific protein function']},'Sequence determines folding and 3D shape; the shape determines function.');
add('c4-lipids-proteins','written','Explain how amino-acid sequence can determine the function of a protein such as an enzyme.',{rubric:['Proteins are chains of amino acids.','The precise amino-acid sequence determines how the chain folds.','Folding produces a specific 3D shape.','For an enzyme, the 3D shape determines the complementary active-site shape and therefore function.']},'Build the explanation as a sequence: amino-acid order → folding → 3D shape → function.');

add('c4-tests-core','match','Match the test to its positive result.',{pairs:[['Iodine test','Blue-black'],['Benedict test','Green to brick-red precipitate after heating'],['Biuret test','Violet / purple / mauve'],['Reducing sugar negative Benedict test','Remains blue after heating']]},'Each food test has a characteristic starting colour and positive result.');
add('c4-tests-core','multi','Which steps belong to a Benedict test for reducing sugar?',{options:['Add Benedict solution','Heat in a hot water bath','Observe for green, yellow, orange or brick-red change','Heat directly over a Bunsen flame'],answer:[0,1,2]},'Benedict testing requires a hot water bath; the guide warns against direct heating over a Bunsen flame.');
add('c4-tests-core','matrix','Evaluate these food-test statements.',{rows:[['Benedict solution starts blue.',true],['A brick-red precipitate indicates a high reducing-sugar concentration.',true],['Biuret reagent is the test for starch.',false],['Iodine solution can be added directly to the sample for a starch test.',true]]},'Iodine tests starch; Biuret tests protein; Benedict tests reducing sugar with heating.');
add('c4-tests-core','order','Put the Benedict test into a sensible sequence.',{items:['Observe the final colour / precipitate','Add Benedict solution to the sample','Place the tube in a hot water bath'],answer:['Add Benedict solution to the sample','Place the tube in a hot water bath','Observe the final colour / precipitate']},'The reagent is added before heating; the result is read after the hot-water-bath step.');

add('c5-catalysts','mcq','Which statement best defines a catalyst?',{options:['A substance that increases reaction rate without being changed or consumed','A substance that supplies energy and is used up','A product formed at the end of a reaction','A molecule that always slows reactions'],answer:0},'A catalyst speeds a reaction without being changed or consumed by that reaction.');

add('c5-catalysts','match','Match each enzyme term to its meaning.',{pairs:[['Catalyst','Speeds a reaction without being consumed'],['Enzyme','Biological catalyst made of protein'],['Substrate','Reactant that binds to an enzyme'],['Metabolism','Chemical reactions occurring in living cells']]},'These terms distinguish the catalyst itself from the reactant and the wider set of cellular reactions.');
add('c5-catalysts','matrix','Check the catalyst statements.',{rows:[['An enzyme can catalyse repeated reactions.',true],['Enzymes are used up as products form.',false],['Enzymes help reactions proceed fast enough at biological temperatures.',true],['All catalysts are living cells.',false]]},'Enzymes are molecules, not living cells, and are not used up by the reactions they catalyse.');
