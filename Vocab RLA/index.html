<script id="vocabulary-data" type="application/json">[{"id":"compelling","word":"Compelling","category":"Academic adjectives","meaning":"Highly convincing or powerful enough to attract serious attention.","example":"The study presents compelling evidence that smaller classes can improve learning outcomes.","clue":"An argument so convincing that it demands serious consideration.","tip":"A compelling argument strongly persuades; a compelling story may also hold your attention.","aliases":[],"confusable":"Persuasive"},{"id":"persuasive","word":"Persuasive","category":"Academic adjectives","meaning":"Able to convince someone to accept a view or take action.","example":"The author offers a persuasive argument for stronger protections of student data.","clue":"Effective at convincing an audience to accept a position.","tip":"Think of persuading an audience: persuasive writing changes minds through reasons and evidence.","aliases":[],"confusable":"Compelling"},{"id":"flawed","word":"Flawed","category":"Academic adjectives","meaning":"Containing errors or weaknesses that reduce quality or validity.","example":"The policy rests on a flawed assumption that all students have reliable internet access.","clue":"Containing a weakness or error that undermines its quality.","tip":"A flaw is a defect; a flawed argument may contain useful ideas despite its weaknesses.","aliases":[],"confusable":"Flawless"},{"id":"insubstantive","word":"Insubstantive","category":"Academic adjectives","meaning":"Lacking meaningful content, strong reasoning, or real importance.","example":"The committee rejected an insubstantive proposal that offered slogans but no workable education reforms.","clue":"Offering little meaningful content or serious reasoning.","tip":"Substance is meaningful content; the prefix in- signals its absence.","aliases":[],"confusable":"Substantial"},{"id":"lucid","word":"Lucid","category":"Academic adjectives","meaning":"Clearly expressed and easy to understand.","example":"The report provides a lucid explanation of how schools store personal information.","clue":"Clear enough for readers to understand without confusion.","tip":"Lucid concerns clarity of expression; coherent concerns how ideas fit together.","aliases":[],"confusable":"Coherent"},{"id":"coherent","word":"Coherent","category":"Academic adjectives","meaning":"Logically connected and consistent, forming a unified whole.","example":"A coherent education strategy links funding, teacher training, and student support.","clue":"Having parts that fit together logically into one consistent whole.","tip":"Coherent ideas connect logically; lucid ideas are expressed clearly.","aliases":[],"confusable":"Lucid"},{"id":"biased","word":"Biased","category":"Academic adjectives","meaning":"Unfairly influenced by a preference or prejudice.","example":"A biased dataset can cause an admissions system to disadvantage particular groups.","clue":"Distorted by a preference or prejudice instead of treating evidence fairly.","tip":"Bias can arise unintentionally; it does not always involve political allegiance.","aliases":[],"confusable":"Partisan"},{"id":"partisan","word":"Partisan","category":"Academic adjectives","meaning":"Strongly supporting a particular political party, group, or cause.","example":"Partisan disagreements can delay the adoption of necessary privacy legislation.","clue":"Showing allegiance to one political party or competing group.","tip":"Connect partisan with party allegiance; biased is broader and includes many kinds of prejudice.","aliases":[],"confusable":"Biased"},{"id":"objective","word":"Objective","category":"Academic adjectives","meaning":"Based on facts and evidence rather than personal feelings or preferences.","example":"An objective evaluation should compare the policy's stated goals with its measured outcomes.","clue":"Guided by facts and evidence instead of personal feelings.","tip":"Objective concerns evidence and judgment; impartial concerns fair treatment of competing sides.","aliases":[],"confusable":"Impartial"},{"id":"impartial","word":"Impartial","category":"Academic adjectives","meaning":"Treating competing people or views fairly without favoring one side.","example":"An impartial panel should assess complaints from both students and technology providers.","clue":"Fair to competing sides, without favoring either one.","tip":"An impartial referee favors no side; objective reasoning relies on evidence.","aliases":[],"confusable":"Objective"},{"id":"astute","word":"Astute","category":"Academic adjectives","meaning":"Showing sharp judgment and a good understanding of a situation.","example":"An astute analysis considers how privacy rules affect both innovation and public trust.","clue":"Quick to notice important details and judge their implications wisely.","tip":"An astute observer sees what others miss and understands why it matters.","aliases":[],"confusable":null},{"id":"pragmatic","word":"Pragmatic","category":"Academic adjectives","meaning":"Focused on practical results rather than theory or ideals alone.","example":"A pragmatic approach combines clear privacy standards with affordable tools for schools.","clue":"Choosing what works in practice while accounting for real constraints.","tip":"Pragmatic decisions ask whether a solution will work under actual conditions.","aliases":[],"confusable":null},{"id":"empirical","word":"Empirical","category":"Academic adjectives","meaning":"Based on observation or experimentation rather than theory alone.","example":"Empirical research can test whether digital tutoring improves students' reading skills.","clue":"Supported by observations, measurements, or experiments.","tip":"Empirical describes how evidence is obtained; factual describes its relationship to true facts.","aliases":[],"confusable":"Factual"},{"id":"factual","word":"Factual","category":"Academic adjectives","meaning":"Based on or concerned with facts rather than opinion or invention.","example":"The essay separates factual descriptions of the law from the author's policy recommendations.","clue":"Concerning what is actually true, rather than opinion or invention.","tip":"A factual statement concerns facts; an empirical study gathers evidence through observation or experiment.","aliases":[],"confusable":"Empirical"},{"id":"negligible","word":"Negligible","category":"Academic adjectives","meaning":"So small or unimportant that it need not be considered.","example":"The additional storage cost was negligible compared with the project's overall budget.","clue":"Too small to have a meaningful effect or deserve consideration.","tip":"Negligible suggests a quantity can reasonably be ignored; marginal usually means merely small.","aliases":[],"confusable":"Marginal"},{"id":"marginal","word":"Marginal","category":"Academic adjectives","meaning":"Small or slight in amount, degree, or importance.","example":"The revised interface produced only a marginal improvement in student engagement.","clue":"Small or slight, rather than large or substantial.","tip":"A marginal improvement is slight; a negligible one is small enough to disregard.","aliases":[],"confusable":"Negligible"},{"id":"substantial","word":"Substantial","category":"Academic adjectives","meaning":"Considerable in size, amount, or importance.","example":"The program requires substantial investment in teacher training and accessible technology.","clue":"Large enough in amount or importance to deserve serious attention.","tip":"Substantial means considerable; it does not necessarily mean more than half.","aliases":[],"confusable":"Marginal"},{"id":"paramount","word":"Paramount","category":"Academic adjectives","meaning":"More important than anything else in a particular situation.","example":"Protecting children's privacy should be paramount when schools select digital learning tools.","clue":"Ranking above every other concern in importance.","tip":"Think of the highest priority: paramount outranks other concerns.","aliases":[],"confusable":null},{"id":"credible","word":"Credible","category":"Academic adjectives","meaning":"Believable or worthy of trust.","example":"A credible evaluation explains its methods and acknowledges the limits of its findings.","clue":"Believable because there is good reason to trust it.","tip":"Credible means believable; authoritative adds recognized expertise or official standing.","aliases":[],"confusable":"Authoritative"},{"id":"authoritative","word":"Authoritative","category":"Academic adjectives","meaning":"Recognized as reliable because of expertise or official standing.","example":"An authoritative review can help policymakers assess conflicting claims about educational technology.","clue":"Carrying recognized expertise or official standing as a reliable source.","tip":"An authoritative source has recognized expertise or authority; a credible source is believable.","aliases":[],"confusable":"Credible"},{"id":"ambiguous","word":"Ambiguous","category":"Academic adjectives","meaning":"Open to more than one interpretation; unclear in meaning.","example":"Ambiguous consent forms can leave families uncertain about how their information will be used.","clue":"Allowing more than one reasonable interpretation.","tip":"Ambiguous wording has multiple possible meanings; it is not simply unfamiliar vocabulary.","aliases":[],"confusable":"Lucid"},{"id":"flawless","word":"Flawless","category":"Academic adjectives","meaning":"Without errors, defects, or imperfections.","example":"A flawless technical design would still require public scrutiny of its privacy implications.","clue":"Containing no errors, defects, or imperfections.","tip":"Flawless describes perfection in a relevant respect; it does not guarantee an ethically sound purpose.","aliases":[],"confusable":"Flawed"},{"id":"irrefutable","word":"Irrefutable","category":"Academic adjectives","meaning":"Impossible to disprove or convincingly deny.","example":"Verified records provide irrefutable evidence that the platform retained data from deleted student accounts.","clue":"So firmly established that it cannot be disproved.","tip":"Refute means disprove; irrefutable makes a stronger claim than merely persuasive.","aliases":[],"confusable":"Persuasive"},{"id":"economic","word":"Economic","category":"Academic adjectives","meaning":"Relating to the economy, production, consumption, or material resources.","example":"Economic conditions can influence how much families spend on private tutoring.","clue":"Relating to the economy and the production or use of resources.","tip":"Economic concerns the economy; economical means avoiding waste; fiscal concerns government budgets and taxation.","aliases":[],"confusable":"Fiscal"},{"id":"fiscal","word":"Fiscal","category":"Academic adjectives","meaning":"Relating to government revenue, spending, taxation, or budgets.","example":"Fiscal constraints may limit the government's ability to expand early childhood education.","clue":"Relating to government budgets, spending, and taxation.","tip":"Fiscal policy uses government spending and taxation; monetary policy concerns money and interest rates.","aliases":[],"confusable":"Economic"},{"id":"socioeconomic","word":"Socioeconomic","category":"Academic adjectives","meaning":"Relating to the interaction of social and economic factors.","example":"Socioeconomic differences can affect students' access to quiet study spaces and reliable internet.","clue":"Concerning the connection between social circumstances and economic conditions.","tip":"Combine social and economic: socioeconomic analysis connects factors such as income, education, and social position.","aliases":[],"confusable":"Societal"},{"id":"societal","word":"Societal","category":"Academic adjectives","meaning":"Relating to society as a whole.","example":"The societal effects of automated decision systems extend beyond their immediate users.","clue":"Concerning society as a whole rather than a single individual.","tip":"Societal concerns society broadly; socioeconomic specifically connects social and economic conditions.","aliases":[],"confusable":"Socioeconomic"},{"id":"detrimental","word":"Detrimental","category":"Academic adjectives","meaning":"Causing harm or damage.","example":"Excessive surveillance may have detrimental effects on students' trust in their schools.","clue":"Actively harmful to someone or something.","tip":"Detrimental stresses harm; adverse can describe either harmful or unfavorable conditions.","aliases":[],"confusable":"Adverse"},{"id":"adverse","word":"Adverse","category":"Academic adjectives","meaning":"Unfavorable or harmful.","example":"The evaluation should examine any adverse effects of the policy on disadvantaged students.","clue":"Unfavorable or harmful in its conditions or effects.","tip":"Adverse means unfavorable or harmful; averse means reluctant or strongly opposed.","aliases":[],"confusable":"Detrimental"},{"id":"advantageous","word":"Advantageous","category":"Academic adjectives","meaning":"Providing a benefit or improving someone's position.","example":"Flexible licensing terms can be advantageous for schools with limited technology budgets.","clue":"Giving someone a benefit or a favorable position.","tip":"Advantageous often highlights a favorable position or opportunity; beneficial broadly emphasizes a positive effect.","aliases":[],"confusable":"Beneficial"},{"id":"beneficial","word":"Beneficial","category":"Academic adjectives","meaning":"Producing a helpful or positive effect.","example":"Regular feedback can be beneficial for students developing academic writing skills.","clue":"Having a helpful or positive effect on someone or something.","tip":"Beneficial emphasizes a positive effect; it overlaps with advantageous in many contexts.","aliases":[],"confusable":"Advantageous"},{"id":"disproportionate","word":"Disproportionate","category":"Academic adjectives","meaning":"Too large or too small relative to something else.","example":"Small schools may bear a disproportionate share of the costs of meeting new reporting requirements.","clue":"Out of proportion to the relevant size, amount, or comparison.","tip":"Disproportionate describes an imbalance; whether that imbalance is unfair requires a separate judgment.","aliases":[],"confusable":"Inequitable"},{"id":"inequitable","word":"Inequitable","category":"Academic adjectives","meaning":"Unfair or unjust in how people are treated or resources are distributed.","example":"An inequitable funding system can leave schools in poorer communities without essential resources.","clue":"Unfair in its treatment of people or distribution of resources.","tip":"Inequitable means unfair; unequal outcomes are not automatically inequitable.","aliases":[],"confusable":"Disproportionate"},{"id":"substantially","word":"Substantially","category":"Academic adverbs","meaning":"To a considerable extent or degree.","example":"The new funding model substantially increased support for schools in remote areas.","clue":"To a considerable degree or by a large amount.","tip":"Substantially usually describes considerable extent; significance can instead concern importance or statistical evidence.","aliases":[],"confusable":"Significantly"},{"id":"significantly","word":"Significantly","category":"Academic adverbs","meaning":"To an important or noteworthy degree; sometimes with statistical significance.","example":"The new rule significantly changes how schools obtain consent for sharing student data.","clue":"To a degree that matters or is noteworthy.","tip":"In research, significantly may refer to a statistical test; it does not necessarily mean a large effect.","aliases":[],"confusable":"Substantially"},{"id":"entirely","word":"Entirely","category":"Academic adverbs","meaning":"Completely or in every respect.","example":"The proposal relies entirely on voluntary reporting by technology companies.","clue":"Completely, without any part or exception left over.","tip":"Entirely is an absolute: entirely online means every part happens online.","aliases":[],"confusable":"Predominantly"},{"id":"fundamentally","word":"Fundamentally","category":"Academic adverbs","meaning":"At the most basic or essential level.","example":"The reform fundamentally changes the relationship between public schools and private technology providers.","clue":"At the underlying level that shapes everything else.","tip":"Fundamentally points to foundations or essential nature, rather than simply the size of a change.","aliases":[],"confusable":null},{"id":"predominantly","word":"Predominantly","category":"Academic adverbs","meaning":"Mostly or mainly; to the greatest extent.","example":"The survey sample consisted predominantly of students attending urban public schools.","clue":"Mostly, with one type or feature making up the greater part.","tip":"Predominantly often concerns the largest share; principally can identify the main purpose or cause.","aliases":[],"confusable":"Principally"},{"id":"principally","word":"Principally","category":"Academic adverbs","meaning":"Mainly or chiefly.","example":"The policy was designed principally to reduce barriers to higher education.","clue":"Chiefly, especially with reference to the main purpose, reason, or focus.","tip":"Principally means mainly; principal means main, while principle means a rule or belief.","aliases":[],"confusable":"Predominantly"},{"id":"marginally","word":"Marginally","category":"Academic adverbs","meaning":"By a small or slight amount.","example":"Students using the revised platform completed assignments marginally faster than those using the original version.","clue":"By only a small or slight amount.","tip":"Marginally signals a slight difference; negligibly suggests a difference small enough to disregard.","aliases":[],"confusable":"Negligibly"},{"id":"negligibly","word":"Negligibly","category":"Academic adverbs","meaning":"To an extent so small that it need not be considered.","example":"The security update increased processing time negligibly while improving protection of student records.","clue":"To a degree too small to have a meaningful effect.","tip":"Negligibly means the effect is small enough to ignore, not merely smaller than another effect.","aliases":[],"confusable":"Marginally"},{"id":"manifestly","word":"Manifestly","category":"Academic adverbs","meaning":"Clearly and obviously.","example":"A policy that excludes students without personal devices is manifestly unfair.","clue":"In a way that is plainly obvious.","tip":"Manifestly emphasizes obviousness; evidently often presents a conclusion supported by available evidence.","aliases":[],"confusable":"Evidently"},{"id":"evidently","word":"Evidently","category":"Academic adverbs","meaning":"As is apparent from the available evidence.","example":"The revised instructions evidently helped, since fewer students requested clarification.","clue":"As can be inferred from the evidence that is available.","tip":"Evidently signals what the evidence suggests; it does not necessarily express absolute certainty.","aliases":[],"confusable":"Manifestly"},{"id":"intentionally","word":"Intentionally","category":"Academic adverbs","meaning":"Deliberately or on purpose.","example":"The researchers intentionally excluded identifying details from the published dataset.","clue":"On purpose, rather than by accident.","tip":"Intentionally establishes purpose; calculatedly also suggests strategic planning.","aliases":[],"confusable":"Calculatedly"},{"id":"calculatedly","word":"Calculatedly","category":"Academic adverbs","meaning":"Deliberately, with careful planning to achieve a particular result.","example":"The platform calculatedly restricted access to its data to strengthen its negotiating position.","clue":"With a deliberately planned strategy intended to produce a desired result.","tip":"Calculatedly describes strategic intent, often self-serving; it does not mean performing a mathematical calculation.","aliases":[],"confusable":"Intentionally"},{"id":"rationally","word":"Rationally","category":"Academic adverbs","meaning":"Using reason and logic rather than emotion or impulse.","example":"Policymakers should assess the proposed restrictions rationally, weighing likely benefits against potential costs.","clue":"By reasoning logically instead of acting on impulse.","tip":"Rationally concerns logical reasoning; reasonable also often means fair or moderate.","aliases":[],"confusable":null},{"id":"meticulously","word":"Meticulously","category":"Academic adverbs","meaning":"With great attention to detail.","example":"The research team meticulously checked each record before analyzing the survey results.","clue":"With close attention to even the smallest details.","tip":"Meticulously emphasizes detailed care; scrupulously can also emphasize honesty and ethical standards.","aliases":[],"confusable":"Scrupulously"},{"id":"scrupulously","word":"Scrupulously","category":"Academic adverbs","meaning":"With great care, especially to remain honest and follow ethical standards.","example":"Researchers scrupulously respected participants' consent when collecting sensitive educational data.","clue":"With careful attention to doing things properly and honestly.","tip":"Scrupulous can mean careful, but it also stresses honesty and doing what is right.","aliases":[],"confusable":"Meticulously"},{"id":"asserts","word":"Asserts","category":"Argument verbs","meaning":"States a belief or claim confidently.","example":"The author asserts that schools must protect students' personal data.","clue":"States a position firmly and confidently.","tip":"An assertion can sound confident without being supported by evidence.","aliases":["asserts","assert","asserted","asserting"],"confusable":"Demonstrates"},{"id":"maintains","word":"Maintains","category":"Argument verbs","meaning":"Continues to assert or defend a position.","example":"The researcher maintains that smaller classes improve learning despite conflicting studies.","clue":"Continues defending a position, including when others challenge it.","tip":"In argument analysis, this means holding a position; elsewhere, it can mean keeping something in good condition.","aliases":["maintains","maintain","maintained","maintaining"],"confusable":"Contends"},{"id":"posits","word":"Posits","category":"Argument verbs","meaning":"Puts forward an idea or assumption for consideration.","example":"The essay posits that digital access should be treated as a public necessity.","clue":"Proposes an idea or assumption as a starting point for discussion.","tip":"Think of placing an idea on the table; proposing it does not establish that it is true.","aliases":["posits","posit","posited","positing"],"confusable":"Asserts"},{"id":"demonstrates","word":"Demonstrates","category":"Argument verbs","meaning":"Shows something clearly through evidence, explanation, or an example.","example":"The decline in attendance demonstrates how unreliable transport can disrupt education.","clue":"Shows a point clearly through evidence or explanation.","tip":"Ask what is shown and how; a demonstration does not automatically prove every broader claim.","aliases":["demonstrates","demonstrate","demonstrated","demonstrating"],"confusable":"Illustrates"},{"id":"illustrates","word":"Illustrates","category":"Argument verbs","meaning":"Makes an idea clearer by using an example or explanation.","example":"The account of one rural school illustrates the difficulties caused by limited internet access.","clue":"Uses an example to make a general idea easier to understand.","tip":"An illustration clarifies a point; one example may not establish that the point applies everywhere.","aliases":["illustrates","illustrate","illustrated","illustrating"],"confusable":"Demonstrates"},{"id":"exhibits","word":"Exhibits","category":"Argument verbs","meaning":"Displays or shows a quality, feature, or behavior.","example":"The policy exhibits a strong preference for convenience over privacy.","clue":"Displays a particular quality, characteristic, or behavior.","tip":"Think of a display: a text can exhibit bias, confidence, or another observable quality.","aliases":["exhibits","exhibit","exhibited","exhibiting"],"confusable":"Presents"},{"id":"substantiates","word":"Substantiates","category":"Argument verbs","meaning":"Supports a claim with evidence that helps establish its truth.","example":"The national survey substantiates the claim that many students lack reliable internet access.","clue":"Gives a claim substantial evidential support.","tip":"Think substance: evidence gives substance to a claim, rather than merely repeating it.","aliases":["substantiates","substantiate","substantiated","substantiating"],"confusable":"Corroborates"},{"id":"validates","word":"Validates","category":"Argument verbs","meaning":"Confirms that something is sound, accurate, or justified.","example":"Independent testing validates the school's method for detecting errors in its attendance records.","clue":"Confirms the soundness, accuracy, or legitimacy of something.","tip":"To validate is to check validity; identify exactly what the evidence confirms.","aliases":["validates","validate","validated","validating"],"confusable":"Corroborates"},{"id":"corroborates","word":"Corroborates","category":"Argument verbs","meaning":"Adds supporting evidence that confirms an existing account or claim.","example":"A second study corroborates the finding that later start times improve student attendance.","clue":"Provides further evidence that agrees with an existing account.","tip":"Look for an additional source supporting what another source already reported.","aliases":["corroborates","corroborate","corroborated","corroborating"],"confusable":"Substantiates"},{"id":"implies","word":"Implies","category":"Argument verbs","meaning":"Suggests something without stating it directly.","example":"The author's emphasis on parental consent implies that students need greater control over their data.","clue":"Communicates an unstated suggestion that a reader can infer.","tip":"The writer implies; the reader infers. The suggestion need not be negative.","aliases":["implies","imply","implied","implying"],"confusable":"Insinuates"},{"id":"insinuates","word":"Insinuates","category":"Argument verbs","meaning":"Indirectly suggests something unpleasant or damaging.","example":"The editorial insinuates that officials chose the software to benefit their business partners.","clue":"Hints indirectly at an accusation or another negative idea.","tip":"An insinuation carries an unpleasant suggestion, often an accusation, without saying it openly.","aliases":["insinuates","insinuate","insinuated","insinuating"],"confusable":"Implies"},{"id":"constructs","word":"Constructs","category":"Argument verbs","meaning":"Builds an argument or idea by organizing its parts.","example":"The writer constructs an argument for privacy by connecting legal principles with students' experiences.","clue":"Builds a position from connected reasons, evidence, or ideas.","tip":"Think of building: the parts of an argument need connections as well as individual strength.","aliases":["constructs","construct","constructed","constructing"],"confusable":"Formulates"},{"id":"formulates","word":"Formulates","category":"Argument verbs","meaning":"Develops and expresses an idea, plan, or argument precisely.","example":"The committee formulates a policy that limits how educational apps collect student information.","clue":"Develops an idea or plan and puts it into a precise form.","tip":"A formula has a definite form; formulating turns an idea into a clear statement or plan.","aliases":["formulates","formulate","formulated","formulating"],"confusable":"Constructs"},{"id":"counters","word":"Counters","category":"Argument verbs","meaning":"Responds to an argument with an opposing reason or claim.","example":"The author counters the convenience argument by describing the risks of collecting unnecessary data.","clue":"Responds to another position by offering an opposing argument.","tip":"A counter responds against a point; its strength depends on its reasons and evidence.","aliases":["counters","counter","countered","countering"],"confusable":"Disputes"},{"id":"disputes","word":"Disputes","category":"Argument verbs","meaning":"Challenges the truth, accuracy, or validity of a claim.","example":"The researcher disputes the claim that surveillance always makes schools safer.","clue":"Challenges whether a statement or finding is true or valid.","tip":"Disputing questions a claim; countering supplies a response against it. Both need support to persuade.","aliases":["disputes","dispute","disputed","disputing"],"confusable":"Counters"},{"id":"contends","word":"Contends","category":"Argument verbs","meaning":"Argues that a particular claim or position is true.","example":"The essay contends that reliable public transport is essential to equal educational opportunity.","clue":"Argues for the truth of a position, often one others debate.","tip":"In essays, contends usually means argues; in other contexts, people contend with difficulties or for prizes.","aliases":["contends","contend","contended","contending"],"confusable":"Maintains"},{"id":"deconstructs","word":"Deconstructs","category":"Argument verbs","meaning":"Examines an argument's parts and assumptions to reveal how it works.","example":"The critic deconstructs the advertisement's language to expose its assumptions about successful students.","clue":"Takes an argument apart to examine its structure and underlying assumptions.","tip":"Deconstruction closely examines how meaning is built; it does not simply mean destroying an argument.","aliases":["deconstructs","deconstruct","deconstructed","deconstructing"],"confusable":"Dismantles"},{"id":"dismantles","word":"Dismantles","category":"Argument verbs","meaning":"Takes apart an argument by systematically challenging its supporting parts.","example":"The author dismantles the proposal by showing that its costs, benefits, and assumptions are unreliable.","clue":"Systematically attacks an argument's supporting parts until its position loses strength.","tip":"In argument analysis, dismantling suggests a thorough challenge to an argument's support.","aliases":["dismantles","dismantle","dismantled","dismantling"],"confusable":"Deconstructs"},{"id":"glosses-over","word":"Glosses over","category":"Argument verbs","meaning":"Treats something briefly or superficially, avoiding its difficulties or important details.","example":"The report glosses over the privacy risks while praising the new learning platform.","clue":"Passes over a difficulty with too little attention or detail.","tip":"Think of a smooth surface covering problems: the topic appears, but its difficulties receive little attention.","aliases":["glosses over","gloss over","glossed over","glossing over"],"confusable":"Omit"},{"id":"omit","word":"Omit","category":"Argument verbs","meaning":"Leave something out or fail to include it.","example":"Writers who omit relevant evidence may leave readers with an incomplete view of a policy.","clue":"Leave a detail, argument, or item out entirely.","tip":"Omitting leaves something out; glossing over mentions or treats it without enough attention.","aliases":["omit","omits","omitted","omitting"],"confusable":"Glosses over"},{"id":"undermines","word":"Undermines","category":"Argument verbs","meaning":"Weakens the strength, credibility, or effectiveness of something.","example":"The lack of reliable evidence undermines the case for continuous classroom surveillance.","clue":"Weakens a position's support, credibility, or effectiveness.","tip":"Imagine weakening a foundation: the argument may still stand, but it has less support.","aliases":["undermines","undermine","undermined","undermining"],"confusable":"Compromises"},{"id":"compromises","word":"Compromises","category":"Argument verbs","meaning":"Weakens, damages, or puts something at risk.","example":"Collecting unnecessary personal information compromises students' privacy and trust.","clue":"Damages or puts at risk something such as privacy, safety, or integrity.","tip":"Here, compromises means endangers or weakens; it can also mean reaches an agreement through concessions.","aliases":["compromises","compromise","compromised","compromising"],"confusable":"Undermines"},{"id":"condemns","word":"Condemns","category":"Argument verbs","meaning":"Expresses strong disapproval of something as wrong or unacceptable.","example":"The editorial condemns policies that punish students for transport failures beyond their control.","clue":"Judges something strongly as wrong or unacceptable.","tip":"Condemnation expresses strong disapproval; denouncing often emphasizes making that criticism publicly.","aliases":["condemns","condemn","condemned","condemning"],"confusable":"Denounces"},{"id":"denounces","word":"Denounces","category":"Argument verbs","meaning":"Publicly criticizes something strongly as wrong or unacceptable.","example":"The student group denounces the sale of school records to advertising companies.","clue":"Openly or publicly speaks against something with strong disapproval.","tip":"Denouncing emphasizes an open declaration of criticism; its meaning overlaps substantially with condemning.","aliases":["denounces","denounce","denounced","denouncing"],"confusable":"Condemns"},{"id":"utilizes","word":"Utilizes","category":"Argument verbs","meaning":"Uses something for a purpose.","example":"The author utilizes attendance data to examine the effects of free school transport.","clue":"Makes use of a resource, method, or piece of evidence.","tip":"Utilizes usually means uses; the simpler word often works equally well in your own writing.","aliases":["utilizes","utilize","utilized","utilizing","utilises","utilise","utilised","utilising"],"confusable":"Employs"},{"id":"employs","word":"Employs","category":"Argument verbs","meaning":"Uses a method, technique, or resource for a purpose.","example":"The writer employs a comparison between schools to highlight unequal access to technology.","clue":"Uses a particular technique or resource in developing an argument.","tip":"A writer employs techniques; an organization can also employ people by giving them paid work.","aliases":["employs","employ","employed","employing"],"confusable":"Utilizes"},{"id":"cites","word":"Cites","category":"Argument verbs","meaning":"Mentions a source, fact, or example as support.","example":"The essay cites a national survey to support its claim about unequal internet access.","clue":"Names or quotes a source or example to support a point.","tip":"Citing points to supporting material; check whether that material actually supports the claim.","aliases":["cites","cite","cited","citing"],"confusable":"References"},{"id":"references","word":"References","category":"Argument verbs","meaning":"Refers to or mentions a source, idea, event, or other material.","example":"The introduction references earlier debates about government access to personal data.","clue":"Refers to another source, idea, or event in a text.","tip":"Referencing mentions other material; citing often emphasizes using a source as support. The meanings overlap.","aliases":["references","reference","referenced","referencing"],"confusable":"Cites"},{"id":"provides","word":"Provides","category":"Argument verbs","meaning":"Supplies something needed or useful, such as information or evidence.","example":"The report provides evidence that free meals improve students' ability to concentrate.","clue":"Supplies information, evidence, or another useful resource.","tip":"Identify what is supplied: providing evidence does not by itself tell you how strong that evidence is.","aliases":["provides","provide","provided","providing"],"confusable":"Presents"},{"id":"presents","word":"Presents","category":"Argument verbs","meaning":"Sets out information, ideas, or evidence for others to consider.","example":"The author presents three reasons for limiting facial recognition in schools.","clue":"Sets information or an argument before an audience for consideration.","tip":"Presenting concerns how material is put before an audience; providing concerns supplying it. Both can describe evidence.","aliases":["presents","present","presented","presenting"],"confusable":"Provides"},{"id":"emphasizes","word":"Emphasizes","category":"Argument verbs","meaning":"Gives special importance or attention to something.","example":"The conclusion emphasizes the need for clear rules governing student data.","clue":"Stresses a point's importance through special attention or repetition.","tip":"Emphasis makes a point stand out as important; repetition is one way to create it.","aliases":["emphasizes","emphasize","emphasized","emphasizing","emphasises","emphasise","emphasised","emphasising"],"confusable":"Highlights"},{"id":"highlights","word":"Highlights","category":"Argument verbs","meaning":"Draws particular attention to something important or noticeable.","example":"The comparison highlights the difference between schools with reliable broadband and those without it.","clue":"Draws attention to a notable detail, difference, or issue.","tip":"Imagine a highlighter marking a detail for attention; highlighting and emphasizing often overlap.","aliases":["highlights","highlight","highlighted","highlighting"],"confusable":"Emphasizes"},{"id":"administrative","word":"Administrative","category":"Reading vocabulary","meaning":"Related to managing or organizing an institution, business, or system.","example":"Administrative delays prevented the school from distributing new laptops before term began.","clue":"Describes work involving an organization's management, procedures, or records.","tip":"Connect it with administration: scheduling, records, and procedures are common examples.","aliases":["administrative"],"confusable":null},{"id":"sustained","word":"Sustained","category":"Reading vocabulary","meaning":"Continued or maintained over a period of time.","example":"Sustained investment in public transport can reduce barriers to regular school attendance.","clue":"Describes an effort, level, or activity maintained over time.","tip":"Sustained effort lasts beyond a brief burst; it does not have to last forever.","aliases":["sustained"],"confusable":"Perpetually"},{"id":"holistic","word":"Holistic","category":"Reading vocabulary","meaning":"Considering a whole and how its parts connect, rather than examining parts alone.","example":"A holistic approach to attendance considers health, transport, family circumstances, and school climate together.","clue":"Describes considering the whole situation and the connections among its parts.","tip":"Think whole: a holistic view considers how several connected factors shape an outcome.","aliases":["holistic"],"confusable":null},{"id":"inequities","word":"Inequities","category":"Reading vocabulary","meaning":"Unfair differences in opportunities, resources, or treatment.","example":"Unequal broadband access deepens existing inequities between wealthy and low-income communities.","clue":"Unfair disparities in resources, opportunities, or treatment.","tip":"Inequity includes a judgment of unfairness; a difference is not automatically an inequity.","aliases":["inequities","inequity"],"confusable":null},{"id":"absenteeism","word":"Absenteeism","category":"Reading vocabulary","meaning":"Frequent or habitual absence from school or work.","example":"The study links absenteeism to unreliable transport and long waits for medical care.","clue":"A pattern of frequently being absent from school or work.","tip":"Absenteeism describes a pattern of absence; the reasons may include illness, transport problems, or other barriers.","aliases":["absenteeism"],"confusable":null},{"id":"counterproductive","word":"Counterproductive","category":"Reading vocabulary","meaning":"Having an effect that works against the intended goal.","example":"Punishing missed lessons may be counterproductive if it makes anxious students less willing to attend.","clue":"Describes an action that makes its intended goal harder to achieve.","tip":"Counter means against: a counterproductive action works against the result it was meant to produce.","aliases":["counterproductive"],"confusable":null},{"id":"perpetually","word":"Perpetually","category":"Reading vocabulary","meaning":"Continuously or repeatedly over a long time, seemingly without end.","example":"Schools cannot improve digital access if their equipment is perpetually outdated.","clue":"Means continually or repeatedly, as though the situation never ends.","tip":"It can describe literal continuity or exaggerate a repeated problem; use context to decide.","aliases":["perpetually"],"confusable":"Sustained"},{"id":"plummet","word":"Plummet","category":"Reading vocabulary","meaning":"Fall or decrease rapidly and sharply.","example":"Public trust can plummet when a school fails to disclose a serious data breach.","clue":"Drop steeply and quickly, either physically or in amount.","tip":"Picture a sudden steep drop; plummet describes more than a small or gradual decline.","aliases":["plummet","plummets","plummeted","plummeting"],"confusable":null},{"id":"vulnerable","word":"Vulnerable","category":"Reading vocabulary","meaning":"Exposed to harm or at greater risk of being harmed.","example":"Students without secure devices are more vulnerable to online fraud and data theft.","clue":"Describes being exposed to a risk of harm or attack.","tip":"Always ask vulnerable to what: harm may be physical, emotional, financial, or digital.","aliases":["vulnerable"],"confusable":null},{"id":"infer-inference","word":"Infer / inference","category":"Question stems","meaning":"Infer: reach a conclusion from evidence or reasoning. Inference: the conclusion or reasoning process.","example":"Readers can infer from the funding figures that rural schools face greater technological barriers.","clue":"Reach a conclusion from textual evidence, or name that conclusion and the reasoning behind it.","tip":"The writer implies; the reader infers. An inference should follow from evidence rather than unsupported guesswork.","aliases":["infer","inference"],"confusable":"Implies"},{"id":"analyze","word":"Analyze","category":"Question stems","meaning":"Examine parts, relationships, or methods closely to explain how something works.","example":"To analyze the argument, examine how its evidence supports the proposed privacy rules.","clue":"Examine how the parts of a text or argument work together.","tip":"Go beyond listing features: explain how a detail, technique, or relationship contributes to the text.","aliases":["analyze","analyzes","analyzed","analyzing","analyse","analyses","analysed","analysing"],"confusable":"Summarize"},{"id":"convey","word":"Convey","category":"Question stems","meaning":"Communicate or express an idea, feeling, or message.","example":"The students' accounts convey frustration with repeated promises of better internet access.","clue":"Communicate a message, feeling, attitude, or idea to an audience.","tip":"Ask what message reaches the reader and which words or details carry it.","aliases":["convey","conveys","conveyed","conveying"],"confusable":"Implies"},{"id":"summarize","word":"Summarize","category":"Question stems","meaning":"State the main points briefly, leaving out less important details.","example":"A final paragraph can summarize the main reasons for stronger protections of student data.","clue":"Give a brief account of the main points.","tip":"Keep the central ideas and their relationships; a summary should not add your own judgments.","aliases":["summarize","summarizes","summarized","summarizing","summarise","summarises","summarised","summarising"],"confusable":"Analyze"},{"id":"claim","word":"Claim","category":"Argument evaluation","meaning":"A statement that someone puts forward as true and that may require support.","example":"The claim that surveillance improves safety requires evidence about its actual effects in schools.","clue":"A position or statement presented as true in an argument.","tip":"Ask what the writer wants you to accept; then identify the reasons and evidence supporting it.","aliases":["claim","claims"],"confusable":"Evidence"},{"id":"evidence","word":"Evidence","category":"Argument evaluation","meaning":"Information, observations, or facts used to support or challenge a claim.","example":"Attendance records provide evidence that the free bus service helped students reach school regularly.","clue":"Information or facts used to support or test an argument's position.","tip":"Check relevance, reliability, and sufficiency; a source or statistic is not automatically strong evidence.","aliases":["evidence"],"confusable":"Claim"},{"id":"anecdotal","word":"Anecdotal","category":"Argument evaluation","meaning":"Based on individual accounts or experiences rather than systematic research.","example":"The essay offers anecdotal evidence from one teacher but no broader study of classroom technology.","clue":"Describes evidence drawn from personal stories or individual experiences.","tip":"An anecdote can illustrate an issue, but a few experiences may not represent a whole population.","aliases":["anecdotal"],"confusable":"Evidence"},{"id":"counterargument","word":"Counterargument","category":"Argument evaluation","meaning":"An argument that challenges or opposes another argument or position.","example":"A strong counterargument questions whether the proposed privacy rules would prevent useful educational research.","clue":"A reasoned opposing position that challenges an argument.","tip":"A counterargument gives an opposing reason; merely saying you disagree does not develop one.","aliases":["counterargument","counterarguments","counter-argument","counter-arguments"],"confusable":"Counters"},{"id":"affect","word":"Affect","category":"Commonly confused","meaning":"Usually a verb meaning to influence or change something.","example":"Unreliable internet access can affect students' ability to complete homework.","clue":"Usually the verb used when something influences another thing.","tip":"Usually affect is a verb and effect a noun. Affect can also mean emotion in psychology or putting on a manner.","aliases":["affect","affects","affected","affecting"],"confusable":"Effect"},{"id":"effect","word":"Effect","category":"Commonly confused","meaning":"Usually a noun meaning a result or consequence.","example":"One effect of free school transport is improved attendance among students who live far away.","clue":"Usually the noun naming a result or consequence.","tip":"An effect is usually a result. As a verb, effect means bring about, as in effect change.","aliases":["effect","effects"],"confusable":"Affect"},{"id":"evaluate","word":"Evaluate","category":"Commonly confused","meaning":"Judge the quality, value, effectiveness, or significance of something using criteria.","example":"Researchers evaluate the privacy policy by checking whether it limits unnecessary data collection.","clue":"Judge how good, effective, valuable, or significant something is.","tip":"Evaluate uses criteria to reach a judgment; estimate usually gives an approximate amount, value, or extent.","aliases":["evaluate","evaluates","evaluated","evaluating"],"confusable":"Estimate"},{"id":"estimate","word":"Estimate","category":"Commonly confused","meaning":"Make an approximate judgment about an amount, value, size, or extent.","example":"Officials estimate that providing every student with a laptop would cost two million dollars.","clue":"Work out an approximate amount, cost, size, or extent.","tip":"An estimate is approximate; an evaluation judges quality, value, or effectiveness using criteria.","aliases":["estimate","estimates","estimated","estimating"],"confusable":"Evaluate"},{"id":"its","word":"Its","category":"Commonly confused","meaning":"The possessive form of it, indicating something belonging or relating to it.","example":"The school revised its privacy policy after students raised concerns about data collection.","clue":"The possessive form used for something belonging or relating to it.","tip":"Possessive its has no apostrophe, like his or her. If it is or it has fits, use it's.","aliases":["its"],"confusable":"It's"},{"id":"it-s","word":"It's","category":"Commonly confused","meaning":"A contraction of it is or it has.","example":"It's essential that schools explain how they use students' personal information.","clue":"The shortened form of it is or it has.","tip":"Expand it to it is or it has. If neither fits the sentence, the possessive its may be needed.","aliases":["it's","it’s"],"confusable":"Its"}]</script>
<script>
(()=>{
const INTERVALS=[600000,86400000,259200000,604800000,1209600000,2592000000];
const dayKey=(now)=>new Date(now).toLocaleDateString('en-CA');
function createProgress(){return {version:1,words:{},history:[],session:null};}
function loadProgress(raw){
 try{
  const data=JSON.parse(raw);
  if(!data||data.version!==1||!data.words||typeof data.words!=='object'||Array.isArray(data.words))return createProgress();
  const result=createProgress();
  for(const [id,item] of Object.entries(data.words)){
   if(!item||!Number.isInteger(item.stage)||item.stage<0||item.stage>5||!Number.isFinite(item.due)||!Number.isFinite(item.lastReviewed)||!Number.isInteger(item.delayedSuccesses)||item.delayedSuccesses<0)continue;
   result.words[id]={...item,attempts:Number.isInteger(item.attempts)?item.attempts:0};
  }
  result.history=Array.isArray(data.history)?data.history.filter(x=>x&&/^\d{4}-\d{2}-\d{2}$/.test(x.day)&&Array.isArray(x.ids)&&x.ids.every(id=>typeof id==='string')).slice(-365):[];
  const s=data.session;
  if(s&&Array.isArray(s.ids)&&s.ids.length<=20&&s.ids.every(id=>typeof id==='string')&&Array.isArray(s.queue)&&s.queue.length<=300&&s.queue.every(x=>x&&s.ids.includes(x.id)&&['teach','meaning','word'].includes(x.type))&&Number.isInteger(s.index)&&s.index>=0&&s.index<s.queue.length&&s.outcomes&&typeof s.outcomes==='object'&&!Array.isArray(s.outcomes)&&s.retries&&typeof s.retries==='object'&&!Array.isArray(s.retries)){
   const ratingMap=(value)=>Object.fromEntries(Object.entries(value&&typeof value==='object'&&!Array.isArray(value)?value:{}).filter(([id,rating])=>s.ids.includes(id)&&[0,1,2].includes(rating)));
   const feedback=s.feedback&&typeof s.feedback.correct==='boolean'&&typeof s.feedback.input==='string'?{correct:s.feedback.correct,input:s.feedback.input}:null;
   result.session={...s,outcomes:ratingMap(s.outcomes),initialGrades:ratingMap(s.initialGrades),retries:Object.fromEntries(Object.entries(s.retries).filter(([id,count])=>s.ids.includes(id)&&Number.isInteger(count)&&count>=0&&count<=2)),feedback,revealed:s.revealed===true,hinted:s.hinted===true};
  }
  return result;
 }catch{return createProgress();}
}
function scheduleReview(previous,rating,now){
 if(![0,1,2].includes(rating)||!Number.isFinite(now))throw new Error('Invalid review');
 const today=dayKey(now),early=previous&&previous.due>now;
 let stage=previous?.stage??-1;
 let delayedSuccesses=previous?.delayedSuccesses??0;
 if(rating===0){stage=0;delayedSuccesses=0;}
 else if(rating===1)stage=Math.max(0,stage-1);
 else if(!early)stage=Math.min(5,stage+1);
 if(rating===2&&previous?.lastSuccessDay&&previous.lastSuccessDay!==today&&!early)delayedSuccesses++;
 return {stage,due:early&&rating===2?previous.due:now+INTERVALS[stage],delayedSuccesses,lastSuccessDay:rating===0?null:rating===2?today:previous?.lastSuccessDay??null,lastReviewed:now,lastRating:rating,attempts:(previous?.attempts??0)+1};
}
function stats(words,progress,now){
 let fresh=0,learning=0,remembered=0,due=0,nextDue=null;
 for(const word of words){
  const p=progress.words[word.id];
  if(!p){fresh++;continue;}
  if(p.stage>=3&&p.delayedSuccesses>=3)remembered++;else learning++;
  if(p.due<=now)due++;
  else if(nextDue===null||p.due<nextDue)nextDue=p.due;
 }
 return {fresh,learning,remembered,due,nextDue,total:words.length,studied:words.length-fresh};
}
function buildSession(words,progress,mode,now){
 if(!['new','review','practice'].includes(mode))throw new Error('Invalid session mode');
 let selected;
 if(mode==='new'){
  const unseen=words.filter(w=>!progress.words[w.id]);
  const categories=[...new Set(unseen.map(w=>w.category))];
  selected=[];
  while(selected.length<5&&categories.length){
   for(const category of [...categories]){
    const next=unseen.find(w=>w.category===category&&!selected.includes(w));
    if(next)selected.push(next);else categories.splice(categories.indexOf(category),1);
    if(selected.length===5)break;
   }
  }
 }else selected=words.filter(w=>progress.words[w.id]&&(mode==='practice'||progress.words[w.id].due<=now)).sort((a,b)=>progress.words[a.id].due-progress.words[b.id].due).slice(0,20);
 const ids=selected.map(w=>w.id);
 const queue=mode==='new'?ids.map(id=>({id,type:'teach'})):[];
 for(const id of ids)queue.push({id,type:'meaning'},{id,type:'word'});
 return {mode,ids,queue,index:0,outcomes:{},retries:{},initialGrades:{},startedAt:now,revealed:false,hinted:false,feedback:null};
}
const normalize=(s)=>String(s).normalize('NFKC').replace(/[’‘]/g,"'").trim().toLowerCase().replace(/\s+/g,' ');
function gradeAnswer(word,input){
 return [word.word,...(word.aliases??[])].some(answer=>normalize(answer)===normalize(input));
}
function recordReview(progress,id,rating,now){
 const history=progress.history.map(row=>({...row,ids:[...row.ids]}));
 const today=dayKey(now);
 let row=history.find(x=>x.day===today);
 if(!row){row={day:today,ids:[]};history.push(row);}
 if(!row.ids.includes(id))row.ids.push(id);
 return {...progress,words:{...progress.words,[id]:scheduleReview(progress.words[id],rating,now)},history:history.slice(-365)};
}


const KEY='wordwell.progress.v1';
const app=document.querySelector('#app');
const icons={mark:'<path d="M4 6l4 13 4-9 4 9 4-13"/>',book:'<path d="M12 7c-3-3-7-3-9-2v14c3-1 6 0 9 2 3-2 6-3 9-2V5c-2-1-6-1-9 2Zm0 0v14"/>',layers:'<path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',calendar:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 10h16"/>',bulb:'<path d="M8 16c0-2-3-3-3-7a7 7 0 0 1 14 0c0 4-3 5-3 7H8Zm1 3h6m-5 3h4"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',user:'<circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',play:'<path d="m8 4 12 8-12 8V4Z"/>',refresh:'<path d="M20 7a9 9 0 1 0 1 9M20 3v5h-5"/>'};
const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.book}</svg>`;
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let words=[],progress=createProgress(),view='today',search='',category='all',storageNotice='',lastSummary=null,game=null,lastGameSummary=null;
try{progress=loadProgress(localStorage.getItem(KEY));}catch{storageNotice='Your browser is blocking saved progress. You can still study during this visit.';}
const byId=(id)=>words.find(w=>w.id===id);
const current=()=>progress.session?.queue[progress.session.index];
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress));}catch{storageNotice='Progress could not be saved in this browser. Keep this tab open to continue this visit.';}}
function dueText(timestamp){
 if(!timestamp)return 'After your first practice';
 const delta=timestamp-Date.now();
 if(delta<=0)return 'Ready now';
 if(delta<60000)return 'In less than a minute';
 if(delta<3600000)return `In ${Math.ceil(delta/60000)} minutes`;
 if(delta<86400000)return `In ${Math.ceil(delta/3600000)} hours`;
 return new Date(timestamp).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}
const wordStatus=(id)=>{const p=progress.words[id];return !p?'new':p.stage>=3&&p.delayedSuccesses>=3?'remembered':'learning';};
const statusLabel=(status)=>({new:'New',learning:'Learning',remembered:'Remembered'}[status]);
function render(){
 const s=stats(words,progress,Date.now());
 app.innerHTML=`<header class="topbar"><div class="topinner"><a href="#today" class="brand" data-action="nav" data-view="today" aria-label="Wordwell home"><span class="brandmark">${icon('mark')}</span>wordwell<span style="color:#5c8b76">.</span></a><nav class="nav" aria-label="Main navigation">${[['today','Today'],['library','Vocabulary'],['progress','Progress'],['games','Recall']].map(([key,label])=>`<button class="navbtn ${view===key||(['game','game-complete'].includes(view)&&key==='games')?'active':''}" data-action="nav" data-view="${key}" ${view===key||(['game','game-complete'].includes(view)&&key==='games')?'aria-current="page"':''}>${label}</button>`).join('')}</nav><div class="profile"><span>Personal study space</span><div class="profileicon">${icon('user')}</div></div></div></header><main id="main" class="shell" tabindex="-1">${storageNotice?`<div class="notice" role="status">${esc(storageNotice)}</div>`:''}${view==='today'?today(s):view==='library'?library():view==='progress'?progressPage(s):view==='study'?study():view==='games'?gamesPage():view==='game'?gamePage():view==='game-complete'?gameComplete():complete()}</main>`;
 if(view==='study'){
  if(current()?.type==='word'&&!progress.session.feedback)document.querySelector('#answer')?.focus({preventScroll:true});
  else if(progress.session.feedback||current()?.type==='teach')document.querySelector('.studycard [data-action="next"]')?.focus({preventScroll:true});
  else if(!progress.session.revealed)document.querySelector('[data-action="reveal"]')?.focus({preventScroll:true});
  else{const heading=document.querySelector('.studycard h1');heading?.setAttribute('tabindex','-1');heading?.focus({preventScroll:true});}
 }
}
function statCards(s){return `<div class="statsgrid"><div class="stat"><div class="staticon">${icon('layers')}</div><div><div class="statnum">${s.fresh}</div><div class="statlabel">New words</div></div></div><div class="stat"><div class="staticon learning">${icon('book')}</div><div><div class="statnum">${s.learning}</div><div class="statlabel">Still learning</div></div></div><div class="stat"><div class="staticon remembered">${icon('check')}</div><div><div class="statnum">${s.remembered}</div><div class="statlabel">Remembered</div></div></div></div>`;}
function track(s){return `<div class="progress-track" role="img" aria-label="${s.remembered} remembered, ${s.learning} learning, ${s.fresh} new"><span class="remember" style="width:${s.remembered/s.total*100}%"></span><span class="learn" style="width:${s.learning/s.total*100}%"></span></div>`;}
function footer(){return `<footer class="footer"><span>${icon('lock')} Progress saves in this browser</span><span>103 entries · A little practice every day</span></footer>`;}
function today(s){
 const next=buildSession(words,progress,'new',Date.now()).ids.map(byId);
 const preview=next[0]||words.find(w=>wordStatus(w.id)==='learning')||words[0];
 const resume=!!progress.session;
 const title=resume?'Pick up where you left off':s.due?'Time to bring them back':s.fresh?'Your next five words':'Keep your vocabulary fresh';
 const button=resume?'Resume practice':s.due?`Review ${Math.min(s.due,20)} words`:s.fresh?'Learn five words':'Practice learned words';
 const mode=s.due?'review':s.fresh?'new':'practice';
 return `<div class="pageintro"><div><div class="eyebrow">Your daily practice</div><h1>Make it stick.</h1><p class="subtle">A few words today. A stronger vocabulary tomorrow.</p></div><div class="date">${icon('calendar')}${new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</div></div>${statCards(s)}<div class="workgrid"><section><div class="sectiontitle"><h2>${title}</h2><span class="smalllabel">${s.due?'Review first':`${Math.min(next.length,5)} new words · About 10 minutes`}</span></div><div class="lessonpanel"><div class="lessonmeta"><span class="pill green">${esc(preview.category)}</span><span class="smalllabel">A word to get you started</span></div><h2 class="word-display">${esc(preview.word)}</h2><p class="word-meaning">${esc(preview.meaning)}</p><div class="example"><span class="example-label">In a sentence</span>“${esc(preview.example)}”</div><div class="panelbottom"><p>Learn it. Recall it. Make it yours.</p><button class="btn" data-action="start" data-mode="${mode}">${icon(resume?'play':s.due?'refresh':'book')}${button}</button></div></div><div class="queuepanel"><div class="queueleft"><div class="queueicon">${icon('clock')}</div><div><h3>${s.due?`${s.due} ${s.due===1?'word is':'words are'} ready for review`:'Your review queue is clear'}</h3><p>${s.due?'A quick recall now helps these words stay.':s.nextDue?`Next review: ${dueText(s.nextDue)}.`:'Your first words return about 10 minutes after practice.'}</p></div></div>${s.due?'<button class="textbtn" data-action="start" data-mode="review">Review now</button>':icon('check')}</div></section><aside class="aside"><div class="plan"><div class="eyebrow">A rhythm that works</div><h2>Small steps. Better recall.</h2><p>Try 10–15 minutes a day. The website keeps track of what needs another look.</p><div class="rhythm"><span class="rhythmnum">1</span><div>Learn the meaning<small>Short explanations and real examples</small></div></div><div class="rhythm"><span class="rhythmnum">2</span><div>Recall without looking<small>Explain it, then find the word</small></div></div><div class="rhythm"><span class="rhythmnum">3</span><div>Return at the right time<small>Review after a gap, then across days</small></div></div></div><div class="tipcard"><h3>${icon('bulb')} A little memory tip</h3><p>Before revealing an answer, try saying it aloud. The effort of remembering is part of the practice.</p></div></aside></div><section class="overview"><div class="overviewtop"><h3>Your vocabulary, growing</h3><span>${s.studied} of 103 entries practiced</span></div>${track(s)}<div class="legend"><span><i class="dot"></i>New</span><span><i class="dot learn"></i>Learning</span><span><i class="dot remember"></i>Remembered across days</span></div></section>${footer()}`;
}
function library(){
 const filtered=words.filter(w=>(category==='all'||w.category===category)&&`${w.word} ${w.meaning}`.toLowerCase().includes(search.toLowerCase()));
 return `<div class="pageintro"><div><div class="eyebrow">Your complete collection</div><h1>103 words. All within reach.</h1><p class="subtle">Look up a meaning, revisit an example, or compare similar words.</p></div></div><div class="librarytools"><label class="sr-only" for="search">Search vocabulary</label><input id="search" class="search" type="search" placeholder="Search a word or meaning…" value="${esc(search)}"><label class="sr-only" for="category">Vocabulary category</label><select id="category" class="filter"><option value="all">All categories</option>${[...new Set(words.map(w=>w.category))].map(c=>`<option ${category===c?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div><p class="librarycount" aria-live="polite">${filtered.length} ${filtered.length===1?'entry':'entries'}</p><div class="wordlist">${filtered.map(w=>{const status=wordStatus(w.id);const other=words.find(x=>x.word.toLowerCase()===w.confusable?.toLowerCase());return `<article class="wordentry"><div class="entrytop"><h2 class="entryword">${esc(w.word)}</h2><span class="status ${status}">${statusLabel(status)}</span></div><div class="entrycategory">${esc(w.category)}</div><p>${esc(w.meaning)}</p><details><summary>Example & memory tip</summary><p>“${esc(w.example)}”</p><p>${esc(w.tip)}</p>${other?`<p><strong>Compare ${esc(other.word)}:</strong> ${esc(other.meaning)}</p>`:''}</details></article>`;}).join('')||'<div class="empty"><h2>No matching words</h2><p>Try another search or choose all categories.</p></div>'}</div>${footer()}`;
}
const GAME_MODES={
 mcq:{title:'MCQ',detail:'Recall a word from its definition and choose the best answer.'},
 matching:{title:'Matching',detail:'Pair each vocabulary word with its meaning.'},
 dragdrop:{title:'Drag and drop',detail:'Drag each word onto its matching definition, or use the buttons.'},
 multiple:{title:'Multiple selection',detail:'Read three clues and select all three matching words.'}
};
function shuffled(items){
 const result=[...items];
 for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}
 return result;
}
function gamesPage(){
 return `<div class="pageintro"><div><div class="eyebrow">Active recall</div><h1>Play with your words.</h1><p class="subtle">Choose a quick challenge to bring vocabulary back from memory.</p></div></div>${game?'<div class="game-panel game-hub-link"><p>You have an activity in progress.</p><button class="btn" data-action="resume-game">Continue activity</button></div>':''}<div class="game-menu">${Object.entries(GAME_MODES).map(([type,info])=>`<section class="game-choice"><div class="game-tag">Word recall</div><h2>${info.title}</h2><p>${info.detail}</p><button class="btn secondary" data-action="start-game" data-game="${type}">Start ${info.title}</button></section>`).join('')}</div>${footer()}`;
}
function startGame(type){
 if(!Object.hasOwn(GAME_MODES,type))throw new Error('Choose a valid recall activity.');
 const size=type==='mcq'?5:type==='multiple'?3:4;
 const entries=shuffled(words).slice(0,size);
 const ids=entries.map(word=>word.id);
 if(type==='mcq'){
  game={type,ids,index:0,score:0,questions:entries.map(word=>({id:word.id,options:shuffled([word.id,...shuffled(words.filter(item=>item.id!==word.id)).slice(0,3).map(item=>item.id)])})),feedback:null};
 }else if(type==='multiple'){
  game={type,ids,index:0,score:0,options:shuffled([...ids,...shuffled(words.filter(word=>!ids.includes(word.id))).slice(0,3).map(word=>word.id)]),selected:[],checked:false};
 }else{
  game={type,ids,targets:shuffled(ids),score:0,pairs:{},selectedWord:null,selectedTarget:null,checked:false};
 }
 view='game';render();window.scrollTo({top:0});
}
function gamesPageAction(){view='games';render();window.scrollTo({top:0});}
function recordGameResult(id,correct){progress=recordReview(progress,id,correct?2:0,Date.now());save();}
function chooseMatchWord(id){
 if(!game||game.checked)return;
 game.selectedWord=game.selectedWord===id?null:id;
 if(game.selectedWord&&game.selectedTarget){
  for(const [wordId,targetId] of Object.entries(game.pairs)){
   if(wordId===game.selectedWord||targetId===game.selectedTarget)delete game.pairs[wordId];
  }
  game.pairs[game.selectedWord]=game.selectedTarget;
  game.selectedWord=null;game.selectedTarget=null;
 }
 render();
}
function chooseMatchTarget(id){
 if(!game||game.checked)return;
 game.selectedTarget=game.selectedTarget===id?null:id;
 if(game.selectedWord&&game.selectedTarget){
  for(const [wordId,targetId] of Object.entries(game.pairs)){
   if(wordId===game.selectedWord||targetId===game.selectedTarget)delete game.pairs[wordId];
  }
  game.pairs[game.selectedWord]=game.selectedTarget;
  game.selectedWord=null;game.selectedTarget=null;
 }
 render();
}
function assignDrop(wordId,targetId){
 if(!game||game.type!=='dragdrop'||game.checked||!game.ids.includes(wordId)||!game.targets.includes(targetId))return;
 for(const [existingWord,existingTarget] of Object.entries(game.pairs)){
  if(existingWord===wordId||existingTarget===targetId)delete game.pairs[existingWord];
 }
 game.pairs[wordId]=targetId;game.selectedWord=null;game.selectedTarget=null;render();
}
function chooseDropWord(id){
 if(!game||game.type!=='dragdrop'||game.checked)return;
 game.selectedWord=game.selectedWord===id?null:id;
 if(game.selectedWord&&game.selectedTarget)assignDrop(game.selectedWord,game.selectedTarget);
 else render();
}
function chooseDropTarget(id){
 if(!game||game.type!=='dragdrop'||game.checked)return;
 game.selectedTarget=game.selectedTarget===id?null:id;
 if(game.selectedWord&&game.selectedTarget)assignDrop(game.selectedWord,game.selectedTarget);
 else render();
}
function checkPairs(){
 if(!game||game.checked)return;
 if(game.ids.some(id=>!game.pairs[id])){game.error='Pair every word before checking your answers.';render();return;}
 game.error='';game.checked=true;
 game.score=game.ids.filter(id=>game.pairs[id]===id).length;
 for(const id of game.ids)recordGameResult(id,game.pairs[id]===id);
 render();
}
function toggleMultiple(id){
 if(!game||game.type!=='multiple'||game.checked)return;
 game.selected=game.selected.includes(id)?game.selected.filter(value=>value!==id):[...game.selected,id];
 render();
}
function submitMultiple(){
 if(!game||game.type!=='multiple'||game.checked)return;
 const correct=game.ids.filter(id=>game.selected.includes(id));
 const extra=game.selected.filter(id=>!game.ids.includes(id));
 game.score=Math.max(0,correct.length-extra.length);
 game.checked=true;
 for(const id of game.ids)recordGameResult(id,game.selected.includes(id));
 render();
}
function answerMultipleChoice(id){
 if(!game||game.type!=='mcq'||game.feedback)return;
 const word=byId(game.ids[game.index]);
 const correct=id===word.id;
 game.feedback={selected:id,correct};
 if(correct)game.score++;
 recordGameResult(word.id,correct);
 render();
}
function advanceGame(){
 if(!game)return;
 if(game.type==='mcq'){
  game.index++;
  if(game.index<game.ids.length){game.feedback=null;render();return;}
 }
 lastGameSummary={type:game.type,count:game.ids.length,correct:game.score};
 game=null;view='game-complete';render();window.scrollTo({top:0});
}
function gamePage(){
 if(!game)return `<section class="empty"><h1>No activity in progress</h1><button class="btn" data-action="nav" data-view="games">Choose an activity</button></section>`;
 const info=GAME_MODES[game.type];
 const completed=game.type==='mcq'?game.index:game.checked?game.ids.length:0;
 const progressPercent=completed/game.ids.length*100;
 const toolbar=`<div class="studytoolbar"><button class="textbtn" data-action="nav" data-view="games">All recall games</button><span>${info.title} · ${game.type==='mcq'?`${game.index+1} of ${game.ids.length}`:`${game.ids.length} words`}</span></div><div class="progress-track" aria-label="Activity progress"><span class="remember" style="width:${progressPercent}%"></span></div><p class="game-instructions">${info.detail}</p>`;
 if(game.type==='mcq'){
  const question=game.questions[game.index],word=byId(question.id);
  return `<div class="studywrap">${toolbar}<section class="game-panel"><div class="game-tag">Question ${game.index+1} of ${game.ids.length}</div><h1 class="prompt">${esc(word.clue)}</h1><p class="subtle">Which vocabulary word matches this clue?</p><div class="game-options">${question.options.map(id=>`<button class="game-option ${game.feedback?.selected===id?(game.feedback.correct?'correct':'incorrect'):game.feedback&&id===word.id?'correct':''}" data-action="answer-game" data-answer-id="${esc(id)}" ${game.feedback?'disabled':''}>${esc(byId(id).word)}</button>`).join('')}</div>${game.feedback?`<div class="game-feedback ${game.feedback.correct?'':'incorrect'}" role="status">${game.feedback.correct?'Correct — nice recall.':`The answer is ${esc(word.word)}.`} ${esc(word.meaning)}</div><div class="game-actions"><span class="game-score">${game.score} / ${game.index+1} correct</span><button class="btn" data-action="advance-game">${game.index+1===game.ids.length?'See results':'Next question'}</button></div>`:''}</section></div>`;
 }
 if(game.type==='multiple'){
  const prompts=game.ids.map(id=>byId(id));
  return `<div class="studywrap">${toolbar}<section class="game-panel"><div class="game-tag">Select all ${game.ids.length} words</div><h1 class="prompt">Which words match these clues?</h1><div class="multiple-prompts">${prompts.map((word,i)=>`<div class="multiple-prompt"><strong>${i+1}.</strong> ${esc(word.clue)}</div>`).join('')}</div><div class="game-options">${game.options.map(id=>{const correct=game.ids.includes(id),selected=game.selected.includes(id);return `<button class="game-option ${game.checked?(selected===correct?(correct?'correct':''):'incorrect'):''}" data-action="toggle-game-option" data-option-id="${esc(id)}" aria-pressed="${selected}" ${game.checked?'disabled':''}>${esc(byId(id).word)}</button>`;}).join('')}</div>${game.checked?`<div class="game-feedback ${game.score===game.ids.length?'':'incorrect'}" role="status">${game.score===game.ids.length?'Perfect selection.':`You matched ${game.score} of ${game.ids.length} clues.`} Correct words: ${prompts.map(word=>esc(word.word)).join(', ')}.</div><div class="game-actions"><span class="game-score">${game.score} / ${game.ids.length} matched</span><button class="btn" data-action="advance-game">See results</button></div>`:`<div class="game-actions"><span class="smalllabel">${game.selected.length} selected</span><button class="btn" data-action="submit-multiple">Check selection</button></div>`}</section></div>`;
 }
 const matching=game.type==='matching';
 const wordTiles=game.ids.map(id=>{const targetId=game.pairs[id];const correct=game.checked&&targetId===id;const incorrect=game.checked&&!correct;return `<button class="match-item ${game.selectedWord===id?'selected':''} ${game.checked?(correct?'correct':incorrect?'incorrect':''):''}" data-action="${matching?'select-match-word':'select-drop-word'}" data-word-id="${esc(id)}" ${!matching?'draggable="true" data-game-drag-id="'+esc(id)+'"':''} aria-pressed="${game.selectedWord===id}" ${game.checked?'disabled':''}>${esc(byId(id).word)}${targetId?`<small>Paired with: ${esc(byId(targetId).word)}</small>`:''}</button>`;}).join('');
 const targetTiles=game.targets.map(id=>{const wordId=Object.keys(game.pairs).find(key=>game.pairs[key]===id);const correct=game.checked&&wordId===id;const incorrect=game.checked&&!correct;return `<button class="${matching?'match-item':'drop-target'} ${game.selectedTarget===id?'selected':''} ${game.type==='dragdrop'?'drop-target':''} ${game.checked?(correct?'correct':incorrect?'incorrect':''):''}" data-action="${matching?'select-match-target':'select-drop-target'}" data-target-id="${esc(id)}" ${game.checked?'disabled':''} aria-pressed="${game.selectedTarget===id}">${game.type==='dragdrop'?`<span class="drop-word">${wordId?esc(byId(wordId).word):'Drop a word here'}</span><span>${esc(byId(id).meaning)}</span>`:esc(byId(id).meaning)}${matching&&wordId?`<small>Paired with: ${esc(byId(wordId).word)}</small>`:''}</button>`;}).join('');
 return `<div class="studywrap">${toolbar}<section class="game-panel"><h1 class="prompt">${matching?'Match each word to its meaning':'Drag each word onto its meaning'}</h1><div class="match-grid"><div class="match-column"><h3>Words</h3>${wordTiles}</div><div class="match-column"><h3>Meanings</h3>${targetTiles}</div></div>${game.checked?`<div class="game-feedback ${game.score===game.ids.length?'':'incorrect'}" role="status">You matched ${game.score} of ${game.ids.length} words correctly.</div><div class="game-actions"><span class="game-score">${game.score} / ${game.ids.length} correct</span><button class="btn" data-action="advance-game">See results</button></div>`:`${game.error?`<p class="feedback incorrect" role="status">${esc(game.error)}</p>`:''}<div class="game-actions"><span class="smalllabel">${matching?'Choose a word, then its meaning.':'Drag a word onto a meaning, or click a word and a meaning.'}</span><button class="btn" data-action="check-pairs">Check matches</button></div>`}</section></div>`;
}
function gameComplete(){
 const summary=lastGameSummary||{type:'mcq',count:0,correct:0};
 return `<div class="studywrap"><section class="empty game-complete"><div class="complete-icon">${icon('check')}</div><div class="eyebrow">${esc(GAME_MODES[summary.type].title)} complete</div><h1>Every recall is practice.</h1><span class="game-score">${summary.correct} / ${summary.count}</span><p>You recalled ${summary.correct} ${summary.correct===1?'word':'words'} correctly. Your answers are included in your review schedule.</p><button class="btn" data-action="nav" data-view="games">Choose another activity</button></section></div>`;
}
function progressPage(s){
 const cats=[...new Set(words.map(w=>w.category))];
 const max=Math.max(5,...progress.history.map(x=>x.ids.length));
 const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return {date:d,key:dayKey(d.getTime())};});
 const upcoming=words.filter(w=>progress.words[w.id]).sort((a,b)=>progress.words[a.id].due-progress.words[b.id].due).slice(0,5);
 return `<div class="pageintro"><div><div class="eyebrow">Proof of your practice</div><h1>Every recall adds up.</h1><p class="subtle">Remembered means successful recall on at least three later days.</p></div></div>${statCards(s)}<div class="progresscards"><section class="progressbox"><h2>Practice this week</h2><p>Distinct words practiced each day. Repeating a word counts once here.</p><div class="daybars">${days.map(({date,key},i)=>{const count=progress.history.find(x=>x.day===key)?.ids.length||0;return `<div class="daybar ${i===6?'today':''}"><span class="count">${count}</span><span class="bar" style="height:${Math.max(4,count/max*90)}px"></span><span>${date.toLocaleDateString(undefined,{weekday:'short'})}</span></div>`;}).join('')}</div></section><section class="progressbox"><h2>Your next review</h2><p>${s.due?`${s.due} words are ready now.`:s.nextDue?`Next review: ${dueText(s.nextDue)}.`:'Start a lesson to build your review queue.'}</p><div class="nextlist">${upcoming.map(w=>`<span>${esc(w.word)}</span>`).join('')}</div><button class="btn soft" style="margin-top:24px" data-action="start" data-mode="${s.due?'review':s.studied?'practice':'new'}">${s.due?'Review due words':s.studied?'Practice learned words':'Learn your first five'}</button><p style="font-size:.78rem;margin:12px 0 0">Early practice helps you rehearse. Only later, due reviews advance your schedule.</p></section><section class="progressbox" style="grid-column:1/-1"><h2>Across your categories</h2>${cats.map(c=>{const subset=words.filter(w=>w.category===c);const cs=stats(subset,progress,Date.now());return `<div class="categoryrow"><div class="categoryname"><span>${esc(c)}</span><span>${cs.studied} / ${cs.total} practiced · ${cs.remembered} remembered</span></div>${track(cs)}</div>`;}).join('')}</section></div>${footer()}`;
}
function study(){
 const session=progress.session,item=current(),w=byId(item?.id);
 if(!session||!w)return '<div class="empty"><h2>No active practice</h2><button class="btn" data-action="nav" data-view="today">Back to today</button></div>';
 const step=item.type==='teach'?1:item.type==='meaning'?2:3;
 const index=session.ids.indexOf(w.id)+1;
 const percent=session.index/session.queue.length*100;
 const meta=`<div class="lessonmeta"><span class="pill green">${esc(w.category)}</span><span class="smalllabel">Word ${index} of ${session.ids.length}${session.retries[w.id]?' · Another look':''}</span></div>`;
 let content;
 if(item.type==='teach'){
  const other=words.find(x=>x.word.toLowerCase()===w.confusable?.toLowerCase());
  content=`${meta}<h1 class="word-display">${esc(w.word)}</h1><p class="word-meaning">${esc(w.meaning)}</p><div class="example"><span class="example-label">In a sentence</span>“${esc(w.example)}”</div><div class="memorytip">${icon('bulb')}<span>${esc(w.tip)}</span></div>${other?`<p class="subtle" style="font-size:.85rem;margin-top:16px"><strong>Compare ${esc(other.word)}:</strong> ${esc(other.meaning)}</p>`:''}<div class="studyactions"><span class="smalllabel">Read it, then put it into your own words.</span><button class="btn" data-action="next">${index===session.ids.length?'Try recalling them':'Next word'}</button></div>`;
 }else if(item.type==='meaning'){
