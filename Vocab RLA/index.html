  content=`${meta}<div class="eyebrow" style="margin-top:27px">Recall the meaning</div><h1 class="word-display meaning-recall">${esc(w.word)}</h1><p class="subtle" style="margin-bottom:23px">What does it mean? Explain it aloud or in your head.</p>${session.revealed?`<div class="feedback" role="status"><strong>${esc(w.meaning)}</strong><p>“${esc(w.example)}”</p></div><p class="subtle" style="font-size:.85rem;margin-top:18px">Did your answer capture the main meaning? Your own wording is fine.</p><div class="ratingbuttons"><button data-action="rate" data-rating="0">Forgot</button><button data-action="rate" data-rating="1">Almost</button><button data-action="rate" data-rating="2">Remembered</button></div>`:`<div class="revealplaceholder">Give yourself a moment to retrieve it.<br>Then compare your answer with the meaning.</div><div class="studyactions"><span class="smalllabel">Try before you look.</span><button class="btn" data-action="reveal">Reveal meaning</button></div>`}`;
 }else{
  const target=w.word.split('/')[0].trim();
  const letters=target.replace(/[^a-z]/gi,'').length;
  const pattern=target.replace(/[a-z]/gi,(c,i)=>i===0?c.toUpperCase():'·');
  const hinted=session.hinted;
  let hintExample=w.example;
  for(const term of [target,...w.aliases].sort((a,b)=>b.length-a.length)){
   const safe=term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   hintExample=hintExample.replace(new RegExp(`\\b${safe}\\b`,'gi'),'______');
  }
  content=`${meta}<div class="eyebrow" style="margin-top:27px">Find the word</div><h1 class="prompt">${esc(w.clue)}</h1><div class="cue"><code>${esc(pattern)}</code><span>${letters} letters${target.includes(' ')?' · A phrase':''}</span></div>${session.feedback?`<div class="feedback ${session.feedback.correct?'':'incorrect'}" role="status"><strong>${session.feedback.correct?'That’s it.':'The word is '+esc(w.word)+'.'}</strong>${session.feedback.correct&&session.feedback.input.toLowerCase()!==w.word.toLowerCase()?`<p>You used an accepted form of ${esc(w.word)}.</p>`:''}<p>${esc(w.meaning)}</p><p>“${esc(w.example)}”</p></div><div class="memorytip">${icon('bulb')}<span>${esc(w.tip)}</span></div><div class="studyactions"><span class="smalllabel">${session.feedback.correct?'A successful retrieval. Keep going.':'You’ll get another chance after a gap.'}</span><button class="btn" data-action="next">Continue</button></div>`:`<form id="answerform"><label class="inputlabel" for="answer">Which word from your collection fits?</label><input id="answer" class="answerinput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type the word…" aria-describedby="answerhelp"><span id="answerhelp" class="smalllabel" style="display:block;margin-top:9px">Use the first letter and length to identify the target. Listed verb forms are accepted.</span><div id="answererror" role="status"></div>${hinted?`<div class="example" style="margin-top:20px;margin-bottom:0"><span class="example-label">Sentence hint</span>“${esc(hintExample)}”</div>`:''}<div class="studyactions"><button class="textbtn" type="button" data-action="hint" ${hinted?'disabled':''}>${hinted?'Hint shown':'Show a sentence hint'}</button><button class="btn" type="submit">Check answer</button></div><button class="textbtn" type="button" data-action="skip" style="margin-top:10px;color:#7d8a8f;font-weight:400">I don’t know yet</button></form>`}`;
 }
 return `<div class="studywrap"><div class="studytoolbar"><button class="textbtn" data-action="pause">Save & leave</button><span>${session.mode==='new'?'Learn five':'Recall practice'} · ${session.index+1} / ${session.queue.length} steps</span></div><div class="progress-track" aria-label="Session progress"><span class="remember" style="width:${percent}%"></span></div><div class="studysteps">${[[1,'Learn'],[2,'Recall meaning'],[3,'Find the word']].map(([n,label])=>`<span class="${n===step?'active':''}"><i class="stepcircle">${n}</i>${label}</span>`).join('')}</div><section class="studycard">${content}</section><p class="smalllabel" style="text-align:center;margin-top:20px">${item.type==='teach'?'Understanding comes first.':'A little effort now makes future recall easier.'}</p></div>`;
}
function complete(){
 const summary=lastSummary||{count:0,correct:0,again:0};
 return `<div class="studywrap"><section class="empty complete"><div class="complete-icon">${icon('check')}</div><div class="eyebrow">Practice complete</div><h1>You showed up. It adds up.</h1><p>You practiced ${summary.count} ${summary.count===1?'entry':'entries'}. Your next reviews are scheduled.</p><div class="summarynumbers"><div><strong>${summary.correct}</strong><span>Recalled first time</span></div><div><strong>${summary.again}</strong><span>Needed another look</span></div></div><p>Come back when your review queue is ready. A word becomes “Remembered” after successful recall on three later days.</p><button class="btn" data-action="nav" data-view="today">Back to today</button></section></div>`;
}
function start(mode){
 if(!['new','review','practice'].includes(mode))throw new Error('Choose new, review or practice.');
 if(!progress.session)progress.session=buildSession(words,progress,mode,Date.now());
 if(!progress.session.queue.length){progress.session=null;view='today';render();return {started:false,reason:'No eligible entries.'};}
 view='study';save();render();window.scrollTo({top:0});return {started:true,mode:progress.session.mode,entries:progress.session.ids.length};
}
function next(){
 const s=progress.session;if(!s)return;
 s.index++;s.revealed=false;s.hinted=false;s.feedback=null;
 if(s.index>=s.queue.length){lastSummary={count:s.ids.length,correct:Object.values(s.initialGrades).filter(x=>x===2).length,again:Object.values(s.initialGrades).filter(x=>x<2).length};progress.session=null;view='complete';}
 save();render();
}
function check(input,skip=false){
 const s=progress.session,w=byId(current()?.id);
 if(!s||!w||current().type!=='word'||s.feedback)return;
 if(!skip&&!input.trim()){document.querySelector('#answererror').textContent='Type your answer, or choose “I don’t know yet”.';document.querySelector('#answer')?.focus();return;}
 const correct=!skip&&gradeAnswer(w,input);
 const rawRating=correct?(s.hinted?1:2):0;
 const rating=Math.min(rawRating,s.outcomes[w.id]??2);
 s.feedback={correct,input};
 if(s.initialGrades[w.id]===undefined)s.initialGrades[w.id]=rating;
 progress=recordReview(progress,w.id,rating,Date.now());
 if(rating<2&&(s.retries[w.id]??0)<2&&s.ids.length>1){
  s.retries[w.id]=(s.retries[w.id]??0)+1;
  const future=s.queue.length-s.index-1;
  if(future<2){const other=s.ids.find(id=>id!==w.id);if(other)s.queue.push({id:other,type:'meaning'},{id:other,type:'word'});}
  const position=Math.min(s.index+3,s.queue.length);
  s.queue.splice(position,0,{id:w.id,type:'meaning'},{id:w.id,type:'word'});
 }
 save();render();
}
app.addEventListener('click',(event)=>{
 const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
 event.preventDefault();
 switch(button.dataset.action){
 case 'nav':view=button.dataset.view;render();window.scrollTo({top:0});break;
 case 'start-game':startGame(button.dataset.game);break;
 case 'resume-game':view='game';render();window.scrollTo({top:0});break;
 case 'answer-game':answerMultipleChoice(button.dataset.answerId);break;
 case 'advance-game':advanceGame();break;
 case 'select-match-word':chooseMatchWord(button.dataset.wordId);break;
 case 'select-match-target':chooseMatchTarget(button.dataset.targetId);break;
 case 'select-drop-word':chooseDropWord(button.dataset.wordId);break;
 case 'select-drop-target':chooseDropTarget(button.dataset.targetId);break;
 case 'check-pairs':checkPairs();break;
 case 'toggle-game-option':toggleMultiple(button.dataset.optionId);break;
 case 'submit-multiple':submitMultiple();break;
 case 'start':start(button.dataset.mode);break;
 case 'pause':view='today';save();render();break;
 case 'next':next();break;
 case 'reveal':progress.session.revealed=true;save();render();break;
 case 'rate':progress.session.outcomes[current().id]=Number(button.dataset.rating);next();break;
 case 'hint':progress.session.hinted=true;save();render();break;
 case 'skip':check('',true);break;
 }
});
app.addEventListener('dragstart',(event)=>{
 const tile=event.target.closest('[data-game-drag-id]');
 if(!tile||!game||game.type!=='dragdrop'||game.checked||!event.dataTransfer)return;
 game.selectedWord=tile.dataset.gameDragId;
 event.dataTransfer.setData('text/plain',tile.dataset.gameDragId);
 event.dataTransfer.effectAllowed='move';
});
app.addEventListener('dragover',(event)=>{
 const target=event.target.closest('[data-action="select-drop-target"]');
 if(target&&game?.type==='dragdrop'&&!game.checked){event.preventDefault();target.classList.add('drag-over');}
});
app.addEventListener('dragleave',(event)=>{
 const target=event.target.closest('[data-action="select-drop-target"]');
 if(target)target.classList.remove('drag-over');
});
app.addEventListener('drop',(event)=>{
 const target=event.target.closest('[data-action="select-drop-target"]');
 if(!target||!game||game.type!=='dragdrop'||game.checked)return;
 event.preventDefault();target.classList.remove('drag-over');
 assignDrop(event.dataTransfer.getData('text/plain'),target.dataset.targetId);
});
app.addEventListener('submit',(event)=>{if(event.target.id==='answerform'){event.preventDefault();check(document.querySelector('#answer').value);}});
app.addEventListener('input',(event)=>{
 if(event.target.id==='search'){
  const position=event.target.selectionStart;search=event.target.value;render();
  const field=document.querySelector('#search');field.focus();field.setSelectionRange(position,position);
 }
});
app.addEventListener('change',(event)=>{if(event.target.id==='category'){category=event.target.value;render();document.querySelector('#category')?.focus();}});
function registerTools(){
 const context=document.modelContext;if(!context?.registerTool)return;
 const lifetime=new AbortController();window.addEventListener('pagehide',()=>lifetime.abort(),{once:true});
 const definitions=[
  {name:'read_vocabulary_progress',title:'Read vocabulary progress',description:'Read vocabulary counts and due-review information for this browser. Does not reveal quiz answers or change progress.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length)throw new Error('Expected an empty object.');return stats(words,progress,Date.now());}},
  {name:'start_vocabulary_session',title:'Start vocabulary practice',description:'Start or resume a visible study session. Does not answer questions or award recall credit.',inputSchema:{type:'object',properties:{mode:{type:'string',enum:['new','review','practice']}},required:['mode'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||Object.keys(input).some(k=>k!=='mode')||!['new','review','practice'].includes(input.mode))throw new Error('Expected a valid mode.');return start(input.mode);}}
 ];
 for(const tool of definitions){try{Promise.resolve(context.registerTool(tool,{signal:lifetime.signal})).catch(()=>{});}catch{}}
}
try{
 words=JSON.parse(document.getElementById('vocabulary-data').textContent);
 if(!Array.isArray(words)||words.length!==103)throw new Error('Lesson collection incomplete');
 const ids=new Set(words.map(w=>w.id));
 progress.words=Object.fromEntries(Object.entries(progress.words).filter(([id])=>ids.has(id)));
 if(progress.session&&!progress.session.queue.every(item=>ids.has(item.id)))progress.session=null;
 render();registerTools();
 setInterval(()=>{if(view==='today'||view==='progress')render();},60000);
}catch{
 app.innerHTML='<main class="shell"><section class="empty"><h1>Let’s try opening that again.</h1><p>The vocabulary lessons could not load. Refresh this page to try again.</p><button class="btn" onclick="location.reload()">Refresh page</button></section></main>';
}

})();
</script>
</body>
</html>
